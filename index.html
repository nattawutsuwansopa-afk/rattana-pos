    const raw=sessionStorage.getItem(STORAGE_KEY+'_session');

    const u=state.users.find(x=>x.id===saved.id&&x.active);

}

}

function daysUntil(dateStr){if(!dateStr)return null;const d=new Date(dateStr+'T23:59:59'),now=new Date();return Math.ceil((d-now)/86400000)}
function expiryInfo(p){const days=daysUntil(p.expiryDate);if(days===null)return {level:'none',text:'-',days:null};const warn=Math.max(0,n(p.expiryWarnDays,state.settings.expiryWarnDays||30));if(days<0)return {level:'expired',text:`หมดอายุ ${Math.abs(days)} วันแล้ว`,days};if(days===0)return {level:'expired',text:'หมดอายุวันนี้',days};if(days<=warn)return {level:'warn',text:`เหลือ ${days} วัน`,days};return {level:'ok',text:new Date(p.expiryDate+'T00:00:00').toLocaleDateString('th-TH'),days}}

function productPromoStatus(p){
  const regular=Math.max(0,n(p?.price,0)),promo=Math.max(0,n(p?.promoPrice,0)),today=new Date().toISOString().slice(0,10);
  if(!p?.promoEnabled||!promo||promo>=regular)return {active:false,status:'off',text:'ปิดโปรโมชั่น'};
  if(p.promoStartDate&&today<p.promoStartDate)return {active:false,status:'upcoming',text:`เริ่ม ${new Date(p.promoStartDate+'T00:00:00').toLocaleDateString('th-TH')}`};
  if(p.promoEndDate&&today>p.promoEndDate)return {active:false,status:'expired',text:`หมดเขต ${new Date(p.promoEndDate+'T00:00:00').toLocaleDateString('th-TH')}`};
  return {active:true,status:'active',text:'🔥 กำลังโปรโมชั่น'};
}
function effectiveProductPrice(p){const st=productPromoStatus(p);return st.active?Math.max(0,n(p.promoPrice)):Math.max(0,n(p.price))}
function promoConfiguredProducts(){return state.products.filter(p=>p.promoEnabled||n(p.promoPrice)>0||p.promoStartDate||p.promoEndDate)}

่น</button></div></div>`);

function saveProductPromotion(existingId,btn){
  if(!requirePermission('managePromotions','ไม่มีสิทธิ์ตั้งโปรโมชั่น'))return;
  const id=existingId||document.getElementById('promoProductId')?.value,p=state.products.find(x=>x.id===id);if(!p)return toast('กรุณาเลือกสินค้า',true);
  const promoPrice=Math.max(0,n(document.getElementById('promoSalePrice')?.value)),start=document.getElementById('promoStartDate')?.value||'',end=document.getElementById('promoEndDate')?.value||'',enabled=!!document.getElementById('promoEnabled')?.checked;
  if(!promoPrice||promoPrice>=n(p.price))return toast('ราคาโปรโมชั่นต้องมากกว่า 0 และต่ำกว่าราคาปกติ',true);
  if(start&&end&&start>end)return toast('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม',true);

}
function toggleProductPromotion(id){if(!requirePermission('managePromotions','ไม่มีสิทธิ์ตั้งโปรโมชั่น'))return;const p=state.products.find(x=>x.id===id);if(!p)return;p.promoEnabled=!p.promoEnabled;audit('product_promo',`${p.name} • ${p.promoEnabled?'เปิด':'ปิด'}โปรโมชั่น`,'product',p.id);saveState();render()}
function removeProductPromotion(id){if(!requirePermission('managePromotions','ไม่มีสิทธิ์ตั้งโปรโมชั่น'))return;const p=state.products.find(x=>x.id===id);if(!p)return;if(!confirm(`ยกเลิกโปรโมชั่นของ ${p.name}?`))return;Object.assign(p,{promoEnabled:false,promoPrice:0,promoStartDate:'',promoEndDate:''});audit('product_promo',`${p.name} • ยกเลิกโปรโมชั่น`,'product',p.id);saveState();render();toast('ยกเลิกสินค้าโปรโมชั่นแล้ว')}
function renderProductPromotions(){
  const configured=promoConfiguredProducts(),active=configured.filter(p=>productPromoStatus(p).active).length;

function openPermissionSettings(){
  if(!requireRole(['owner']))return toast('การกำหนดสิทธิ์พนักงานทำได้เฉพาะเจ้าของร้าน',true);

iv>`)
}
function setPermissionPreset(userId,mode){
  const u=state.users.find(x=>x.id===userId);if(!u)return;let src={};if(mode==='role')src=ROLE_PERMISSION_DEFAULTS[u.role]||ROLE_PERMISSION_DEFAULTS.cashier;else for(const [k] of PERMISSION_DEFS)src[k]=mode==='all';
  document.querySelectorAll(`[data-perm-user="${userId}"]`).forEach(el=>{el.checked=!!src[el.dataset.permKey]})
}
function savePermissionSettings(btn){
  if(!requireRole(['owner']))return toast('เฉพาะเจ้าของร้าน',true);
  for(const u of state.users.filter(x=>x.role!=='owner')){const perms={};document.querySelectorAll(`[data-perm-user="${u.id}"]`).forEach(el=>perms[el.dataset.permKey]=!!el.checked);u.permissions=perms}
  audit('user_permissions','ปรับสิทธิ์พนักงานแบบละเอียด','user','all');saveState();closeModal(btn);toast('บันทึกสิทธิ์แล้ว • จะซิงก์ไปทุกอุปกรณ์');openSettings()
}

function normalizeMemberPhone(v){return String(v||'').replace(/\D/g,'')}
function currentMember(){return state.members.find(m=>m.id===currentMemberId)||null}
function memberDisplay(m){if(!m)return 'ลูกค้าทั่วไป';return m.name||m.phone||'สมาชิก'}
function memberPointsBalance(m){return Math.max(0,Math.trunc(n(m?.pointsBalance,0)))}
function memberPointsConfig(){const base={enabled:true,earnBaht:100,earnPoints:1,redeemBahtPerPoint:1,minRedeemPoints:1};return {...base,...(state.settings.memberPoints||{})}}
function memberSecondary(m){if(!m)return '';const parts=[];if(m.phone)parts.push(m.phone);parts.push(`${memberPointsBalance(m)} แต้ม`);return parts.join(' · ')}
function memberMatches(m,q){q=String(q||'').trim().toLowerCase();if(!q)return true;const digits=normalizeMemberPhone(q);return String(m.name||'').toLowerCase().includes(q)||String(m.phone||'').includes(q)||(digits&&normalizeMemberPhone(m.phone).includes(digits))}
function memberPointHistory(m){return Array.isArray(m?.pointsHistory)?m.pointsHistory:[]}
function addMemberPointHistory(m,type,points,baht=0,order='',detail=''){
  if(!m)return; m.pointsHistory=memberPointHistory(m); const delta=Math.trunc(n(points));
  m.pointsHistory.unshift({id:uid('mph'),time:new Date().toISOString(),type,points:delta,baht:Math.max(0,n(baht)),order:String(order||''),detail:String(detail||''),user:currentUser?.name||'ระบบ',balanceAfter:memberPointsBalance(m)});
  if(m.pointsHistory.length>500)m.pointsHistory.length=500;
}
function memberRowsHtml(q='',mode='choose'){
  const rows=(state.members||[]).filter(m=>memberMatches(m,q)).sort((a,b)=>String(a.name||a.phone).localeCompare(String(b.name||b.phone),'th'));
  if(!rows.length)return `<div class="text-center text-slate-400 py-8">ยังไม่พบสมาชิก${q?'ที่ตรงกับคำค้น':''}</div>`;
  return rows.map(m=>`<div class="border rounded-xl p-3 flex gap-3 items-center bg-white">${mode==='settings'&&requireRole(['owner'])?`<input data-bulk-cat="members" value="${m.id}" type="checkbox" class="w-5 h-5 shrink-0" onchange="bulkUpdateCount('members')">`:''}<div class="w-11 h-11 rounded-full bg-emerald-100 flex items-center justify-center text-xl">👤</div><div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(m.name||'ไม่ระบุชื่อ')}</div><div class="text-sm text-slate-500">${esc(m.phone||'ไม่มีเบอร์โทร')}</div><div class="text-sm font-bold text-amber-600">⭐ ${memberPointsBalance(m).toLocaleString('th-TH')} แต้ม</div><div class="text-xs text-slate-400">สมัคร ${m.createdAt?new Date(m.createdAt).toLocaleDateString('th-TH'):'-'}</div></div>${mode==='settings'?`<div class="flex flex-wrap justify-end gap-1"><button onclick="openMemberHistory('${m.id}',this,'settings')" class="px-3 py-2 bg-amber-50 text-amber-700 rounded-lg">ประวัติ/แต้ม</button><button onclick="closeModal(this);openMemberForm('${m.id}','settings')" class="px-3 py-2 bg-slate-100 rounded-lg">แก้ไข</button>${requireRole(['owner'])?`<button onclick="deleteMember('${m.id}',this)" class="px-3 py-2 bg-red-50 text-red-700 rounded-lg">ลบ</button>`:''}</div>`:`<div class="flex flex-col gap-1"><button onclick="selectMember('${m.id}',this)" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold">เลือก</button><button onclick="openMemberHistory('${m.id}',this,'choose')" class="px-4 py-2 bg-amber-50 text-amber-700 rounded-lg text-sm">ดูประวัติ</button></div>`}</div>`).join('')
}
function refreshMemberSearch(){const q=document.getElementById('memberSearch')?.value||'';memberSearchDraft=q;const box=document.getElementById('memberSearchRows');if(box)box.innerHTML=memberRowsHtml(q,'choose')}
function refreshMemberSettingsSearch(){const q=document.getElementById('memberSettingsSearch')?.value||'';const box=document.getElementById('memberSettingsRows');if(box)box.innerHTML=memberRowsHtml(q,'settings')}
function openMemberChooser(){
  memberSearchDraft='';const m=currentMember(),cfg=memberPointsConfig();
  modal(`<div class="bg-slate-50 rounded-2xl p-5 max-w-2xl mx-auto"><div class="flex justify-between items-center"><div><h3 class="text-2xl font-bold">🧑‍🤝‍🧑 สมาชิก</h3><p class="text-sm text-slate-500">ค้นหาด้วยเบอร์โทร หรือชื่อ-นามสกุล</p></div><button onclick="closeModal(this)" class="text-3xl">×</button></div>${m?`<div class="mt-3 p-3 rounded-xl bg-emerald-50 border border-emerald-200"><div class="flex justify-between items-center gap-3"><div><div class="text-xs text-emerald-700">สมาชิกที่เลือกในบิลนี้</div><b>${esc(memberDisplay(m))}</b><div class="text-sm text-slate-500">${esc(m.phone||'')}</div><div class="text-lg font-black text-amber-600 mt-1">⭐ ${memberPointsBalance(m).toLocaleString('th-TH')} แต้ม</div></div><button onclick="clearSelectedMember(this)" class="px-3 py-2 bg-white border rounded-lg text-red-600">ใช้ลูกค้าทั่วไป</button></div>${cfg.enabled?`<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="openRedeemPoints('${m.id}',this)" class="bg-amber-500 text-white rounded-xl p-3 font-bold">🎁 ใช้แต้มเป็นส่วนลด</button><button onclick="openMemberHistory('${m.id}',this,'choose')" class="bg-white border rounded-xl p-3 font-bold">📜 ประวัติสมาชิก</button></div>`:''}</div>`:''}<div class="flex gap-2 mt-4"><input id="memberSearch" autocomplete="off" inputmode="search" class="flex-1 border-2 border-indigo-200 rounded-xl p-3 text-lg" placeholder="เบอร์โทร หรือ ชื่อ-นามสกุล" oninput="refreshMemberSearch()" onkeydown="if(event.key==='Enter'){event.preventDefault();const first=document.querySelector('#memberSearchRows button');if(first)first.click();else startMemberRegistrationFromSearch(this)}"><button onclick="startMemberRegistrationFromSearch(this)" class="px-4 rounded-xl bg-indigo-600 text-white font-bold">+ สมัคร</button></div><div id="memberSearchRows" class="space-y-2 mt-3 max-h-[55vh] overflow-auto">${memberRowsHtml('','choose')}</div><button onclick="closeModal(this)" class="w-full bg-slate-200 rounded-xl p-3 mt-4">ปิด</button></div>`);
  setTimeout(()=>document.getElementById('memberSearch')?.focus(),40)
}
function startMemberRegistrationFromSearch(el){memberSearchDraft=document.getElementById('memberSearch')?.value?.trim()||memberSearchDraft||'';closeModal(el);openMemberForm('','pos')}
function selectMember(id,btn){const m=state.members.find(x=>x.id===id);if(!m)return;currentMemberId=id;memberPointRedemption={points:0,baht:0};closeModal(btn);updateCustomerDisplay();render();toast(`เลือกสมาชิก ${memberDisplay(m)} แล้ว • ${memberPointsBalance(m)} แต้ม`)}
function clearSelectedMember(btn){const p=state.promotions.find(x=>x.id===selectedPromoId);currentMemberId='';memberPointRedemption={points:0,baht:0};if(p?.type==='member_percent'||p?.type==='member_fixed')resetBillDiscount();if(btn)closeModal(btn);updateCustomerDisplay();render();toast('เปลี่ยนเป็นลูกค้าทั่วไปแล้ว')}
function openMemberForm(id='',returnMode='pos'){
  const m=state.members.find(x=>x.id===id)||null,q=memberSearchDraft.trim(),prefillPhone=!m&&/^[-+() 0-9]+$/.test(q)?normalizeMemberPhone(q):'',prefillName=!m&&!prefillPhone?q:'';
  modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto"><div class="flex justify-between items-center"><div><h3 class="text-2xl font-bold">${m?'✏️ แก้ไขสมาชิก':'📝 สมัครสมาชิก'}</h3><p class="text-sm text-slate-500">กรอกเบอร์โทร หรือชื่อ-นามสกุล อย่างน้อย 1 อย่าง</p></div><button onclick="closeModal(this);${returnMode==='settings'?'openMembersSettings()':''}" class="text-3xl">×</button></div>${m?`<div class="mt-3 bg-amber-50 rounded-xl p-3 font-bold text-amber-700">⭐ แต้มคงเหลือ ${memberPointsBalance(m).toLocaleString('th-TH')} แต้ม</div>`:''}<label class="block mt-4 font-semibold">ชื่อ-นามสกุล<input id="memberName" value="${esc(m?.name||prefillName)}" class="w-full border rounded-xl p-3 mt-1" placeholder="เช่น สมชาย ใจดี"></label><label class="block mt-3 font-semibold">เบอร์โทร<input id="memberPhone" value="${esc(m?.phone||prefillPhone)}" type="tel" inputmode="tel" class="w-full border rounded-xl p-3 mt-1" placeholder="เช่น 0812345678"></label><label class="block mt-3 font-semibold">วงเงินขายเชื่อ (บาท)<input id="memberCreditLimit" type="number" min="0" step="1" value="${Math.max(0,n(m?.creditLimit,0))}" class="w-full border rounded-xl p-3 mt-1" placeholder="0 = ไม่กำหนดวงเงิน"></label><label class="block mt-3 text-sm">หมายเหตุ (ไม่บังคับ)<input id="memberNote" value="${esc(m?.note||'')}" class="w-full border rounded-xl p-3 mt-1" placeholder="ข้อมูลเพิ่มเติม"></label><div class="flex gap-2 mt-5"><button onclick="closeModal(this);${returnMode==='settings'?'openMembersSettings()':'openMemberChooser()'}" class="flex-1 bg-slate-200 rounded-xl p-3">ยกเลิก</button><button onclick="saveMember('${id}',this,'${returnMode}')" class="flex-1 bg-emerald-600 text-white rounded-xl p-3 font-bold">บันทึกสมาชิก</button></div></div>`);
  setTimeout(()=>document.getElementById(prefillPhone?'memberPhone':'memberName')?.focus(),40)
}
function saveMember(id,btn,returnMode='pos'){
  const name=(document.getElementById('memberName')?.value||'').trim(),phone=normalizeMemberPhone(document.getElementById('memberPhone')?.value||''),creditLimit=Math.max(0,n(document.getElementById('memberCreditLimit')?.value,0)),note=(document.getElementById('memberNote')?.value||'').trim();
  if(!name&&!phone)return toast('กรอกเบอร์โทร หรือชื่อ-นามสกุล อย่างน้อย 1 อย่าง',true);
  if(phone&&state.members.some(m=>m.id!==id&&normalizeMemberPhone(m.phone)===phone))return toast('เบอร์โทรนี้สมัครสมาชิกแล้ว',true);
  let m=state.members.find(x=>x.id===id);const now=new Date().toISOString();
  if(m){Object.assign(m,{name,phone,creditLimit,note,updatedAt:now,pointsBalance:memberPointsBalance(m),pointsHistory:memberPointHistory(m)})}else{m={id:uid('mem'),name,phone,creditLimit,note,createdAt:now,updatedAt:now,pointsBalance:0,pointsHistory:[]};state.members.push(m)}
  saveState();memberSearchDraft='';closeModal(btn);
  if(returnMode==='settings'){toast('บันทึกสมาชิกแล้ว');openMembersSettings()}else{currentMemberId=m.id;memberPointRedemption={points:0,baht:0};updateCustomerDisplay();render();toast(`สมัครและเลือกสมาชิก ${memberDisplay(m)} แล้ว`)}
}
function deleteMember(id,btn){const m=state.members.find(x=>x.id===id);if(!m)return;if(!requireRole(['owner']))return toast('เฉพาะเจ้าของร้านเท่านั้นที่ลบสมาชิกได้',true);if(!confirm(`ลบสมาชิก ${memberDisplay(m)} ?`))return;state.members=state.members.filter(x=>x.id!==id);if(currentMemberId===id){currentMemberId='';memberPointRedemption={points:0,baht:0}}saveState();closeModal(btn);toast('ลบสมาชิกแล้ว');openMembersSettings()}
function openMembersSettings(){
  if(!requirePermission('manageMembers','ไม่มีสิทธิ์จัดการสมาชิก'))return;
  const cfg=memberPointsConfig();
  modal(`<div class="bg-slate-50 rounded-2xl p-5 max-w-3xl mx-auto"><div class="flex justify-between items-center"><div><h3 class="text-2xl font-bold">🧑‍🤝‍🧑 สมาชิก (${state.members.length})</h3><p class="text-sm text-slate-500">สมัคร ค้นหา แก้ไข ดูแต้ม และดูประวัติสมาชิก</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><div class="mt-3 bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm">⭐ ${cfg.enabled?`ซื้อครบ ${money(cfg.earnBaht)} ได้ ${cfg.earnPoints} แต้ม • 1 แต้มลด ${money(cfg.redeemBahtPerPoint)}`:'ระบบแต้มถูกปิด'}</div>${bulkToolbar('members',state.members.length)}<div class="flex gap-2 mt-4"><input id="memberSettingsSearch" class="flex-1 border rounded-xl p-3" placeholder="ค้นหาเบอร์โทร หรือชื่อ" oninput="refreshMemberSettingsSearch()"><button onclick="closeModal(this);memberSearchDraft='';openMemberForm('','settings')" class="px-4 bg-emerald-600 text-white rounded-xl font-bold">+ สมัครสมาชิก</button></div><div id="memberSettingsRows" class="space-y-2 mt-3 max-h-[58vh] overflow-auto">${memberRowsHtml('','settings')}</div><button onclick="closeModal(this);openSettings()" class="w-full bg-slate-200 rounded-xl p-3 mt-4">กลับเมนูตั้งค่า</button></div>`)
}
function openRedeemPoints(id,btn){
  const m=state.members.find(x=>x.id===id),cfg=memberPointsConfig();if(!m||!cfg.enabled)return toast('ระบบแต้มสมาชิกยังไม่ได้เปิด',true);if(currentMemberId!==id)return toast('กรุณาเลือกสมาชิกคนนี้ในบิลก่อน',true);const bal=memberPointsBalance(m),c=calcCart(),prePointTotal=c.total+c.pointDiscount,maxByBill=cfg.redeemBahtPerPoint>0?Math.floor((prePointTotal+1e-9)/cfg.redeemBahtPerPoint):0,maxPoints=Math.max(0,Math.min(bal,maxByBill));

function categories(){return ['ทั้งหมด',...new Set(state.products.map(p=>p.category||'ทั่วไป'))]}
function normalizeSearchText(v){return String(v||'').toLowerCase().normalize('NFKC').replace(/[\s\-_/.,()]+/g,' ').trim()}
function compactSearchText(v){return normalizeSearchText(v).replace(/\s+/g,'')}
function supplierNameById(id){return state.suppliers.find(s=>s.id===id)?.name||''}
function smartProductScore(p,q){
  q=normalizeSearchText(q);if(!q)return 1;
  const barcode=normalizeSearchText([p.barcode,...normalizeProductUnits(p).map(u=>u.barcode)].filter(Boolean).join(' ')),id=normalizeSearchText(p.id),name=normalizeSearchText(p.name),category=normalizeSearchText(p.category),keywords=normalizeSearchText(p.keywords),supplier=normalizeSearchText(supplierNameById(p.supplierId));
  const compact=compactSearchText(q),tokens=q.split(' ').filter(Boolean),hay=[name,category,keywords,supplier,barcode,id].join(' '),hayCompact=compactSearchText(hay);
  if(q===barcode||q===id)return 1000;
  if(q===name)return 900;
  if(name.startsWith(q))return 800;
  if(name.includes(q))return 720;
  if(barcode.includes(q)||id.includes(q))return 700;
  if(tokens.length&&tokens.every(t=>hay.includes(t)))return 620+tokens.length;
  if(compact&&hayCompact.includes(compact))return 560;
  const hits=tokens.filter(t=>hay.includes(t)).length;if(hits)return 300+hits*20;
  return 0;
}
function smartProductResults(q,onlyInStock=false){return state.products.map(p=>({p,score:smartProductScore(p,q)})).filter(x=>x.score>0&&(!onlyInStock||x.p.stock>0)).sort((a,b)=>b.score-a.score||String(a.p.name).localeCompare(String(b.p.name),'th')).map(x=>x.p)}
function filteredProducts(){return smartProductResults(searchTerm,false).filter(p=>selectedCategory==='ทั้งหมด'||p.category===selectedCategory)}
function addToCart(id,unitId='base'){if(!requirePermission('sell','ไม่มีสิทธิ์ขายสินค้า'))return;const p=state.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('สินค้าหมดสต็อก',true);const u=productUnitById(p,unitId),factor=Math.max(1,n(u.factor,1)),maxStock=Math.floor(n(p.stock)/factor);if(maxStock<=0)return toast(`สต็อกไม่พอสำหรับหน่วย ${u.name}`,true);const key=id+'|'+u.unitId,item=cart.find(x=>(x.cartKey||x.productId+'|'+(x.unitId||'base'))===key);if(item){if(item.qty>=maxStock)return toast('สต็อกไม่เพียงพอ',true);item.qty++}else{const promo=productPromoStatus(p),salePrice=u.base?effectiveProductPrice(p):Math.max(0,n(u.price,n(p.price)*factor));cart.push({cartKey:key,productId:id,unitId:u.unitId,unitName:u.name,baseQtyPerUnit:factor,name:p.name,price:salePrice,regularPrice:u.base?n(p.price):n(u.price),promoApplied:u.base&&promo.active,cost:n(p.cost)*factor,taxCategory:p.taxCategory==='taxable'?'taxable':p.taxCategory==='non_taxable'?'non_taxable':'unassigned',taxRate:n(state.settings.taxSettings?.vatRate,7),qty:1,maxStock,discount:0,discountType:'baht'})}beep();render()}
function changeQty(id,d,unitId='base'){const key=id+'|'+unitId,i=cart.find(x=>(x.cartKey||x.productId+'|'+(x.unitId||'base'))===key)||cart.find(x=>x.productId===id);if(!i)return;const q=i.qty+d;if(q<=0)cart=cart.filter(x=>x!==i);else if(q>i.maxStock)return toast('สต็อกไม่เพียงพอ',true);else i.qty=q;render()}
function itemNet(i){const gross=i.price*i.qty;const dis=i.discountType==='percent'?gross*(n(i.discount)/100):n(i.discount);return Math.max(0,gross-dis)}
function isPromoUsable(p){const today=new Date().toISOString().slice(0,10);return !!p.active&&(!p.startDate||today>=p.startDate)&&(!p.endDate||today<=p.endDate)}
function selectedPromo(){const p=state.promotions.find(p=>p.id===selectedPromoId&&isPromoUsable(p));return p&&(p.type==='member_percent'||p.type==='member_fixed')&&!currentMember()?null:p}
function calcCart(){
  const itemSubtotal=cart.reduce((sum,i)=>sum+itemNet(i),0);
  let billDiscount=0,promoText='',discountInfo=null;
  const p=selectedPromo();
  if(p){
    if(p.type==='bill_percent'){billDiscount=itemSubtotal*n(p.value)/100;promoText=`${p.name} -${p.value}%`}
    else if(p.type==='bill_fixed'){billDiscount=Math.min(itemSubtotal,n(p.value));promoText=`${p.name} -${money(p.value)}`}
    else if(p.type==='bogo'){billDiscount=cart.reduce((sum,i)=>{const free=Math.floor(i.qty/(n(p.buy,2)+n(p.free,1)))*n(p.free,1);return sum+free*i.price},0);promoText=`${p.name} ซื้อ ${p.buy} แถม ${p.free}`}
    else if(p.type==='member_percent'){billDiscount=itemSubtotal*n(p.value)/100;promoText=`${p.name} สมาชิก -${p.value}%`}else if(p.type==='member_fixed'){billDiscount=Math.min(itemSubtotal,n(p.value));promoText=`${p.name} สมาชิก -${money(p.value)}`}
    discountInfo={source:'promotion',id:p.id,name:p.name,type:p.type,value:n(p.value),buy:n(p.buy),free:n(p.free)};
  }else if(n(manualBillDiscount.value)>0){
    if(manualBillDiscount.type==='baht'){
      billDiscount=Math.min(itemSubtotal,n(manualBillDiscount.value));
      promoText=manualBillDiscount.label||`ส่วนลดทั้งบิล -${money(manualBillDiscount.value)}`;
    }else{
      const pct=Math.min(100,Math.max(0,n(manualBillDiscount.value)));
      billDiscount=itemSubtotal*pct/100;
      promoText=manualBillDiscount.label||`ส่วนลดทั้งบิล -${pct}%`;
    }
    discountInfo={source:'manual',type:manualBillDiscount.type,value:n(manualBillDiscount.value),label:promoText};
  }
  billDiscount=Math.min(itemSubtotal,billDiscount);
  let pointDiscount=0,pointsRedeemed=0;
  const m=currentMember(),cfg=memberPointsConfig();
  if(m&&cfg.enabled&&memberPointRedemption.points>0){
    const rate=Math.max(.01,n(cfg.redeemBahtPerPoint,1)),remaining=Math.max(0,itemSubtotal-billDiscount),maxByRemaining=Math.floor((remaining+1e-9)/rate);
    pointsRedeemed=Math.min(memberPointsBalance(m),Math.max(0,Math.trunc(n(memberPointRedemption.points))),maxByRemaining);
    pointDiscount=pointsRedeemed*rate;
    if(pointDiscount<=0){pointsRedeemed=0;memberPointRedemption={points:0,baht:0}}
  }
  const totalDiscount=Math.min(itemSubtotal,billDiscount+pointDiscount),texts=[promoText,pointDiscount?`ใช้ ${pointsRedeemed} แต้ม -${money(pointDiscount)}`:''].filter(Boolean);

function compressProductImage(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//i.test(file.type||''))return reject(new Error('type'));
    const reader=new FileReader();reader.onerror=()=>reject(new Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('image'));img.onload=()=>{
      let max=480,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      const make=(quality)=>{canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return canvas.toDataURL('image/jpeg',quality)};
      let quality=.82,data=make(quality);
      while(data.length>28000&&quality>.48){quality-=.08;data=make(quality)}
      while(data.length>28000&&w>240){w=Math.round(w*.82);h=Math.round(h*.82);quality=.68;data=make(quality)}
      if(data.length>32000)return reject(new Error('large'));
      resolve(data)
    };img.src=String(reader.result)};reader.readAsDataURL(file)
  })
}

    const reader=new FileReader();reader.onerror=()=>reject(new Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('image'));img.onload=()=>{
      let max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      const make=(quality)=>{canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return canvas.toDataURL('image/jpeg',quality)};
      let quality=.88,data=make(quality);
      while(data.length>600000&&quality>.55){quality-=.07;data=make(quality)}

function imageHashFromDataUrl(data){return new Promise((resolve,reject)=>{if(!safeProductImage(data))return resolve('');const img=new Image();img.onerror=()=>reject(new Error('hash'));img.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=8;c.height=8;ctx.drawImage(img,0,0,8,8);const px=ctx.getImageData(0,0,8,8).data,g=[];for(let i=0;i<px.length;i+=4)g.push((px[i]*.299)+(px[i+1]*.587)+(px[i+2]*.114));const avg=g.reduce((a,b)=>a+b,0)/g.length;resolve(g.map(v=>v>=avg?'1':'0').join(''))};img.src=data})}

function addPromo(){modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto"><h3 class="text-xl font-bold mb-4">เพิ่มโปรโมชั่น</h3><input id="prName" placeholder="ชื่อโปรโมชั่น" class="w-full border rounded p-2 mb-2"><select id="prType" class="w-full border rounded p-2 mb-2" onchange="renderPromoFields()"><option value="bill_fixed">ลดทั้งบิล (บาท)</option><option value="member_fixed">สมาชิก ลด (บาท)</option><option value="bogo">ซื้อ X แถม Y</option></select><div id="promoFields"><input id="prValue" type="number" min="0" step="0.01" placeholder="ส่วนลด (บาท)" class="w-full border rounded p-2 mb-2"></div><div class="grid grid-cols-2 gap-2 mt-2"><label class="text-xs">เริ่มใช้<input id="prStart" type="date" class="w-full border rounded p-2"></label><label class="text-xs">สิ้นสุด<input id="prEnd" type="date" class="w-full border rounded p-2"></label></div><div class="flex gap-2 mt-3"><button onclick="closeModal(this)" class="flex-1 bg-slate-200 rounded p-2">ยกเลิก</button><button onclick="savePromo(this)" class="flex-1 text-white rounded p-2" style="background:${state.config.primary_action_color}">บันทึก</button></div></div>`)}
function renderPromoFields(){const t=document.getElementById('prType').value,f=document.getElementById('promoFields');f.innerHTML=t==='bogo'?'<div class="grid grid-cols-2 gap-2"><input id="prBuy" type="number" min="1" value="2" class="border rounded p-2" placeholder="ซื้อ"><input id="prFree" type="number" min="1" value="1" class="border rounded p-2" placeholder="แถม"></div>':'<input id="prValue" type="number" min="0" placeholder="จำนวนส่วนลด" class="w-full border rounded p-2 mb-2">'}
function savePromo(btn){const name=document.getElementById('prName').value.trim(),type=document.getElementById('prType').value;if(!name)return toast('กรอกชื่อโปรโมชั่น',true);const p={id:uid('pr'),name,type,active:true,startDate:document.getElementById('prStart').value||'',endDate:document.getElementById('prEnd').value||''};if(p.startDate&&p.endDate&&p.startDate>p.endDate)return toast('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม',true);if(type==='bogo'){p.buy=Math.max(1,Math.trunc(n(document.getElementById('prBuy').value,2)));p.free=Math.max(1,Math.trunc(n(document.getElementById('prFree').value,1)))}else p.value=Math.max(0,n(document.getElementById('prValue').value));state.promotions.push(p);saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());openPromotions()}
function togglePromo(id){const p=state.promotions.find(x=>x.id===id);if(p){p.active=!p.active;saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());openPromotions()}}
function deletePromo(id){if(confirm('ลบโปรโมชั่น?')){state.promotions=state.promotions.filter(x=>x.id!==id);if(selectedPromoId===id)selectedPromoId='';saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());openPromotions()}}

function approvalRules(){return {...{enabled:true,discountBaht:100,returnBaht:500,stockQty:20,belowCost:true,creditOverLimit:true},...(state.settings.approvalRules||{})}}
function requestManagerApproval(reason,onApproved){const supervisors=state.users.filter(u=>u.active&&['owner','manager'].includes(u.role));if(!supervisors.length)return toast('ยังไม่มีเจ้าของ/ผู้จัดการสำหรับอนุมัติ',true);window.__approvalCallback=typeof onApproved==='function'?onApproved:null;modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto"><h3 class="text-2xl font-bold">🔐 ต้องอนุมัติ</h3><p class="text-sm text-slate-500 mt-1">${esc(reason)}</p><label class="block mt-4 font-bold">ผู้อนุมัติ<select id="approvalUser" class="w-full border rounded-xl p-3 mt-1">${supervisors.map(u=>`<option value="${u.id}">${esc(u.name)} — ${roleName(u.role)}</option>`).join('')}</select></label><label class="block mt-3 font-bold">PIN<input id="approvalPin" type="password" inputmode="numeric" maxlength="8" class="w-full border rounded-xl p-3 mt-1 text-center text-xl" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmManagerApproval(this,'${enc(reason)}')}"></label><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="window.__approvalCallback=null;closeModal(this)" class="bg-slate-200 rounded-xl p-3">ยกเลิก</button><button onclick="confirmManagerApproval(this,'${enc(reason)}')" class="bg-violet-600 text-white rounded-xl p-3 font-bold">อนุมัติ</button></div></div>`);setTimeout(()=>document.getElementById('approvalPin')?.focus(),50)}
function confirmManagerApproval(btn,encodedReason){const id=document.getElementById('approvalUser')?.value,pin=document.getElementById('approvalPin')?.value||'',u=state.users.find(x=>x.id===id&&x.active&&['owner','manager'].includes(x.role));if(!u||u.pin!==pin)return toast('PIN ผู้อนุมัติไม่ถูกต้อง',true);const cb=window.__approvalCallback;window.__approvalCallback=null;audit('manager_approval',`${u.name} อนุมัติ • ${decodeURIComponent(encodedReason||'')}`,'approval',u.id);closeModal(btn);if(cb)setTimeout(cb,0)}
function openApprovalSettings(){if(!requireRole(['owner']))return toast('เฉพาะเจ้าของร้านที่ตั้งกฎอนุมัติได้',true);const r=approvalRules();modal(`<div class="bg-white rounded-2xl p-6 max-w-xl mx-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">🔐 PIN อนุมัติรายการสำคัญ</h3><p class="text-sm text-slate-500">กำหนดเกณฑ์ที่แคชเชียร์ต้องให้เจ้าของ/ผู้จัดการใส่ PIN</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><label class="flex gap-3 items-center border rounded-xl p-3 mt-4"><input id="arEnabled" type="checkbox" ${r.enabled?'checked':''}><b>เปิดใช้กฎอนุมัติ</b></label><div class="grid grid-cols-2 gap-3 mt-3"><label>ส่วนลดเกิน (บาท)<input id="arDiscount" type="number" min="0" value="${r.discountBaht}" class="w-full border rounded-xl p-3 mt-1"></label><label>คืนเงินเกิน (บาท)<input id="arReturn" type="number" min="0" value="${r.returnBaht}" class="w-full border rounded-xl p-3 mt-1"></label><label>ปรับสต็อกเกิน (หน่วย)<input id="arStock" type="number" min="1" value="${r.stockQty}" class="w-full border rounded-xl p-3 mt-1"></label><label class="flex items-center gap-2 border rounded-xl p-3"><input id="arBelowCost" type="checkbox" ${r.belowCost?'checked':''}> ขายต่ำกว่าทุน</label><label class="col-span-2 flex items-center gap-2 border rounded-xl p-3"><input id="arCreditOver" type="checkbox" ${r.creditOverLimit?'checked':''}> ขายเชื่อเกินวงเงินลูกค้า</label></div><button onclick="saveApprovalSettings(this)" class="w-full mt-4 bg-violet-600 text-white rounded-xl p-3 font-bold">บันทึกกฎอนุมัติ</button></div>`)}
function saveApprovalSettings(btn){state.settings.approvalRules={enabled:!!document.getElementById('arEnabled')?.checked,discountBaht:Math.max(0,n(document.getElementById('arDiscount')?.value,100)),returnBaht:Math.max(0,n(document.getElementById('arReturn')?.value,500)),stockQty:Math.max(1,Math.trunc(n(document.getElementById('arStock')?.value,20))),belowCost:!!document.getElementById('arBelowCost')?.checked,creditOverLimit:!!document.getElementById('arCreditOver')?.checked};audit('approval_settings','ปรับกฎ PIN อนุมัติ','settings','approval');saveState();closeModal(btn);toast('บันทึกกฎอนุมัติแล้ว');openSettings()}
function addCostHistory(p,oldCost,newCost,source='',ref=''){if(!p||Math.abs(n(oldCost)-n(newCost))<.0001)return;state.costHistory=Array.isArray(state.costHistory)?state.costHistory:[];state.costHistory.unshift({id:uid('cost'),productId:p.id,productName:p.name,oldCost:n(oldCost),newCost:n(newCost),source,ref,time:new Date().toISOString(),user:currentUser?.name||'ระบบ',userId:currentUser?.id||'',deviceId:getDeviceId(),deviceName:deviceDisplayName()});if(state.costHistory.length>8000)state.costHistory.length=8000}
function openCostHistory(productId=''){if(!requirePermission('viewCostHistory','ไม่มีสิทธิ์ดูประวัติต้นทุน'))return;const rows=(state.costHistory||[]).filter(x=>!productId||x.productId===productId).sort((a,b)=>(Date.parse(b.time||0)||0)-(Date.parse(a.time||0)||0)),p=productId?state.products.find(x=>x.id===productId):null;modal(`<div class="bg-white rounded-2xl p-6 max-w-5xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">📚 ประวัติต้นทุน${p?' — '+esc(p.name):''}</h3><p class="text-sm text-slate-500">ดูต้นทุนเก่า → ใหม่ พร้อมแหล่งที่มา</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><div class="overflow-auto mt-4"><table class="w-full text-sm min-w-[700px]"><thead><tr class="bg-slate-100"><th class="p-2">เวลา</th><th>สินค้า</th><th>ต้นทุนเดิม</th><th>ต้นทุนใหม่</th><th>เปลี่ยนแปลง</th><th>แหล่งที่มา</th></tr></thead><tbody>${rows.slice(0,1500).map(x=>`<tr class="border-b"><td class="p-2 whitespace-nowrap">${new Date(x.time).toLocaleString('th-TH')}</td><td>${esc(x.productName||state.products.find(p=>p.id===x.productId)?.name||'-')}</td><td class="text-right">${money(x.oldCost)}</td><td class="text-right font-bold">${money(x.newCost)}</td><td class="text-right ${n(x.newCost)>=n(x.oldCost)?'text-red-600':'text-emerald-600'}">${n(x.newCost)-n(x.oldCost)>=0?'+':''}${money(n(x.newCost)-n(x.oldCost))}</td><td>${esc(x.source||'-')} ${x.ref?`• ${esc(x.ref)}`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center p-10 text-slate-400">ยังไม่มีประวัติต้นทุน</td></tr>'}</tbody></table></div></div>`)}
function poStatusName(s){return s==='received'?'รับครบแล้ว':s==='cancelled'?'ยกเลิก':'รอรับสินค้า'}
function poUnitOptions(p){return [{id:'base',name:p.unitName||'ชิ้น',factor:1,cost:n(p.cost)},...normalizeProductUnits(p).map(u=>({id:u.id,name:u.name,factor:u.factor,cost:n(p.cost)*u.factor}))]}
function poLineHtml(){const first=state.products[0];return `<div data-po-line="1" class="grid grid-cols-1 md:grid-cols-[1.5fr_1fr_90px_120px_110px_42px] gap-2 items-end border rounded-xl p-2"><label class="text-xs">สินค้า<select data-po-product class="w-full border rounded p-2" onchange="refreshPOLineUnit(this.closest('[data-po-line]'))">${state.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="text-xs">หน่วย<select data-po-unit class="w-full border rounded p-2" onchange="refreshPOUnitCost(this.closest('[data-po-line]'))">${first?poUnitOptions(first).map(u=>`<option value="${u.id}" data-factor="${u.factor}" data-cost="${u.cost}">${esc(u.name)}</option>`).join(''):''}</select></label><label class="text-xs">จำนวน<input data-po-qty type="number" min="1" step="1" value="1" class="w-full border rounded p-2" oninput="recalcPOForm()"></label><label class="text-xs">ต้นทุน/หน่วย<input data-po-cost type="number" min="0" step="0.01" value="${first?n(first.cost):0}" class="w-full border rounded p-2" oninput="recalcPOForm()"></label><div class="text-xs">รวม<div data-po-line-total class="h-10 flex items-center justify-end px-2 bg-slate-50 rounded font-bold">${money(first?n(first.cost):0)}</div></div><button type="button" onclick="this.closest('[data-po-line]').remove();recalcPOForm()" class="h-10 bg-red-50 text-red-700 rounded">×</button></div>`}
function refreshPOLineUnit(row){const p=state.products.find(x=>x.id===row?.querySelector('[data-po-product]')?.value),sel=row?.querySelector('[data-po-unit]'),cost=row?.querySelector('[data-po-cost]');if(!p||!sel)return;sel.innerHTML=poUnitOptions(p).map(u=>`<option value="${u.id}" data-factor="${u.factor}" data-cost="${u.cost}">${esc(u.name)}</option>`).join('');if(cost)cost.value=n(p.cost);recalcPOForm()}
function refreshPOUnitCost(row){const sel=row?.querySelector('[data-po-unit]'),cost=row?.querySelector('[data-po-cost]'),opt=sel?.selectedOptions?.[0];if(cost&&opt)cost.value=n(opt.dataset.cost,0);recalcPOForm()}
function recalcPOForm(){let total=0;document.querySelectorAll('#poLines [data-po-line]').forEach(row=>{const qty=Math.max(0,n(row.querySelector('[data-po-qty]')?.value)),unitCost=Math.max(0,n(row.querySelector('[data-po-cost]')?.value)),line=qty*unitCost;total+=line;const out=row.querySelector('[data-po-line-total]');if(out)out.textContent=money(line)});const out=document.getElementById('poGrandTotal');if(out)out.textContent=money(total)}
function addPOLine(){const box=document.getElementById('poLines');if(!box)return;box.insertAdjacentHTML('beforeend',poLineHtml());recalcPOForm()}
function openPurchaseOrders(){if(!requirePermission('managePurchaseOrders','ไม่มีสิทธิ์ใบสั่งซื้อ / รับสินค้า'))return;const rows=(state.purchaseOrders||[]).slice().sort((a,b)=>(Date.parse(b.createdAt||0)||0)-(Date.parse(a.createdAt||0)||0));modal(`<div class="bg-slate-50 rounded-2xl p-5 max-w-6xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">🛒 ใบสั่งซื้อ PO / รับสินค้า</h3><p class="text-sm text-slate-500">สั่งจากผู้ขาย → รับเข้า → ปรับสต็อก/ต้นทุน/เจ้าหนี้อัตโนมัติ</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><button onclick="openPurchaseOrderForm(this)" class="mt-4 px-4 py-3 rounded-xl bg-emerald-600 text-white font-bold">+ สร้าง PO</button><div class="space-y-3 mt-4">${rows.map(po=>{const sup=state.suppliers.find(s=>s.id===po.supplierId);return `<div class="bg-white border rounded-2xl p-4"><div class="flex flex-wrap justify-between gap-2"><div><b>${esc(po.poNumber||po.id)}</b> • ${esc(sup?.name||'ไม่ระบุผู้ขาย')}<div class="text-xs text-slate-500">สร้าง ${new Date(po.createdAt).toLocaleString('th-TH')} • โดย ${esc(po.createdBy||'-')}${po.deviceName?' • '+esc(po.deviceName):''} • ${po.items?.length||0} รายการ</div>${po.receivedAt?`<div class="text-xs text-emerald-700">รับเข้า ${esc(po.receiveNumber||'-')} • ${new Date(po.receivedAt).toLocaleString('th-TH')} • โดย ${esc(po.receivedBy||'-')}${po.receivedDeviceName?' • '+esc(po.receivedDeviceName):''}</div>`:''}</div><div><span class="px-2 py-1 rounded bg-slate-100 text-xs">${poStatusName(po.status)}</span> <b class="ml-2">${money(po.total)}</b></div></div><div class="text-sm mt-2">${(po.items||[]).map(i=>`${esc(i.name)} ${i.qty} ${esc(i.unitName||'ชิ้น')} × ${money(i.unitCost)}`).join(' • ')}</div>${po.status==='ordered'?`<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="receivePurchaseOrder('${po.id}',this)" class="bg-indigo-600 text-white rounded-xl p-2 font-bold">📥 รับสินค้าครบตาม PO</button><button onclick="cancelPurchaseOrder('${po.id}',this)" class="bg-red-50 text-red-700 rounded-xl p-2">ยกเลิก PO</button></div>`:''}</div>`}).join('')||'<div class="text-center text-slate-400 py-14">ยังไม่มีใบสั่งซื้อ</div>'}</div></div>`)}

  modal(`<div class="bg-white rounded-2xl p-6 max-w-xl mx-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">🏦 บันทึกโอนเงิน</h3><p class="text-sm text-slate-500">ยอดที่ลูกค้าชำระ = ยอดโอน + ค่าบริการ</p></div><button onclick="closeModal(this);openBankTransfers()" class="text-3xl">×</button></div><label class="block mt-4 font-bold">ธนาคารปลายทาง<select id="btBank" class="w-full border rounded-xl p-3 mt-1" onchange="updateBankTransferFee()">${banks.map(b=>`<option value="${esc(b.id)}" data-fee="${n(b.fee)}">${esc(b.name)}</option>`).join('')}</select></label><div class="grid grid-cols-2 gap-3 mt-3"><label>เลขบัญชี<input id="btAccount" inputmode="numeric" class="w-full border rounded-xl p-3 mt-1" placeholder="เลขบัญชีปลายทาง"></label><label>ชื่อบัญชี<input id="btAccountName" class="w-full border rounded-xl p-3 mt-1" placeholder="ชื่อผู้รับ"></label><label>ยอดโอน<input id="btAmount" type="number" min="0.01" step="0.01" class="w-full border rounded-xl p-3 mt-1 text-xl" oninput="updateBankTransferTotal()"></label><label>ค่าบริการ<input id="btFee" type="number" min="0" step="0.01" value="${n(first.fee)}" class="w-full border rounded-xl p-3 mt-1 text-xl" oninput="updateBankTransferTotal()"></label><label class="col-span-2">ลูกค้าชำระด้วย<select id="btMethod" class="w-full border rounded-xl p-3 mt-1"><option value="cash">เงินสด</option><option value="qr">QR/โอนเข้าร้าน</option></select></label></div><div class="mt-4 rounded-xl bg-emerald-50 border border-emerald-200 p-4 flex justify-between items-center"><span class="font-bold">รับจากลูกค้ารวม</span><b id="btTotal" class="text-3xl text-emerald-700">${money(n(first.fee))}</b></div><label class="block mt-3">หมายเหตุ / เลขอ้างอิง<input id="btNote" class="w-full border rounded-xl p-3 mt-1"></label><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="closeModal(this);openBankTransfers()" class="bg-slate-200 rounded-xl p-3">ยกเลิก</button><button onclick="saveBankTransfer(this)" class="bg-emerald-600 text-white rounded-xl p-3 font-bold">บันทึกรายการ</button></div></div>`);setTimeout(()=>document.getElementById('btAccount')?.focus(),30)
}
function updateBankTransferFee(){const sel=document.getElementById('btBank'),opt=sel?.selectedOptions?.[0],fee=document.getElementById('btFee');if(fee&&opt)fee.value=n(opt.dataset.fee,0);updateBankTransferTotal()}
function updateBankTransferTotal(){const amount=Math.max(0,n(document.getElementById('btAmount')?.value)),fee=Math.max(0,n(document.getElementById('btFee')?.value)),el=document.getElementById('btTotal');if(el)el.textContent=money(amount+fee)}
function saveBankTransfer(btn){
  const bankId=document.getElementById('btBank')?.value||'',bank=bankById(bankId),accountNumber=(document.getElementById('btAccount')?.value||'').trim(),accountName=(document.getElementById('btAccountName')?.value||'').trim(),transferAmount=Math.max(0,n(document.getElementById('btAmount')?.value)),serviceFee=Math.max(0,n(document.getElementById('btFee')?.value)),paymentMethod=document.getElementById('btMethod')?.value||'cash',note=(document.getElementById('btNote')?.value||'').trim();
  if(!bankId||!accountNumber||!accountName||!transferAmount)return toast('กรอกธนาคาร เลขบัญชี ชื่อบัญชี และยอดโอนให้ครบ',true);
  const now=new Date().toISOString(),x={id:uid('bt'),transferNumber:nextDocumentNumber('transfer',timestampLocalDateKey(now)),time:now,bankId,bankName:bank?.name||bankId,accountNumber,accountName,transferAmount,serviceFee,totalCollected:transferAmount+serviceFee,paymentMethod,note,status:'completed',user:currentUser?.name||'ระบบ',userId:currentUser?.id||'',deviceId:getDeviceId(),deviceName:deviceDisplayName()};state.bankTransfers.unshift(x);audit('bank_transfer_create',`${x.transferNumber} • ${x.bankName} • ${accountNumber} • โอน ${money(transferAmount)} • ค่าบริการ ${money(serviceFee)}`,'bank_transfer',x.id);saveState();closeModal(btn);toast('บันทึกรายการโอนเงินแล้ว');printBankTransferReceipt(x.id);openBankTransfers()
}
function cancelBankTransfer(id,btn){const x=state.bankTransfers.find(r=>r.id===id);if(!x||x.status==='cancelled')return;if(!confirm(`ยกเลิกรายการโอน ${money(x.transferAmount)} ไป ${x.bankName}?`))return;x.status='cancelled';x.cancelledAt=new Date().toISOString();x.cancelledBy=currentUser?.name||'';audit('bank_transfer_cancel',`${x.bankName} • ${x.accountNumber} • ${money(x.transferAmount)}`,'bank_transfer',x.id);saveState();closeModal(btn);toast('ยกเลิกรายการบันทึกแล้ว');openBankTransfers()}
function bankTransferReceiptHtml(x){return `<div style="font-family:Arial,Tahoma,sans-serif;max-width:360px;margin:auto;color:#111"><div style="text-align:center">${safeProductImage(state.config.logo_image)?`<img src="${safeProductImage(state.config.logo_image)}" style="max-width:70px;max-height:55px;object-fit:contain">`:''}<h3 style="margin:4px 0">${esc(state.config.store_name)}</h3><div>${esc(state.config.branch_name)}</div><h4>ใบรับบริการโอนเงิน</h4><div style="font-size:12px">เลขที่ ${esc(x.transferNumber||x.id)}</div></div><hr><div style="display:flex;justify-content:space-between"><span>วันที่</span><span>${new Date(x.time).toLocaleString('th-TH')}</span></div><div style="display:flex;justify-content:space-between"><span>ธนาคาร</span><b>${esc(x.bankName)}</b></div><div style="display:flex;justify-content:space-between"><span>บัญชี</span><b>${esc(x.accountNumber)}</b></div><div style="display:flex;justify-content:space-between"><span>ชื่อบัญชี</span><span>${esc(x.accountName)}</span></div><hr><div style="display:flex;justify-content:space-between"><span>ยอดโอน</span><b>${money(x.transferAmount)}</b></div><div style="display:flex;justify-content:space-between"><span>ค่าบริการ</span><b>${money(x.serviceFee)}</b></div><div style="display:flex;justify-content:space-between;font-size:20px"><span>รับรวม</span><b>${money(x.totalCollected)}</b></div><div style="margin-top:8px;font-size:12px">ผู้ทำรายการ: ${esc(x.user||'-')} • ${esc(x.deviceName||'-')}</div>${x.note?`<div style="font-size:12px">หมายเหตุ: ${esc(x.note)}</div>`:''}<div style="text-align:center;font-size:11px;margin-top:14px">กรุณาตรวจสอบชื่อและเลขบัญชีก่อนยืนยันการโอนจริง</div></div>`}
function printBankTransferReceipt(id){const x=state.bankTransfers.find(r=>r.id===id);if(!x)return;const w=window.open('','_blank','width=480,height=700');if(!w)return toast('เบราว์เซอร์บล็อกหน้าพิมพ์',true);w.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>ใบรับบริการโอนเงิน</title><style>@page{size:80mm auto;margin:4mm}body{margin:0}</style></head><body>${bankTransferReceiptHtml(x)}<script>setTimeout(()=>window.print(),220);<\/script></body></html>`);w.document.close()}
function openBankTransferSettings(src){if(src)closeModal(src);if(!requireRole(['owner','manager']))return toast('เฉพาะเจ้าของ/ผู้จัดการที่ตั้งค่าธนาคารได้',true);const banks=bankTransferSettings().banks;modal(`<div class="bg-white rounded-2xl p-6 max-w-3xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">⚙️ ธนาคาร / ค่าบริการ</h3><p class="text-sm text-slate-500">กำหนดธนาคารที่เปิดใช้และค่าบริการเริ่มต้นต่อรายการ</p></div><button onclick="closeModal(this);openBankTransfers()" class="text-3xl">×</button></div><div class="space-y-2 mt-4">${banks.map((b,i)=>`<div class="grid grid-cols-[auto_1fr_140px] gap-3 items-center border rounded-xl p-3"><input data-bt-enabled data-bank-id="${esc(b.id)}" type="checkbox" class="w-5 h-5" ${b.active!==false?'checked':''}><b>${esc(b.name)}</b><label class="text-xs">ค่าบริการ<input data-bt-fee data-bank-id="${esc(b.id)}" type="number" min="0" step="0.01" value="${n(b.fee)}" class="w-full border rounded p-2 mt-1"></label></div>`).join('')}</div><button onclick="saveBankTransferSettings(this)" class="w-full mt-4 bg-emerald-600 text-white rounded-xl p-3 font-bold">บันทึกและซิงก์ทุกอุปกรณ์</button></div>`)}
function saveBankTransferSettings(btn){const base=bankTransferSettings().banks,banks=base.map(b=>({...b,active:!!document.querySelector(`[data-bt-enabled][data-bank-id="${b.id}"]`)?.checked,fee:Math.max(0,n(document.querySelector(`[data-bt-fee][data-bank-id="${b.id}"]`)?.value,0))}));state.settings.bankTransferSettings={banks};audit('bank_transfer_settings','ปรับธนาคารและค่าบริการ','settings','bank_transfer');saveState();closeModal(btn);toast('บันทึกค่าบริการธนาคารแล้ว');openBankTransfers()}


function productLastNetSaleAt(productId){let last=0;for(const s of (state.sales||[])){if(s.status==='voided')continue;for(const i of (s.items||[])){if(String(i.productId)!==String(productId))continue;const q=Math.max(0,n(i.qty)-returnedQty(s,saleItemKey(i)));if(q>0)last=Math.max(last,Date.parse(s.timestamp||0)||0)}}return last||0}
function deadStockRows(days=30){const now=Date.now(),cut=Math.max(1,Math.trunc(n(days,30)))*86400000;return (state.products||[]).filter(p=>n(p.stock)>0).map(p=>{const last=productLastNetSaleAt(p.id),created=Date.parse(p.createdAt||0)||0,base=last||created||0,age=base?Math.floor((now-base)/86400000):99999;return{...p,lastSale:last?new Date(last).toISOString():'',ageDays:age,stockValue:n(p.stock)*n(p.cost),retailValue:n(p.stock)*n(p.price)}}).filter(r=>r.ageDays*86400000>=cut).sort((a,b)=>b.ageDays-a.ageDays||b.stockValue-a.stockValue)}
function openDeadStockReport(days=30,src=null){if(!hasPermission('viewReports'))return toast('ไม่มีสิทธิ์ดูรายงาน',true);if(src)closeModal(src);days=[30,60,90].includes(Number(days))?Number(days):30;const rows=deadStockRows(days),cost=rows.reduce((a,x)=>a+x.stockValue,0),retail=rows.reduce((a,x)=>a+x.retailValue,0);modal(`<div class="bg-white rounded-2xl p-5 max-w-6xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between gap-3"><div><h3 class="text-2xl font-bold">🐢 รายงานสินค้าค้างสต็อก</h3><p class="text-sm text-slate-500">ดูสินค้าที่มีของคงเหลือแต่ไม่มียอดขายสุทธิ 30 / 60 / 90 วัน เพื่อลดของจม</p></div><button onclick="closeModal(this);${hasPermission('systemSettings')?'openSettings()':''}" class="text-3xl">×</button></div><div class="grid sm:grid-cols-[220px_auto] gap-2 mt-4"><select class="border rounded-xl p-3" onchange="openDeadStockReport(this.value,this)"><option value="30" ${days===30?'selected':''}>ไม่ขาย 30 วันขึ้นไป</option><option value="60" ${days===60?'selected':''}>ไม่ขาย 60 วันขึ้นไป</option><option value="90" ${days===90?'selected':''}>ไม่ขาย 90 วันขึ้นไป</option></select><button onclick="exportDeadStockReport(${days})" class="bg-emerald-600 text-white rounded-xl px-4 py-3 font-bold">📤 Export CSV</button></div><div class="grid grid-cols-3 gap-2 mt-4"><div class="border rounded-xl p-3"><div class="text-xs text-slate-500">รายการค้าง</div><b class="text-2xl">${rows.length}</b></div><div class="border rounded-xl p-3"><div class="text-xs text-slate-500">ทุนที่จม</div><b class="text-xl text-amber-700">${money(cost)}</b></div><div class="border rounded-xl p-3"><div class="text-xs text-slate-500">มูลค่าขาย</div><b class="text-xl">${money(retail)}</b></div></div><div class="overflow-auto mt-4"><table class="w-full text-sm min-w-[900px]"><thead><tr class="bg-slate-100"><th class="p-2 text-left">สินค้า</th><th>หมวด</th><th>คงเหลือ</th><th>ทุน/หน่วย</th><th>ทุนคงค้าง</th><th>ขายล่าสุด</th><th>ค้าง</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-b"><td class="p-2"><b>${esc(r.name)}</b><div class="text-xs text-slate-400">${esc(r.barcode||r.id)}</div></td><td>${esc(r.category||'ทั่วไป')}</td><td class="text-center font-bold">${n(r.stock)}</td><td class="text-right">${money(r.cost)}</td><td class="text-right text-amber-700 font-bold">${money(r.stockValue)}</td><td class="text-center">${r.lastSale?new Date(r.lastSale).toLocaleDateString('th-TH'):'ยังไม่เคยขาย'}</td><td class="text-center font-bold">${r.ageDays>=99999?'ไม่ทราบ':r.ageDays+' วัน'}</td></tr>`).join('')||'<tr><td colspan="7" class="text-center p-10 text-slate-400">ไม่มีสินค้าค้างตามช่วงที่เลือก</td></tr>'}</tbody></table></div></div>`)}
function exportDeadStockReport(days=30){const rows=deadStockRows(days),out=[['รหัส','สินค้า','หมวด','คงเหลือ','ทุนต่อหน่วย','ทุนคงค้าง','ราคาขาย','มูลค่าขาย','ขายล่าสุด','จำนวนวันที่ค้าง'],...rows.map(r=>[r.id,r.name,r.category,r.stock,r.cost,r.stockValue,r.price,r.retailValue,r.lastSale||'ไม่เคยขาย',r.ageDays>=99999?'':r.ageDays])];downloadBlob(`dead-stock-${days}days-${localDateKey()}.csv`,'\ufeff'+out.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}

function taxSettings(){return {...DEFAULT_TAX_SETTINGS,...(state.settings.taxSettings||{})}}
function taxCategoryName(v){return v==='taxable'?'เสีย VAT':v==='non_taxable'?'ยกเว้น VAT / ไม่เสีย VAT':'ยังไม่กำหนด'}
function taxCategoryBadge(v){return v==='taxable'?'bg-emerald-50 text-emerald-700':v==='non_taxable'?'bg-slate-100 text-slate-700':'bg-amber-100 text-amber-800'}
function unassignedProducts(){return (state.products||[]).filter(p=>!['taxable','non_taxable'].includes(p.taxCategory))}
function openTaxSettings(src){if(src)closeModal(src);if(!requireRole(['owner','manager']))return toast('เฉพาะเจ้าของ/ผู้จัดการที่ตั้งค่าภาษีได้',true);const t=taxSettings();modal(`<div class="bg-white rounded-2xl p-6 max-w-xl mx-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">🧾 ตั้งค่าภาษีสินค้า</h3><p class="text-sm text-slate-500">เปิด/ปิดระบบภาษี แยก VAT / ยกเว้น / ยังไม่กำหนด และตรวจสอบก่อนปิดวัน</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><label class="flex items-center gap-3 border rounded-xl p-3 mt-4 bg-slate-50"><input id="taxEnabled" type="checkbox" class="w-5 h-5" ${t.enabled!==false?'checked':''}><span><b>เปิดใช้ระบบภาษีสินค้า</b><br><small class="text-slate-500">ปิดได้โดยข้อมูลประเภทภาษีเดิมของสินค้าจะไม่หาย</small></span></label><label class="block mt-4 font-bold">อัตรา VAT (%)<input id="taxVatRate" type="number" min="0" max="30" step="0.01" value="${n(t.vatRate,7)}" class="w-full border rounded-xl p-3 mt-1"></label><label class="flex items-center gap-3 border rounded-xl p-3 mt-3 bg-amber-50"><input id="taxRequireAssignment" type="checkbox" class="w-5 h-5" ${t.requireAssignmentOnClose!==false?'checked':''}><span><b>ตรวจสินค้าที่ยังไม่กำหนดภาษีก่อนปิดวัน</b><br><small class="text-slate-500">ถ้าวันนั้นมีการขายสินค้าที่ยังไม่กำหนด ระบบจะยังไม่ให้ปิดวันจนกว่าจะจัดประเภท</small></span></label><div class="mt-3 rounded-xl bg-amber-50 border border-amber-200 p-3 text-sm text-amber-900"><b>การคำนวณรายงาน:</b> ราคาขายใน POS ถือว่าเป็นราคาที่รวม VAT แล้วสำหรับสินค้าที่เลือก “เสีย VAT” ระบบจะไม่บวก VAT เพิ่มที่หน้าขาย</div><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="closeModal(this);openTaxAssignmentReview()" class="bg-amber-100 text-amber-900 rounded-xl p-3 font-bold">🔎 ตรวจ ${unassignedProducts().length} สินค้ายังไม่กำหนด</button><button onclick="saveTaxSettings(this)" class="bg-indigo-600 text-white rounded-xl p-3 font-bold">บันทึก</button></div></div>`)}
function saveTaxSettings(btn){state.settings.taxSettings={...taxSettings(),enabled:!!document.getElementById('taxEnabled')?.checked,vatRate:Math.max(0,n(document.getElementById('taxVatRate')?.value,7)),pricesIncludeVat:true,requireAssignmentOnClose:!!document.getElementById('taxRequireAssignment')?.checked};audit('tax_settings',`${state.settings.taxSettings.enabled?'เปิด':'ปิด'}ระบบภาษี • VAT ${state.settings.taxSettings.vatRate}% • ตรวจภาษีก่อนปิดวัน ${state.settings.taxSettings.requireAssignmentOnClose?'เปิด':'ปิด'}`,'settings','tax');saveState();closeModal(btn);toast(state.settings.taxSettings.enabled?'บันทึกระบบภาษีแล้ว':'ปิดระบบภาษีแล้ว • ข้อมูลเดิมยังเก็บไว้');openSettings()}
function taxAssignmentSelectedIds(){return [...document.querySelectorAll('[data-tax-assign]:checked')].map(x=>x.value)}
function toggleAllTaxAssignments(v){document.querySelectorAll('[data-tax-assign]').forEach(x=>x.checked=!!v);updateTaxAssignmentCount()}
function updateTaxAssignmentCount(){const ids=taxAssignmentSelectedIds(),el=document.getElementById('taxAssignCount');if(el)el.textContent=`เลือก ${ids.length} รายการ`}
function applyTaxAssignment(category,all=false){if(!requireRole(['owner','manager']))return toast('ไม่มีสิทธิ์กำหนดภาษีสินค้า',true);const ids=all?unassignedProducts().map(p=>p.id):taxAssignmentSelectedIds();if(!ids.length)return toast('เลือกสินค้าอย่างน้อย 1 รายการ',true);const label=taxCategoryName(category);if(!confirm(`กำหนด ${ids.length} สินค้าเป็น “${label}” ?`))return;let changed=0;for(const p of state.products){if(ids.includes(p.id)){p.taxCategory=category;changed++}}audit('tax_bulk_assign',`${label} • ${changed} สินค้า`,'tax','');saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());toast(`กำหนดภาษี ${changed} สินค้าแล้ว`);openTaxAssignmentReview()}
function openTaxAssignmentReview(src=null){if(src)closeModal(src);if(!requireRole(['owner','manager']))return toast('เฉพาะเจ้าของ/ผู้จัดการที่ตรวจประเภทภาษีได้',true);const rows=unassignedProducts();modal(`<div class="bg-white rounded-2xl p-6 max-w-5xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between gap-3"><div><h3 class="text-2xl font-bold">🔎 ตรวจสินค้าที่ยังไม่กำหนดภาษี</h3><p class="text-sm text-slate-500">ควรกำหนดเป็น “เสีย VAT” หรือ “ยกเว้น VAT / ไม่เสีย VAT” ก่อนปิดวัน เพื่อให้รายงานถูกแยกชัดเจน</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><div class="flex flex-wrap gap-2 items-center mt-4 p-3 rounded-xl bg-amber-50 border border-amber-200"><label class="flex items-center gap-2 font-bold"><input type="checkbox" class="w-5 h-5" onchange="toggleAllTaxAssignments(this.checked)"> เลือกทั้งหมด</label><span id="taxAssignCount" class="text-sm text-slate-500">เลือก 0 รายการ</span><div class="flex-1"></div><button onclick="applyTaxAssignment('non_taxable')" class="px-4 py-2 bg-slate-700 text-white rounded-xl font-bold">ยกเว้น VAT ที่เลือก</button><button onclick="applyTaxAssignment('taxable')" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold">VAT ที่เลือก</button></div><div class="overflow-auto mt-4"><table class="w-full text-sm min-w-[780px]"><thead><tr class="bg-slate-100"><th class="w-12"></th><th class="text-left p-2">สินค้า</th><th>บาร์โค้ด</th><th>หมวด</th><th>ราคาขาย</th><th>คงเหลือ</th></tr></thead><tbody>${rows.map(p=>`<tr class="border-b"><td class="text-center"><input data-tax-assign value="${p.id}" type="checkbox" class="w-5 h-5" onchange="updateTaxAssignmentCount()"></td><td class="p-2"><b>${esc(p.name)}</b></td><td class="text-center font-mono">${esc(p.barcode||p.id)}</td><td class="text-center">${esc(p.category||'ทั่วไป')}</td><td class="text-right">${money(p.price)}</td><td class="text-center">${p.stock}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center p-12 function taxReportRows(from='',to=''){
  const start=from?new Date(from+'T00:00:00').getTime():-Infinity,end=to?new Date(to+'T23:59:59.999').getTime():Infinity,rows=[];
  for(const s of state.sales||[]){if(s.status==='voided')continue;const ts=Date.parse(s.timestamp||0)||0;if(ts<start||ts>end)continue;const saleRatio=n(s.itemSubtotal)>0?n(s.total)/n(s.itemSubtotal):1;for(const i of s.items||[]){const returned=returnedQty(s,saleItemKey(i)),qty=Math.max(0,n(i.qty)-returned);if(qty<=0)continue;const gross=n(i.lineNet)*(qty/Math.max(1,n(i.qty)))*saleRatio,raw=i.taxCategory||state.products.find(p=>p.id===i.productId)?.taxCategory||'unassigned',cat=['taxable','non_taxable'].includes(raw)?raw:'unassigned',rate=Math.max(0,n(i.taxRate,taxSettings().vatRate));let base=0,vat=0,nonTax=0,unassigned=0;if(cat==='taxable'&&rate>0){vat=gross*rate/(100+rate);base=gross-vat}else if(cat==='taxable'){base=gross}else if(cat==='non_taxable')nonTax=gross;else unassigned=gross;rows.push({saleId:s.id,order:s.order_number,time:s.timestamp,productId:i.productId,name:i.name,category:cat,rate,gross,base,vat,nonTax,unassigned,qty})}}
  return rows
}
function taxReportData(from,to){const rows=taxReportRows(from,to);return{rows,taxableGross:rows.reduce((a,x)=>a+(x.category==='taxable'?x.gross:0),0),taxBase:rows.reduce((a,x)=>a+x.base,0),vat:rows.reduce((a,x)=>a+x.vat,0),nonTax:rows.reduce((a,x)=>a+x.nonTax,0),unassigned:rows.reduce((a,x)=>a+x.unassigned,0),total:rows.reduce((a,x)=>a+x.gross,0)}}

function monthDateRange(monthKey){const m=/^\d{4}-\d{2}$/.test(monthKey)?monthKey:localDateKey().slice(0,7),[y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate();return{monthKey:m,from:`${m}-01`,to:`${m}-${String(last).padStart(2,'0')}`}}

function checkout(approved=false){
  if(!requirePermission('sell','ไม่มีสิทธิ์ขายสินค้า / รับชำระ'))return;
  if(!cart.length)return;const c=calcCart();if(paymentMethod==='cash'&&n(cashReceived)<c.total)return toast('รับเงินไม่เพียงพอ',true);const rules=approvalRules(),belowCost=cart.some(i=>n(i.price)<n(i.cost));if(!approved&&rules.enabled&&rules.belowCost&&belowCost&&!requireRole(['owner','manager']))return requestManagerApproval('ขายสินค้าต่ำกว่าทุน',()=>checkout(true));
  const saleDoc=nextSaleDocumentNumber(),order=saleDoc.order,seq=saleDoc.next;
  const now=new Date().toISOString(),beforeBill=c.itemSubtotal,saleItems=cart.map(i=>({lineId:i.cartKey||`${i.productId}|${i.unitId||'base'}`,productId:i.productId,name:i.name,unitId:i.unitId||'base',unitName:i.unitName||'ชิ้น',baseQtyPerUnit:Math.max(1,n(i.baseQtyPerUnit,1)),price:i.price,cost:i.cost,taxCategory:i.taxCategory==='taxable'?'taxable':i.taxCategory==='non_taxable'?'non_taxable':'unassigned',taxRate:n(i.taxRate,state.settings.taxSettings?.vatRate||7),qty:i.qty,baseQty:i.qty*Math.max(1,n(i.baseQtyPerUnit,1)),itemDiscount:i.discount,itemDiscountType:i.discountType,lineNet:itemNet(i)})),mem=currentMember(),cfg=memberPointsConfig();
  for(const i of cart){const p=state.products.find(x=>x.id===i.productId),need=i.qty*Math.max(1,n(i.baseQtyPerUnit,1));if(!p||p.stock<need)return toast(`สต็อก ${i.name} ไม่เพียงพอ`,true)}
  let pointsRedeemed=0,pointsDiscount=0,pointsEarned=0;
  if(mem&&cfg.enabled&&c.pointsRedeemed>0){pointsRedeemed=Math.min(memberPointsBalance(mem),c.pointsRedeemed);pointsDiscount=Math.min(c.pointDiscount,pointsRedeemed*Math.max(0,n(cfg.redeemBahtPerPoint,1)));mem.pointsBalance=memberPointsBalance(mem)-pointsRedeemed;addMemberPointHistory(mem,'redeem',-pointsRedeemed,pointsDiscount,order,`ใช้แต้มเป็นส่วนลด ${money(pointsDiscount)}`);audit('member_points_redeem',`${memberDisplay(mem)} ใช้ ${pointsRedeemed} แต้ม ลด ${money(pointsDiscount)} • ${order}`,'member',mem.id)}
  if(mem&&cfg.enabled&&n(cfg.earnBaht)>0&&n(cfg.earnPoints)>0){pointsEarned=Math.max(0,Math.floor(c.total/n(cfg.earnBaht))*Math.trunc(n(cfg.earnPoints)));if(pointsEarned){mem.pointsBalance=memberPointsBalance(mem)+pointsEarned;addMemberPointHistory(mem,'earn',pointsEarned,c.total,order,`ซื้อ ${money(c.total)}`);audit('member_points_earn',`${memberDisplay(mem)} +${pointsEarned} แต้ม • ${order}`,'member',mem.id)}}
  const sale={id:uid('sale'),order_number:order,timestamp:now,items:saleItems,itemSubtotal:c.itemSubtotal,billDiscount:c.billDiscount,total:c.total,promotion:selectedPromo()?{...selectedPromo()}:null,discountInfo:c.discountInfo||null,payment_method:paymentMethod,cash_received:paymentMethod==='cash'?n(cashReceived):0,change:paymentMethod==='cash'?Math.max(0,n(cashReceived)-c.total):0,cashier:currentUser?.name||'',deviceId:getDeviceId(),deviceName:deviceDisplayName(),member_id:mem?.id||'',customer_name:mem?.name||'ลูกค้าทั่วไป',customer_phone:mem?.phone||'',pointsRedeemed,pointsDiscount,pointsEarned,memberPointsAfter:mem?memberPointsBalance(mem):0,status:'completed',returns:[]};
  for(const i of cart){const p=state.products.find(x=>x.id===i.productId),baseQty=i.qty*Math.max(1,n(i.baseQtyPerUnit,1)),before=p.stock;p.stock-=baseQty;addStockLog(p,'sale',-baseQty,before,p.stock,`ขายสินค้า ${i.qty} ${i.unitName||p.unitName||'ชิ้น'}`,order)}state.sales.push(sale);if(paymentMethod==='credit'&&mem){state.receivables.push({id:uid('ar'),saleId:sale.id,orderNumber:order,memberId:mem.id,customerName:memberDisplay(mem),customerPhone:mem.phone||'',originalAmount:c.total,outstanding:c.total,status:'open',createdAt:now,dueDate:'',payments:[],note:'ขายเชื่อหน้าร้าน'});audit('receivable_create',`${order} • ${memberDisplay(mem)} • ${money(c.total)}`,'receivable',state.receivables[state.receivables.length-1].id)}state.nextOrder=seq;audit('sale',`${order} • ${money(c.total)} • ${methodName(paymentMethod)} • ${saleItems.reduce((sum,x)=>sum+n(x.qty),0)} หน่วยขาย`,'sale',sale.id);if(c.billDiscount||saleItems.some(i=>n(i.itemDiscount)>0))audit('discount_sale',`${order} • ส่วนลดรวม ${money((beforeBill-c.total))}`,'sale',sale.id);saveState();showCustomerPaid(sale);cart=[];resetBillDiscount();memberPointRedemption={points:0,baht:0};currentMemberId='';cashReceived='';paymentMethod='cash';saleView='products';render();toast(`บันทึก ${order} สำเร็จ${pointsEarned?` • +${pointsEarned} แต้ม`:''}`);showReceipt(sale.id);if(getPrinterPrefs().autoPrintReceipt)printReceipt(sale.id)

function emv(tag,val){return tag+String(val.length).padStart(2,'0')+val}
function crc16(s){let crc=0xFFFF;for(let c=0;c<s.length;c++){crc^=s.charCodeAt(c)<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF}return crc.toString(16).toUpperCase().padStart(4,'0')}
function promptPayPayload(id,amount){let proxy;if(id.length===10)proxy=emv('01','0066'+id.slice(1));else proxy=emv('02',id);const merchant=emv('00','A000000677010111')+proxy;let s=emv('00','01')+emv('01','12')+emv('29',merchant)+emv('53','764')+emv('54',Number(amount).toFixed(2))+emv('58','TH')+'6304';return s+crc16(s)}

function processReturn(id,btn,approved=false,dayApproved=false){const s=state.sales.find(x=>x.id===id);if(!s)return;if(saleLockedByDay(s)&&!dayApproved)return requestLockedDayApproval(s,`คืนสินค้า/คืนเงินจาก ${s.order_number}`,()=>processReturn(id,btn,approved,true));const items=[];let returnBase=0;s.items.forEach((i,idx)=>{const key=saleItemKey(i),max=i.qty-returnedQty(s,key),qty=Math.min(max,Math.max(0,Math.trunc(n(document.getElementById('ret_'+idx).value))));if(qty){items.push({lineId:key,productId:i.productId,unitId:i.unitId||'base',unitName:i.unitName||'ชิ้น',baseQtyPerUnit:Math.max(1,n(i.baseQtyPerUnit,1)),name:i.name,qty});returnBase+=i.lineNet*(qty/i.qty)}});if(!items.length)return toast('เลือกจำนวนที่จะคืน',true);const reason=document.getElementById('retReason').value.trim()||'คืนสินค้า';const ratio=s.itemSubtotal>0?s.total/s.itemSubtotal:1,refund=returnBase*ratio,rules=approvalRules();if(!approved&&rules.enabled&&refund>rules.returnBaht&&!requireRole(['owner','manager']))return requestManagerApproval(`คืนเงิน ${money(refund)} จาก ${s.order_number}`,()=>processReturn(id,btn,true));for(const ri of items){const p=state.products.find(x=>x.id===ri.productId),baseQty=ri.qty*Math.max(1,n(ri.baseQtyPerUnit,1));if(p){const before=p.stock;p.stock+=baseQty;addStockLog(p,'return',baseQty,before,p.stock,reason,s.order_number)}}s.returns=s.returns||[];const retTime=new Date().toISOString(),returnNumber=nextDocumentNumber('return',timestampLocalDateKey(retTime));s.returns.push({id:uid('ret'),returnNumber,time:retTime,items,refund,reason,user:currentUser.name,userId:currentUser?.id||'',deviceId:getDeviceId(),deviceName:deviceDisplayName()});if(s.items.every(i=>returnedQty(s,saleItemKey(i))>=i.qty))s.status='returned';audit('return_sale',`${returnNumber} • อ้างอิง ${s.order_number} • คืน ${money(refund)} • ${reason}`,'sale',s.id);saveState();closeModal(btn);document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());render();toast(`คืนสินค้าแล้ว ${money(refund)}`)}

function dayCloseRecord(dateKey){return (state.shiftClosures||[]).filter(x=>x.closureType==='day'&&x.dateKey===dateKey).sort((a,b)=>(Date.parse(b.closedAt||0)||0)-(Date.parse(a.closedAt||0)||0))[0]||null}

function openDayClose(dateKey=localDateKey(),src=null){if(!requirePermission('shiftClose','ไม่มีสิทธิ์ปิดวัน'))return;if(src)closeModal(src);const r=dailyReportData(dateKey),closed=dayCloseRecord(dateKey),t=taxSettings(),blocked=t.enabled!==false&&t.requireAssignmentOnClose!==false&&n(r.taxSummary?.unassigned)>0;modal(`<div class="bg-white rounded-2xl p-6 max-w-5xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex flex-wrap justify-between gap-3"><div><h3 class="text-2xl font-bold">🔒 ปิดวัน / ล็อกยอด</h3><p class="text-sm text-slate-500">สรุปยอดประจำวัน ตรวจภาษี แล้วล็อกบิลของวันนั้นไม่ให้แก้โดยไม่มี PIN</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><div class="grid sm:grid-cols-[240px_1fr] gap-2 mt-4"><input type="date" value="${esc(dateKey)}" max="${localDateKey()}" class="border rounded-xl p-3" onchange="openDayClose(this.value,this)"><div class="rounded-xl p-3 ${closed&&closed.locked!==false?'bg-emerald-50 border border-emerald-200':'bg-slate-50 border'}">${closed&&closed.locked!==false?`🔒 <b>ปิดวันแล้ว</b> • ${new Date(closed.closedAt).toLocaleString('th-TH')} • ${esc(closed.user||'-')}`:closed?`🔓 เคยปิดวัน แต่ปลดล็อกแล้ว • ${esc(closed.user||'-')}`:'ยังไม่ได้ปิดวัน'}</div></div><div class="mt-4">${dailyReportHtml(r)}</div>${blocked?`<div class="mt-4 rounded-xl bg-amber-50 border-2 border-amber-300 p-4 text-amber-900"><b>⚠️ ยังปิดวันไม่ได้</b><br>มีรายการขายที่ยังไม่กำหนดภาษี ${money(r.taxSummary.unassigned)} กรุณาตรวจและกำหนดประเภทก่อน<div><button onclick="closeModal(this);openTaxAssignmentReview()" class="mt-3 bg-amber-500 text-white rounded-xl px-4 py-2 font-bold">🔎 ตรวจสินค้าที่ยังไม่กำหนด</button></div></div>`:''}<label class="block mt-4 font-bold">หมายเหตุปิดวัน<textarea id="dayCloseNote" class="w-full border rounded-xl p-3 mt-1" rows="2" placeholder="หมายเหตุ (ไม่บังคับ)">${esc(closed?.note||'')}</textarea></label><div class="grid sm:grid-cols-3 gap-2 mt-4"><button onclick="printDailyReport('${esc(dateKey)}')" class="bg-slate-800 text-white rounded-xl p-3 font-bold">🖨️ พิมพ์สรุป</button>${closed&&closed.locked!==false?`${requireRole(['owner'])?`<button onclick="unlockDayClose('${esc(dateKey)}',this)" class="bg-amber-500 text-white rounded-xl p-3 font-bold">🔓 ปลดล็อกด้วย PIN</button>`:'<div></div>'}`:`<button onclick="saveDayClose('${esc(dateKey)}',this)" ${blocked?'disabled':''} class="bg-emerald-600 text-white rounded-xl p-3 font-bold disabled:opacity-40">🔒 ปิดวันและล็อกยอด</button>`}<button onclick="openMonthlyTaxSummary('${esc(dateKey.slice(0,7))}',this)" class="bg-sky-100 text-sky-800 rounded-xl p-3 font-bold">📅 ภาษีรายเดือน</button></div><details class="mt-5"><summary class="font-bold cursor-pointer">ประวัติปิดวัน (${dayCloseHistory().length})</summary><div class="space-y-2 mt-2 max-h-60 overflow-auto">${dayCloseHistory().slice(0,90).map(x=>`<div class="border rounded-xl p-3 flex justify-between gap-3"><div><b>${new Date(x.dateKey+'T00:00:00').toLocaleDateString('th-TH')}</b><div class="text-xs text-slate-500">${esc(x.closeNumber||'-')} • ${esc(x.user||'-')} • ${x.count||0} บิล • ${money(x.revenue||0)} • ${x.locked!==false?'🔒 ล็อก':'🔓 ปลดล็อก'}</div></div><button onclick="openDayClose('${x.dateKey}',this)" class="bg-slate-100 rounded-lg px-3 py-2">ดู</button></div>`).join('')}</div></details></div>`)}
function saveDayClose(dateKey,btn){if(!requirePermission('shiftClose','ไม่มีสิทธิ์ปิดวัน'))return;const existing=dayCloseRecord(dateKey);if(existing&&existing.locked!==false)return toast('วันนี้ปิดและล็อกยอดแล้ว',true);const r=dailyReportData(dateKey),t=taxSettings();if(t.enabled!==false&&t.requireAssignmentOnClose!==false&&n(r.taxSummary?.unassigned)>0)return toast('ยังมีรายการขายที่ไม่กำหนดภาษี กรุณาตรวจสอบก่อนปิดวัน',true);if(!confirm(`ยืนยันปิดวัน ${new Date(dateKey+'T00:00:00').toLocaleDateString('th-TH')} และล็อกยอด?\n\nหลังปิดวัน การคืน/ยกเลิก/ลบยอดของวันนี้ต้องใช้ PIN เจ้าของหรือผู้จัดการ`))return;const now=new Date().toISOString(),closeNumber=existing?.closeNumber||nextDocumentNumber('dayclose',dateKey),note=(document.getElementById('dayCloseNote')?.value||'').trim(),snapshot={revenue:r.revenue,cost:r.cost,profit:r.profit,netProfit:r.netProfit,expenseTotal:r.expenseTotal,transferFeeRevenue:r.transferFeeRevenue,refund:r.refund,discount:r.discount,bills:r.bills,payments:r.payments,taxSummary:r.taxSummary};let rec=existing;if(rec)Object.assign(rec,{closeNumber,closedAt:now,user:currentUser?.name||'',userId:currentUser?.id||'',deviceName:deviceDisplayName(),deviceId:getDeviceId(),count:r.bills,revenue:r.revenue,cash:r.payments.cash,qr:r.payments.qr,refund:r.refund,discount:r.discount,cost:r.cost,profit:r.profit,note,snapshot,locked:true});else{rec={id:uid('day'),closeNumber,closureType:'day',dateKey,startedAt:dateKey+'T00:00:00',closedAt:now,user:currentUser?.name||'',userId:currentUser?.id||'',deviceName:deviceDisplayName(),deviceId:getDeviceId(),count:r.bills,revenue:r.revenue,cash:r.payments.cash,qr:r.payments.qr,refund:r.refund,discount:r.discount,cost:r.cost,profit:r.profit,note,snapshot,locked:true};state.shiftClosures.unshift(rec)}audit('day_close',`${closeNumber} • ${dateKey} • ${r.bills} บิล • ${money(r.revenue)} • VAT ${money(r.taxSummary?.vat||0)} • ยกเว้น ${money(r.taxSummary?.nonTax||0)}`,'day_close',rec.id);saveState();createRestorePoint(`ปิดวัน $ function unlockDayClose(dateKey,btn){if(!requireRole(['owner']))return toast('เฉพาะเจ้าของร้านที่ปลดล็อกวันได้',true);const rec=dayCloseRecord(dateKey);if(!rec||rec.locked===false)return toast('วันนี้ไม่ได้ล็อกอยู่',true);requestManagerApproval(`ปลดล็อกยอดวันที่ ${new Date(dateKey+'T00:00:00').toLocaleDateString('th-TH')}`,()=>{rec.locked=false;rec.unlockedAt=new Date().toISOString();rec.unlockedBy=currentUser?.name||'';rec.unlockedDeviceName=deviceDisplayName();audit('day_unlock',`${dateKey} • ปลดล็อกเพื่อแก้ไขย้อนหลัง`,'day_close',rec.id);saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());toast('ปลดล็อกวันแล้ว');openDayClose(dateKey)})}

// Shift/day closing
// -----------------------
function lastShiftClose(){return (state.shiftClosures||[]).filter(x=>x.closureType!=='day').slice().sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt))[0]||null}
function currentShiftStart(){const last=lastShiftClose();if(last)return new Date(last.closedAt);const now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate())}
function shiftMetrics(start=currentShiftStart(),end=new Date()){
  const sales=state.sales.filter(s=>s.status!=='voided'&&new Date(s.timestamp)>=start&&new Date(s.timestamp)<=end);
  let cash=0,qr=0,refund=0,discount=0,cost=0,revenue=0;
  sales.forEach(s=>{const ret=saleReturnedAmount(s),net=n(s.total)-ret;revenue+=net;refund+=ret;discount+=n(s.billDiscount)+s.items.reduce((a,i)=>a+Math.max(0,n(i.price)*n(i.qty)-n(i.lineNet)),0);if(s.payment_method==='cash')cash+=net;else if(s.payment_method==='qr')qr+=net;else qr+=net;s.items.forEach(i=>cost+=n(i.cost)*Math.max(0,n(i.qty)-returnedQty(s,saleItemKey(i)))) });
  return {sales,count:sales.length,cash,qr,refund,discount,cost,revenue,profit:revenue-cost};

function profitRows(){const map=new Map();state.sales.filter(s=>s.status!=='voided').forEach(s=>{const ratio=n(s.itemSubtotal)>0?n(s.total)/n(s.itemSubtotal):1;s.items.forEach(i=>{const returned=returnedQty(s,saleItemKey(i)),qty=Math.max(0,n(i.qty)-returned);if(!qty)return;const grossLine=n(i.lineNet)*(qty/Math.max(1,n(i.qty))),revenue=grossLine*ratio,cost=n(i.cost)*qty,key=i.productId||i.name,r=map.get(key)||{productId:i.productId,name:i.name,qty:0,revenue:0,cost:0,profit:0};r.qty+=qty;r.revenue+=revenue;r.cost+=cost;r.profit+=revenue-cost;map.set(key,r)})});return [...map.values()].sort((a,b)=>b.profit-a.profit)}
function periodProfit(start,end=new Date()){let revenue=0,cost=0;state.sales.filter(s=>s.status!=='voided'&&new Date(s.timestamp)>=start&&new Date(s.timestamp)<=end).forEach(s=>{revenue+=n(s.total)-saleReturnedAmount(s);s.items.forEach(i=>cost+=n(i.cost)*Math.max(0,n(i.qty)-returnedQty(s,saleItemKey(i))))});return {revenue,cost,profit:revenue-cost}}

function duplicateKey(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
function detectDataAnomalies(){
  const issues=[],barcodeMap=new Map(),nameMap=new Map();
  for(const p of state.products){const b=duplicateKey(p.barcode),nm=duplicateKey(p.name);if(b){if(!barcodeMap.has(b))barcodeMap.set(b,[]);barcodeMap.get(b).push(p)}if(nm){if(!nameMap.has(nm))nameMap.set(nm,[]);nameMap.get(nm).push(p)}}
  for(const [code,arr] of barcodeMap)if(arr.length>1)arr.forEach(p=>issues.push({type:'barcode',productId:p.id,title:'บาร์โค้ดซ้ำ',detail:`${code} ซ้ำ ${arr.length} รายการ`}));
  for(const [name,arr] of nameMap)if(arr.length>1)arr.forEach(p=>issues.push({type:'name',productId:p.id,title:'ชื่อสินค้าซ้ำ',detail:`${p.name} ซ้ำ ${arr.length} รายการ`}));
  for(const p of state.products){const sell=effectiveProductPrice(p),cost=n(p.cost);if(cost>0&&sell<cost)issues.push({type:'belowCost',productId:p.id,title:'ราคาขายต่ำกว่าทุน',detail:`ขาย ${money(sell)} • ทุน ${money(cost)}${productPromoStatus(p).active?' • ราคาโปร':''}`});if(n(p.stock)<0)issues.push({type:'negativeStock',productId:p.id,title:'สต็อกติดลบ',detail:`คงเหลือ ${p.stock}`})}
  return issues
}
function anomalyTypeLabel(t){return ({barcode:'บาร์โค้ดซ้ำ',name:'ชื่อสินค้าซ้ำ',belowCost:'ขายต่ำกว่าทุน',negativeStock:'สต็อกติดลบ'}[t]||t)}
