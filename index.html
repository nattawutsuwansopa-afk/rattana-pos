  if(!requirePermission('systemSettings','ไม่มีสิทธิ์ตรวจข้อมูลระบบ'))return;const issues=detectDataAnomalies(),counts={};issues.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);
  modal(`<div class="bg-slate-50 rounded-2xl p-5 max-w-6xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">🔍 ตรวจข้อมูลผิดปกติ</h3><p class="text-sm text-slate-500">ตรวจบาร์โค้ดซ้ำ • ชื่อซ้ำ • ราคาต่ำกว่าทุน • สต็อกติดลบ</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-2 mt-4">${['barcode','name','belowCost','negativeStock'].map(k=>`<div class="bg-white border rounded-xl p-3"><div class="text-xs text-slate-500">${anomalyTypeLabel(k)}</div><b class="text-2xl ${counts[k]?'text-red-600':'text-emerald-600'}">${counts[k]||0}</b></div>`).join('')}</div><div class="mt-4 bg-white border rounded-2xl overflow-hidden"><div class="overflow-auto max-h-[58vh]"><table class="w-full text-sm min-w-[720px]"><thead><tr class="bg-slate-100"><th class="text-left p-3">ปัญหา</th><th class="text-left">สินค้า</th><th class="text-left">รายละเอียด</th><th></th></tr></thead><tbody>${issues.map(x=>{const p=state.products.find(a=>a.id===x.productId);return `<tr class="border-b"><td class="p-3 font-bold text-red-700">${esc(x.title)}</td><td>${esc(p?.name||x.productId)}</td><td>${esc(x.detail)}</td><td class="p-2 text-right">${hasPermission('editProduct')&&p?`<button onclick="closeModal(this);editProduct('${p.id}')" class="px-3 py-2 rounded-lg bg-indigo-100">แก้ไข</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="4" class="text-center p-12 text-emerald-700 font-bold">✅ ไม่พบข้อมูลผิดปกติ</td></tr>'}</tbody></table></div></div><div class="rounded-xl bg-sky-50 border border-sky-200 p-3 text-xs text-sky-900 mt-4">การตรวจนี้ไม่แก้หรือลบข้อมูลอัตโนมัติ เพื่อป้องกันข้อมูลหน้าร้านเปลี่ยนโดยไม่ตั้งใจ</div><button onclick="closeModal(this);openSettings()" class="w-full bg-slate-200 rounded-xl p-3 mt-4">กลับเมนูตั้งค่า</button></div>`)
}

function centralTrashRows(filter='all'){let rows=activeRecycleItems().slice().sort((a,b)=>(Date.parse(b.deletedAt||b.updatedAt||0)||0)-(Date.parse(a.deletedAt||a.updatedAt||0)||0));if(filter!=='all')rows=filter==='other'?rows.filter(e=>!['products','sales','members','promotions'].includes(e.collection)):rows.filter(e=>e.collection===filter);return rows}
function openCentralRecycleBin(filter='all',source=null){
  if(!requireRole(['owner']))return toast('ถังขยะกลางสำหรับเจ้าของร้านเท่านั้น',true);if(source)closeModal(source);const rows=centralTrashRows(filter),total=activeRecycleItems().length;
  modal(`<div class="bg-slate-50 rounded-2xl p-5 max-w-6xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between gap-3"><div><h3 class="text-2xl font-bold">🗑️ ถังขยะกลาง (${total})</h3><p class="text-sm text-slate-500">Soft Delete จากทุกอุปกรณ์ • เรียกกลับได้และซิงก์กลับทุกเครื่อง</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><div class="grid sm:grid-cols-[240px_1fr_auto] gap-2 mt-4"><select class="border rounded-xl p-3" onchange="openCentralRecycleBin(this.value,this)"><option value="all" ${filter==='all'?'selected':''}>ทุกหมวด</option><option value="products" ${filter==='products'?'selected':''}>สินค้า</option><option value="sales" ${filter==='sales'?'selected':''}>ยอดขาย</option><option value="members" ${filter==='members'?'selected':''}>สมาชิก</option><option value="promotions" ${filter==='promotions'?'selected':''}>โปรโมชั่น</option><option value="other" ${filter==='other'?'selected':''}>หมวดอื่น</option></select><label class="border rounded-xl p-3 bg-white flex items-center gap-2"><input id="centralTrashAll" type="checkbox" class="w-5 h-5" onchange="toggleCentralTrashAll(this.checked)"> เลือกทั้งหมดในหน้านี้ <span id="centralTrashCount" class="text-slate-500">0 รายการ</span></label><button onclick="restoreCentralTrashSelected(this,'${filter}')" class="bg-amber-500 text-white rounded-xl px-4 py-3 font-bold">↩️ เรียกกลับที่เลือก</button></div><div class="space-y-2 mt-4">${rows.slice(0,500).map(e=>`<div class="bg-white border rounded-xl p-3 flex items-center gap-3"><input data-central-trash value="${e.id}" type="checkbox" class="w-5 h-5 shrink-0" onchange="updateCentralTrashCount()"><div class="flex-1 min-w-0"><div><b>${esc(recycleCollectionLabel(e.collection))}</b> • ${esc(e.record?.name||e.record?.order_number||e.record?.id||e.recordId)}</div><div class="text-xs text-slate-400">ลบ ${new Date(e.deletedAt||e.updatedAt).toLocaleString('th-TH')} • เครื่อง ${esc(e.deviceId||'-')}</div></div><button onclick="restoreCentralTrashOne('${e.id}',this,'${filter}')" class="px-3 py-2 bg-amber-100 text-amber-900 rounded-lg font-bold">เรียกกลับ</button></div>`).join('')||'<div class="text-center text-slate-400 py-12">ไม่มีรายการในหมวดนี้</div>'}</div>${rows.length>500?`<div class="text-center text-xs text-slate-500 mt-3">แสดง 500 รายการล่าสุดจาก ${rows.length} รายการ</div>`:''}<button onclick="closeModal(this);openSettings()" class="w-full bg-slate-200 rounded-xl p-3 mt-4">กลับเมนูตั้งค่า</button></div>`)
}
function centralTrashSelectedIds(){return [...document.querySelectorAll('[data-central-trash]:checked')].map(x=>x.value)}
function updateCentralTrashCount(){const ids=centralTrashSelectedIds(),el=document.getElementById('centralTrashCount'),all=document.getElementById('centralTrashAll'),boxes=[...document.querySelectorAll('[data-central-trash]')];if(el)el.textContent=`${ids.length} รายการ`;if(all){all.checked=boxes.length>0&&ids.length===boxes.length;all.indeterminate=ids.length>0&&ids.length<boxes.length}}
function toggleCentralTrashAll(v){document.querySelectorAll('[data-central-trash]').forEach(x=>x.checked=!!v);updateCentralTrashCount()}
function restoreRecycleEntries(ids){const set=new Set(ids.map(String)),now=new Date().toISOString(),dev=getDeviceId();let restored=0;for(const e of (state.recycleBin||[])){if(!set.has(String(e.id))||e.restoredAt||e.purgedAt)continue;const list=Array.isArray(state[e.collection])?state[e.collection]:null;if(!list)continue;if(!list.some(x=>String(x.id)===String(e.recordId)))list.unshift(JSON.parse(JSON.stringify(e.record)));e.restoredAt=now;e.updatedAt=now;e.deviceId=dev;setTombstone(e.collection,e.recordId,false,now,dev);queueSyncChange('recycleBin',e.id,'restore',now);restored++}if(restored)saveState();return restored}
function restoreCentralTrashSelected(btn,filter='all'){const ids=centralTrashSelectedIds();if(!ids.length)return toast('เลือกรายการที่ต้องการเรียกกลับก่อน',true);if(!confirm(`เรียกกลับ ${ids.length} รายการที่เลือก?`))return;const restored=restoreRecycleEntries(ids);closeModal(btn);toast(`เรียกกลับ ${restored} รายการแล้ว • จะซิงก์ไปทุกเครื่อง`);openCentralRecycleBin(filter)}
function restoreCentralTrashOne(id,btn,filter='all'){if(!confirm('เรียกกลับรายการนี้?'))return;const restored=restoreRecycleEntries([id]);closeModal(btn);toast(restored?'เรียกกลับแล้ว • จะซิงก์ไปทุกเครื่อง':'ไม่พบรายการที่เรียกกลับ');openCentralRecycleBin(filter)}

function localDateKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function timestampLocalDateKey(v){const d=new Date(v);return Number.isNaN(d.getTime())?String(v||'').slice(0,10):localDateKey(d)}
function dailyReportData(dateKey=localDateKey()){
  const sales=state.sales.filter(s=>timestampLocalDateKey(s.timestamp)===dateKey),valid=sales.filter(s=>s.status!=='voided');let revenue=0,cost=0,refund=0,discount=0;const payments={cash:0,qr:0,credit:0},items={};
  for(const sale of valid){const returned=saleReturnedAmount(sale),net=Math.max(0,n(sale.total)-returned);revenue+=net;refund+=returned;discount+=n(sale.billDiscount);payments[sale.payment_method]=(payments[sale.payment_method]||0)+net;for(const i of sale.items||[]){const ret=returnedQty(sale,saleItemKey(i)),q=Math.max(0,n(i.qty)-ret);cost+=n(i.cost)*q;const key=i.productId||i.name,r=items[key]||{name:i.name,qty:0,revenue:0};r.qty+=q;r.revenue+=n(i.lineNet)*(q/Math.max(1,n(i.qty)));items[key]=r}}
  const expenses=(state.expenses||[]).filter(x=>timestampLocalDateKey(x.time)===dateKey),expenseTotal=expenses.reduce((a,x)=>a+n(x.amount),0),transfers=(state.bankTransfers||[]).filter(x=>timestampLocalDateKey(x.time)===dateKey&&x.status!=='cancelled'),transferFeeRevenue=transfers.reduce((a,x)=>a+n(x.serviceFee),0),grossProfit=revenue-cost,netProfit=grossProfit+transferFeeRevenue-expenseTotal;
  const ts=taxSettings(),td=taxReportData(dateKey,dateKey),taxSummary={enabled:ts.enabled!==false,vatRate:n(ts.vatRate,7),taxableGross:td.taxableGross,taxBase:td.taxBase,vat:td.vat,nonTax:td.nonTax,unassigned:td.unassigned,total:td.total};
  return{dateKey,revenue,cost,profit:grossProfit,transferFeeRevenue,transferCount:transfers.length,expenseTotal,netProfit,expenses,refund,discount,bills:valid.length,voided:sales.length-valid.length,payments,taxSummary,top:Object.values(items).sort((a,b)=>b.qty-a.qty||b.revenue-a.revenue).slice(0,10)}
}
function dailyReportHtml(r){const date=new Date(r.dateKey+'T00:00:00'),tx=r.taxSummary||{};return `<div class="grid grid-cols-2 md:grid-cols-4 gap-2"><div class="border rounded-xl p-3"><div class="text-xs text-slate-500">ยอดขายสุทธิ</div><b class="text-xl text-emerald-700">${money(r.revenue)}</b></div><div class="border rounded-xl p-3"><div class="text-xs text-slate-500">กำไรขั้นต้น</div><b class="text-xl ${r.profit>=0?'text-emerald-700':'text-red-700'}">${money(r.profit)}</b><div class="text-xs text-slate-400">ค่าใช้จ่าย ${money(r.expenseTotal)}</div><div class="text-xs font-bold ${r.netProfit>=0?'text-emerald-700':'text-red-700'}">สุทธิ ${money(r.netProfit)}</div></div><div class="border rounded-xl p-3"><div class="text-xs text-slate-500">จำนวนบิล</div><b class="text-xl">${r.bills}</b><div class="text-xs text-slate-400">ยกเลิก ${r.voided}</div></div><div class="border rounded-xl p-3"><div class="text-xs text-slate-500">คืนเงิน</div><b class="text-xl text-red-600">${money(r.refund)}</b></div></div>${tx.enabled?`<section class="border-2 border-emerald-200 bg-emerald-50/40 rounded-2xl p-4 mt-4"><div class="flex justify-between gap-3 items-center"><div><h4 class="font-bold text-lg">🧾 สรุปภาษีวันนี้</h4><div class="text-xs text-slate-500">แยกยอดขายสินค้าที่เสีย VAT และสินค้าที่ไม่เสีย VAT / ยกเว้น</div></div><span class="px-3 py-1 rounded-full bg-white border text-sm font-bold">VAT ${tx.vatRate}%</span></div><div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-3"><div class="bg-white border rounded-xl p-3"><div class="text-xs text-slate-500">ขายสินค้าเสีย VAT</div><b class="text-xl text-indigo-700">${money(tx.taxableGross)}</b></div><div class="bg-white border rounded-xl p-3"><div class="text-xs text-slate-500">มูลค่าก่อน VAT</div><b class="text-xl">${money(tx.taxBase)}</b></div><div class="bg-white border rounded-xl p-3"><div class="text-xs text-slate-500">VAT จากยอดขาย</div><b class="text-xl text-emerald-700">${money(tx.vat)}</b></div><div class="bg-white border roun /div>`).join('')||'<div class="text-slate-400 text-center py-6">ยังไม่มีรายการขาย</div>'}</div></section></div><div class="text-xs text-slate-400 mt-3">รายงานวันที่ ${date.toLocaleDateString('th-TH',{dateStyle:'long'})} • คำนวณจากข้อมูลที่ซิงก์อยู่ในเครื่องนี้</div>`}

function downloadBlob(name,content,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backupJSON(){downloadBlob(`POS-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,2),'application/json')}
function restoreBackup(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.products||!s.sales)throw new Error('รูปแบบไม่ถูกต้อง');if(confirm('นำเข้าข้อมูลสำรองและแทนที่ข้อมูลปัจจุบัน?')){state=normalizeLoadedState(s);saveState();toast('กู้คืนข้อมูลแล้ว');render()}}catch(e){toast('ไฟล์ Backup ไม่ถูกต้อง',true)}ev.target.value=''};r.readAsText(file)}
function csvCell(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportProducts(){const rows=[['รหัส','ชื่อ','หมวดหมู่','ประเภทภาษี','บาร์โค้ด','คำค้น','ผู้ขาย','ราคาขาย','ราคาทุน','สต็อก','จุดเตือน','วันหมดอายุ'],...state.products.map(p=>[p.id,p.name,p.category,taxCategoryName(p.taxCategory),p.barcode,p.keywords||'',supplierNameById(p.supplierId),p.price,p.cost,p.stock,p.lowStock,p.expiryDate||''])];downloadBlob('products.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportSales(){const rows=[['เลขบิล','วันที่','พนักงาน','วิธีชำระ','ยอดสุทธิ','คืนเงิน','สถานะ','สินค้า'],...state.sales.map(s=>[s.order_number,s.timestamp,s.cashier,methodName(s.payment_method),s.total,saleReturnedAmount(s),s.status,s.items.map(i=>`${i.name} x${i.qty}`).join('; ')])];downloadBlob('sales.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function activeRecycleItems(){return (state.recycleBin||[]).filter(x=>!x.restoredAt&&!x.purgedAt)}
function recycleCollectionLabel(k){return ({products:'สินค้า',sales:'ยอดขาย',stockLogs:'ประวัติสต็อก',heldBills:'บิลพัก',promotions:'โปรโมชั่น',members:'สมาชิก',users:'ผู้ใช้',suppliers:'ผู้ขาย',supplierLedger:'เจ้าหนี้',shiftClosures:'ปิดกะ',stockCounts:'ตรวจนับสต็อก',auditLogs:'ประวัติแก้ไข',purchaseOrders:'ใบสั่งซื้อ PO',expenses:'ค่าใช้จ่ายร้าน',receivables:'ลูกหนี้',costHistory:'ประวัติต้นทุน',bankTransfers:'รายการโอนเงิน'}[k]||k)}
function openCloudRecycleBin(){if(!requireRole(['owner']))return toast('ถังขยะสำหรับเจ้าของร้านเท่านั้น',true);const rows=activeRecycleItems().slice(0,300);modal(`<div class="bg-white rounded-2xl p-6 max-w-4xl mx-auto max-h-[92vh] overflow-y-auto"><div class="flex justify-between items-center"><div><h3 class="text-2xl font-bold">🗑️ ถังขยะ Cloud</h3><p class="text-sm text-slate-500">รายการที่ลบจะยังเก็บเป็น Soft Delete และซิงก์ไปทุกเครื่อง จนกว่าจะเรียกกลับ</p></div><button onclick="closeModal(this);openDataTools()" class="text-3xl">×</button></div><div class="mt-4 space-y-2">${rows.map(e=>`<div class="border rounded-xl p-3 flex items-center gap-3"><div class="flex-1"><b>${esc(recycleCollectionLabel(e.collection))}</b><div class="text-sm">${esc(e.record?.name||e.record?.order_number||e.record?.id||e.recordId)}</div><div class="text-xs text-slate-400">ลบ ${new Date(e.deletedAt||e.updatedAt).toLocaleString('th-TH')}</div></div><button onclick="restoreCloudRecycle('${e.id}',this)" class="px-3 py-2 bg-amber-100 text-amber-900 rounded-lg font-bold">↩️ เรียกกลับ</button></div>`).join('')||'<div class="text-center text-slate-400 py-12">ถังขยะว่าง</div>'}</div><button onclick="closeModal(this);openDataTools()" class="w-full bg-slate-200 rounded-xl p-3 mt-4">กลับ</button></div>`)}
function restoreCloudRecycle(entryId,btn){if(!requireRole(['owner']))return;const e=(state.recycleBin||[]).find(x=>x.id===entryId);if(!e||e.restoredAt||e.purgedAt)return toast('รายการนี้ถูกเรียกกลับแล้ว',true);if(!confirm(`เรียกกลับ ${recycleCollectionLabel(e.collection)} รายการนี้?`))return;const list=Array.isArray(state[e.collection])?state[e.collection]:null;if(!list)return toast('หมวดข้อมูลไม่รองรับ',true);if(!list.some(x=>String(x.id)===String(e.recordId)))list.unshift(JSON.parse(JSON.stringify(e.record)));const now=new Date().toISOString(),dev=getDeviceId();e.restoredAt=now;e.updatedAt=now;e.deviceId=dev;setTombstone(e.collection,e.recordId,false,now,dev);queueSyncChange('recycleBin',e.id,'restore',now);saveState();closeModal(btn);toast('เรียกกลับแล้ว • จะซิงก์ไปทุกเครื่อง');openCloudRecycleBin()}
async function cloudBackupAction(action){const cfg=getSyncCfg();if(!cfg.url||!cfg.token)return toast('ตั้งค่า Cloud Sync ก่อน',true);if(!navigator.onLine)return toast('ต้องออนไลน์เพื่อสำรอง Cloud',true);try{const res=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:cfg.token,deviceId:getDeviceId(),schemaVersion:SYNC_SCHEMA_VERSION})});const data=await res.json();if(!data.ok)throw new Error(data.error||'backup failed');if(data.backupDate)localStorage.setItem(SYNC_CFG_KEY+'_backup_date',data.backupDate);toast(action==='setup_daily_backup'?'✅ เปิดสำรอง Cloud รายวันแล้ว':'✅ สำรอง Cloud แล้ว '+(data.backupDate||''))}catch(e){toast('สำรอง Cloud ไม่สำเร็จ • ตรวจ Backend v6.16 และสิทธิ์ Google Drive',true)}}

function backupDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(AUTO_BACKUP_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(AUTO_BACKUP_STORE)){const st=db.createObjectStore(AUTO_BACKUP_STORE,{keyPath:'id'});st.createIndex('time','time',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function listRestorePoints(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(AUTO_BACKUP_STORE,'readonly'),req=tx.objectStore(AUTO_BACKUP_STORE).getAll();req.onsuccess=()=>{db.close();resolve((req.result||[]).sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0)))};req.onerror=()=>{db.close();reject(req.error)}})}
async function getRestorePoint(id){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(AUTO_BACKUP_STORE,'readonly'),req=tx.objectStore(AUTO_BACKUP_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}
async function createRestorePoint(label='อัตโนมัติ',force=false){try{const now=new Date(),day=localDateKey(now),rows=await listRestorePoints();if(!force&&rows.some(x=>x.day===day&&x.kind==='auto'))return false;const rec={id:`${day}-${force?Date.now():'auto'}-${getDeviceId().slice(-4)}`,day,time:now.toISOString(),kind:force?'manual':'auto',label,deviceName:deviceDisplayName(),state:JSON.stringify(state)};const db=await backupDb();await new Promise((resolve,reject)=>{const tx=db.transaction(AUTO_BACKUP_STORE,'readwrite');tx.objectStore(AUTO_BACKUP_STORE).put(rec);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();await pruneRestorePoints();return true}catch(e){console.warn('restore point skipped',e);return false}}
async function pruneRestorePoints(){try{const rows=await listRestorePoints(),cut=Date.now()-AUTO_BACKUP_RETENTION_DAYS*86400000,remove=rows.filter(x=>(Date.parse(x.time)||0)<cut);if(!remove.length)return;const db=await backupDb();await new Promise((resolve,reject)=>{const tx=db.transaction(AUTO_BACKUP_STORE,'readwrite'),st=tx.objectStore(AUTO_BACKUP_STORE);remove.forEach(x=>st.delete(x.id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn(e)}}
async function ensureDailyRestorePoint(){return createRestorePoint('สำรองอัตโนมัติประจำวัน',false)}
async function openRestorePoints(days=30,src=null){if(src)closeModal(src);if(!hasPermission('dataTools')&&!ownerReportOnlyMode())return toast('ไม่มีสิทธิ์ดูจุดกู้คืน',true);days=Number(days)===7?7:30;let rows=[];try{rows=(await listRestorePoints()).filter(x=>(Date.now()-(Date.parse(x.time)||0))<=days*86400000)}catch(e){return toast('อุปกรณ์นี้ไม่รองรับจุดกู้คืนในเบราว์เซอร์',true)}modal(`<div class="bg-white rounded-2xl p-5 max-w-4xl mx-auto max-h-[94vh] overflow-y-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">🛟 จุดกู้คืนข้อมูล</h3><p class="text-sm text-slate-500">สำรองอัตโนมัติวันละครั้งในอุปกรณ์นี้ • เก็บย้อนหลังสูงสุด 30 วัน</p></div><button onclick="closeModal(this);${hasPermission('systemSettings')?'openSettings()':''}" class="text-3xl">×</button></div><div class="grid grid-cols-3 gap-2 mt-4"><button onclick="openRestorePoints(7,this)" class="rounded-xl p-3 ${days===7?'bg-indigo-600 text-white':'bg-slate-100'} font-bold">7 วัน</button><button onclick="openRestorePoints(30,this)" class="rounded-xl p-3 ${days===30?'bg-indigo-600 text-white':'bg-slate-100'} font-bold">30 วัน</button>${ownerReportOnlyMode()?'<div></div>':'<button onclick="manualRestorePoint(this)" class="rounded-xl p-3 bg-emerald-600 text-white font-bold">+ สำรองตอนนี้</button>'}</div><div class="space-y-2 mt-4">${rows.map(x=>`<div class="border rounded-xl p-3 flex items-center gap-3"><div class="flex-1"><b>${esc(x.label||'จุดกู้คืน')}</b><div class="text-xs text-slate-500">${new Date(x.time).toLocaleString('th-TH')} • ${esc(x.deviceName||'-')} • ${x.kind==='auto'?'อัตโนมัติ':'สร้างเอง'}</div></div>${ownerReportOnlyMode()?'':`<button onclick="restoreFromPoint('${x.id}',this)" class="px-4 py-2 bg-amber-100 text-amber-900 rounded-lg font-bold">↩️ กู้คืน</button>`}</div>`).join('')||'<div class="text-center text-slate-400 py-12">ยังไม่มีจุดกู้คืนในช่วงนี้</div>'}</div><div class="mt-4 rounded-xl bg-amber-50 border border-amber-200 p-3 text-xs text-amber-900">จุดกู้คืนนี้เก็บในเครื่องนี้เพื่อย้อนความผิดพลาดได้รวดเร็ว ส่วนสำรอง Cloud รายวันยังใช้งานแยกต่างหากในเมนู Backup / Cloud</div></div>`)}
async function manualRestorePoint(btn){await createRestorePoint('สำรองด้วยตนเอง',true);closeModal(btn);toast('สร้างจุดกู้คืนแล้ว');openRestorePoints(30)}
async function restoreFromPoint(id,btn){if(ownerReportOnlyMode())return toast('โหมดดูอย่างเดียวไม่อนุญาตให้กู้คืนข้อมูล',true);const x=await getRestorePoint(id);if(!x)return toast('ไม่พบจุดกู้คืนนี้',true);if(!confirm(`กู้คืนข้อมูลกลับไปเวลา ${new Date(x.time).toLocaleString('th-TH')}?\n\nข้อมูลปัจจุบันจะถูกแทนที่ในเครื่องนี้`))return;try{const restored=JSON.parse(x.state);await createRestorePoint('ก่อนกู้คืน '+new Date().toLocaleString('th-TH'),true);state=normalizeLoadedState(restored);saveState();closeModal(btn);render();toast('กู้คืนข้อมูลเรียบร้อย')}catch(e){toast('กู้คืนไม่สำเร็จ',true)}}
function dateKeysBetween(from,to){const a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00'),out=[];if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime())||a>b)return out;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push(localDateKey(d));return out}
function accountingExportRows(from,to){return dateKeysBetween(from,to).map(date=>{const r=dailyReportData(date),ars=(state.receivables||[]).filter(x=>timestampLocalDateKey(x.createdAt)===date),creditCreated=ars.reduce((a,x)=>a+n(x.originalAmount),0),creditOutstanding=ars.reduce((a,x)=>a+n(x.outstanding),0);return[date,r.revenue,r.taxSummary?.taxableGross||0,r.taxSummary?.taxBase||0,r.taxSummary?.vat||0,r.taxSummary?.nonTax||0,r.taxSummary?.unassigned||0,r.expenseTotal||0,creditCreated,creditOutstanding,r.transferFeeRevenue||0,r.refund||0,r.netProfit||0]})}
function accountingHeaders(){return['วันที่','ยอดขายสุทธิ','ยอดสินค้า VAT','มูลค่าก่อน VAT','VAT','ยอดยกเว้น VAT','ยังไม่กำหนดภาษี','ค่าใช้จ่าย','ขายเชื่อ/ลูกหนี้ใหม่','ลูกหนี้คงค้างปัจจุบันของรายการช่วงนั้น','ค่าบริการโอนเงิน','คืนเงิน','กำไรสุทธิหลังค่าใช้จ่าย']}

function bulkCategoryConfig(cat){
  return ({
    products:{field:'products',label:'รายการสินค้า',reopen:()=>render()},
    sales:{field:'sales',label:'ยอดขาย / กำไร',reopen:()=>render()},
    members:{field:'members',label:'สมาชิก',reopen:()=>openMembersSettings()},
    promotions:{field:'promotions',label:'โปรโมชั่น',reopen:()=>openPromotions()},
    suppliers:{field:'suppliers',label:'ผู้ขายสินค้า',reopen:()=>openSuppliers()},
    heldBills:{field:'heldBills',label:'บิลพัก',reopen:()=>openHeldBills()},
    shiftClosures:{field:'shiftClosures',label:'ประวัติปิดกะ',reopen:()=>openShiftClose()},
    auditLogs:{field:'auditLogs',label:'ประวัติการแก้ไข',reopen:()=>openAuditLogs()}
  })[cat]||null
}
function getBulkTrashStore(){try{return JSON.parse(localStorage.getItem(BULK_TRASH_KEY)||'{}')||{}}catch(e){return {}}}
function getBulkTrash(cat){return getBulkTrashStore()[cat]||null}
function saveBulkTrash(cat,items,label){const store=getBulkTrashStore();store[cat]={savedAt:new Date().toISOString(),label,items:JSON.parse(JSON.stringify(items||[]))};localStorage.setItem(BULK_TRASH_KEY,JSON.stringify(store));return store[cat]}
function clearBulkTrash(cat){const store=getBulkTrashStore();delete store[cat];localStorage.setItem(BULK_TRASH_KEY,JSON.stringify(store))}
function bulkToggleAll(cat,checked){document.querySelectorAll(`[data-bulk-cat="${cat}"]`).forEach(x=>x.checked=!!checked);bulkUpdateCount(cat)}
function bulkUpdateCount(cat){const n=document.querySelectorAll(`[data-bulk-cat="${cat}"]:checked`).length,el=document.querySelector(`[data-bulk-count="${cat}"]`);if(el)el.textContent=`เลือก ${n} รายการ`;const all=document.querySelector(`[data-bulk-all="${cat}"]`),boxes=[...document.querySelectorAll(`[data-bulk-cat="${cat}"]`)];if(all){all.checked=boxes.length>0&&boxes.every(x=>x.checked);all.indeterminate=n>0&&!all.checked}}
function bulkSelectedIds(cat){return [...document.querySelectorAll(`[data-bulk-cat="${cat}"]:checked`)].map(x=>x.value)}
function bulkToolbar(cat,total){
  if(!requireRole(['owner']))return '';
  const trash=getBulkTrash(cat),info=trash?`เรียกกลับ ${trash.items?.length||0} รายการ`:'ยังไม่มีรายการที่ลบไว้';
  return `<div class="flex flex-wrap items-center gap-2 mt-3 p-3 rounded-xl bg-slate-50 border"><label class="flex items-center gap-2 font-bold"><input data-bulk-all="${cat}" type="checkbox" class="w-5 h-5" onchange="bulkToggleAll('${cat}',this.checked)"> เลือกทั้งหมด</label><span data-bulk-count="${cat}" class="text-sm text-slate-500">เลือก 0 รายการ</span><span class="text-xs text-slate-400">ทั้งหมด ${total}</span><div class="flex-1"></div><button onclick="bulkDeleteSelected('${cat}',this)" class="px-3 py-2 rounded-lg bg-red-600 text-white font-bold">🗑️ ลบที่เลือก</button><button onclick="bulkRestoreLast('${cat}',this)" class="px-3 py-2 rounded-lg bg-amber-100 text-amber-900 font-bold" ${trash?'':'disabled style="opacity:.45"'}>↩️ ${esc(info)}</button></div>`
}
function reopenBulkCategory(cat){document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());const cfg=bulkCategoryConfig(cat);if(cfg&&cfg.reopen)cfg.reopen();else render()}
function bulkDeleteSelected(cat,btn,dayApproved=false){
  if(!requireRole(['owner']))return toast('การลบหลายรายการสำหรับเจ้าของร้านเท่านั้น',true);
  const cfg=bulkCategoryConfig(cat);if(!cfg)return;
  const ids=bulkSelectedIds(cat);if(!ids.length)return toast('เลือกรายการที่จะลบก่อน',true);
  const list=Array.isArray(state[cfg.field])?state[cfg.field]:[],picked=list.filter(x=>ids.includes(String(x.id)));
  if(!picked.length)return toast('ไม่พบรายการที่เลือก',true);
  if(cat==='sales'&&!dayApproved&&lockedSalesPicked(picked).length)return requestManagerApproval(`ลบยอดขายที่อยู่ในวันที่ปิดวันแล้ว ${lockedSalesPicked(picked).length} บิล`,()=>bulkDeleteSelected(cat,btn,true));
  const extra=cat==='sales'?'\nกำไรจะคำนวณใหม่จากยอดขายที่เหลืออยู่':'';
  if(!confirm(`ยืนยันลบ ${cfg.label} ${picked.length} รายการ?${extra}\n\nระบบจะเก็บสำเนาล่าสุดของหมวดนี้ไว้สำหรับเรียกกลับ`))return;
  saveBulkTrash(cat,picked,cfg.label);
  state[cfg.field]=list.filter(x=>!ids.includes(String(x.id)));
  if(cat==='products'){cart=cart.filter(i=>!ids.includes(String(i.productId)));}
  if(cat==='members'&&ids.includes(String(currentMemberId)))currentMemberId='';
  if(cat==='promotions'&&ids.includes(String(selectedPromoId)))selectedPromoId='';
  if(cat!=='auditLogs')audit('data_delete',`${cfg.label} ${picked.length} รายการ`,'data','');
  saveState();customerDisplayStatus=null;updateCustomerDisplay();toast(`ลบ ${cfg.label} ${picked.length} รายการแล้ว`);reopenBulkCategory(cat)
}
function bulkRestoreLast(cat,btn){
  if(!requireRole(['owner']))return toast('การเรียกกลับหลายรายการสำหรับเจ้าของร้านเท่านั้น',true);
  const cfg=bulkCategoryConfig(cat),trash=getBulkTrash(cat);if(!cfg||!trash||!Array.isArray(trash.items)||!trash.items.length)return toast('ยังไม่มีรายการที่ลบไว้ให้เรียกกลับ',true);
  if(!confirm(`เรียกกลับ ${cfg.label} ${trash.items.length} รายการที่ลบล่าสุด?\n\nถ้ามีรหัสรายการเดิมอยู่แล้ว ระบบจะไม่สร้างรายการซ้ำ`))return;
  const list=Array.isArray(state[cfg.field])?state[cfg.field]:[],seen=new Set(list.map(x=>String(x.id))),restored=trash.items.filter(x=>!seen.has(String(x.id)));
  state[cfg.field]=[...restored,...list];
  if(cat!=='auditLogs')audit('data_restore',`${cfg.label} ${restored.length} รายการ`,'data','');
  clearBulkTrash(cat);saveState();toast(`เรียกกลับ ${cfg.label} ${restored.length} รายการแล้ว`);reopenBulkCategory(cat)
}

function getResetTrash(){
  try{return JSON.parse(localStorage.getItem(RESET_TRASH_KEY)||'null')}catch(e){return null}
}
function saveResetTrash(fields,label){
  const payload={savedAt:new Date().toISOString(),label,fields:{},nextOrder:state.nextOrder};
  fields.forEach(k=>payload.fields[k]=JSON.parse(JSON.stringify(state[k]??[])));
  localStorage.setItem(RESET_TRASH_KEY,JSON.stringify(payload));
  return payload;
}
function resetGroupFields(group){
  return group==='products'?['products','stockLogs','stockCounts','heldBills','costHistory']:
         group==='sales'?['sales','shiftClosures','receivables','expenses']:
         group==='support'?['promotions','members','suppliers','supplierLedger','purchaseOrders','auditLogs']:[];
}
function resetGroupLabel(group){
  return group==='products'?'สินค้า / สต็อก':group==='sales'?'ยอดขาย / กำไร':group==='support'?'ข้อมูลประกอบร้าน':'';
}
function resetGroupCount(group){
  if(group==='products')return state.products.length;
  if(group==='sales')return state.sales.length+state.receivables.length+state.expenses.length;
  if(group==='support')return state.promotions.length+state.members.length+state.suppliers.length+state.supplierLedger.length+state.purchaseOrders.length;
  return 0;
}
function updateResetSelectAll(){
  const boxes=[...document.querySelectorAll('[data-reset-group]')],all=document.getElementById('resetSelectAll');
  if(all)all.checked=boxes.length>0&&boxes.every(x=>x.checked);
}
function toggleResetSelectAll(el){document.querySelectorAll('[data-reset-group]').forEach(x=>x.checked=el.checked)}

  <button onclick="closeModal(this);openSettings()" class="w-full bg-slate-200 rounded p-3 mt-4">กลับเมนูตั้งค่า</button></div>`)

function deleteSelectedData(btn,dayApproved=false){
  if(!requirePermission('resetData','ไม่มีสิทธิ์รีเซ็ต / ลบข้อมูล'))return;
  const groups=[...document.querySelectorAll('[data-reset-group]:checked')].map(x=>x.dataset.resetGroup);
  if(!groups.length)return toast('เลือกหมวดที่ต้องการลบก่อน',true);
  const labels=groups.map(resetGroupLabel),fields=[...new Set(groups.flatMap(resetGroupFields))];
  if(groups.includes('sales')&&!dayApproved&&(state.sales||[]).some(s=>saleLockedByDay(s)))return requestManagerApproval('ลบยอดขายที่มีวันปิดและล็อกยอดแล้ว',()=>deleteSelectedData(btn,true));
  const detail=groups.map(g=>`${resetGroupLabel(g)} (${resetGroupCount(g)})`).join(' • ');
  if(!confirm(`ยืนยันลบ ${detail} ?\n\nข้อมูลจะซิงก์การลบไปอุปกรณ์อื่นด้วย`))return;
  saveResetTrash(fields,labels.join(' + '));
  const clearingAudit=fields.includes('auditLogs');
  fields.forEach(k=>state[k]=[]);
  if(groups.includes('sales'))state.nextOrder=1;
  if(groups.includes('products')){cart=[];selectedPromoId='';saleView='products'}
  if(groups.includes('support')){currentMemberId='';selectedPromoId=''}
  if(!clearingAudit)audit('data_delete',labels.join(' + '),'data','');
  saveState();customerDisplayStatus=null;updateCustomerDisplay();closeModal(btn);render();toast('ลบข้อมูลที่เลือกแล้ว • สามารถเรียกกลับล่าสุดได้')
}
function restoreLastDeletedData(btn){
  if(!requirePermission('resetData','ไม่มีสิทธิ์รีเซ็ต / ลบข้อมูล'))return;
  const trash=getResetTrash();if(!trash||!trash.fields)return toast('ไม่มีข้อมูลที่ลบไว้ให้เรียกกลับ',true);
  if(!confirm(`เรียกกลับ “${trash.label||'ข้อมูลล่าสุด'}” จาก ${new Date(trash.savedAt).toLocaleString('th-TH')} ?\n\nข้อมูลในหมวดเดียวกันที่เปลี่ยนหลังจากนั้นจะถูกแทนด้วยสำเนานี้`))return;
  Object.entries(trash.fields).forEach(([k,v])=>state[k]=JSON.parse(JSON.stringify(v)));
  if(Number.isFinite(Number(trash.nextOrder)))state.nextOrder=Math.max(1,Number(trash.nextOrder));

function compressPromptPayImage(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\/(png|jpeg|webp)$/i.test(file.type||''))return reject(new Error('type'));
    const reader=new FileReader();reader.onerror=()=>reject(new Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('image'));img.onload=()=>{
      let max=640,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      const make=(quality)=>{canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return canvas.toDataURL('image/jpeg',quality)};
      let quality=.9,data=make(quality);while(data.length>38000&&quality>.55){quality-=.08;data=make(quality)}
      while(data.length>38000&&w>360){w=Math.round(w*.85);h=Math.round(h*.85);quality=.75;data=make(quality)}
      if(data.length>48000)return reject(new Error('large'));resolve(data)
    };img.src=String(reader.result)};reader.readAsDataURL(file)
  })
}

function processBarcode(raw){
  const code=normalizeBarcodeInput(raw);if(!code)return false;
  const hit=findProductByBarcode(code);
  if(hit){addToCart(hit.product.id,hit.unit.unitId||hit.unit.id||'base');return true}
  if(hasPermission('addProduct')){
    toast('ยังไม่มีบาร์โค้ดนี้ • เปิดหน้าเพิ่มสินค้าให้แล้ว');
    addProduct(false,code);
  }else toast('ไม่พบบาร์โค้ดนี้ในรายการสินค้า',true);
  return false
}
function startScanner(){
  if(scannerActive)return stopScanner();

  let locked=false;
  const showResult=(code,found)=>{
    const box=document.getElementById('saleScanSuccess'),icon=document.getElementById('saleScanIcon'),title=document.getElementById('saleScanTitle'),codeEl=document.getElementById('saleScanCode'),hint=document.getElementById('saleScanHint');
    if(codeEl)codeEl.textContent=code;if(hint)hint.textContent='อ่านบาร์โค้ดแล้ว';
    if(!found&&icon){icon.textContent='+';icon.className='w-28 h-28 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-7xl font-black'}
    if(!found&&title){title.textContent='บาร์โค้ดสินค้าใหม่';title.className='text-2xl font-bold text-amber-700 mt-4'}
    if(box)box.classList.remove('hidden');
  };
  setTimeout(()=>{try{
    scanner=new Html5Qrcode('reader');
    scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},txt=>{
      if(locked)return;locked=true;const code=normalizeBarcodeInput(txt);if(!code){locked=false;return}
      const found=!!state.products.find(x=>normalizeBarcodeInput(x.barcode)===code||x.id===code);beep();showResult(code,found);
      setTimeout(()=>{const done=()=>{m.remove();const found=processBarcode(code);if(found&&cart.length)setTimeout(()=>openPaymentPopup(),80)};const pr=stopScanner();if(pr&&typeof pr.then==='function')pr.finally(done);else done()},650)
    },()=>{}).then(()=>scannerActive=true).catch(()=>{toast('เปิดกล้องไม่สำเร็จ',true);m.remove()})
  }catch(e){toast('เครื่องนี้ไม่รองรับกล้อง',true);m.remove()}},200)
}

function barcodeFormatFor(code){const x=String(code||'').trim();if(/^\d{13}$/.test(x))return'EAN13';if(/^\d{8}$/.test(x))return'EAN8';if(/^\d{12}$/.test(x))return'UPC';return'CODE128'}
function barcodeSvgForLabel(p,prefs=getLabelPrefs()){
  const code=String(p.barcode||p.id||'').trim();if(!code||!window.JsBarcode)return'';
  const info=labelPresetInfo(prefs),size=prefs.barcodeSize||'auto';
  let moduleWidth=size==='compact'?1.0:size==='standard'?1.35:size==='large'?1.7:(code.length<=8?1.65:code.length<=13?1.35:1.05);

function globalSearchNorm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function globalSearchHay(...parts){return globalSearchNorm(parts.flat(Infinity).filter(v=>v!==null&&v!==undefined).join(' '))}
function globalSearchScore(q,primary,hay){const p=globalSearchNorm(primary),h=globalSearchNorm(hay);if(!q)return 0;if(p===q)return 120;if(p.startsWith(q))return 100;if(p.includes(q))return 85;if(h.startsWith(q))return 70;if(h.includes(q))return 55;const tokens=q.split(' ').filter(Boolean);return tokens.length&&tokens.every(t=>h.includes(t))?45:0}
function globalSearchResults(query){
  const q=globalSearchNorm(query);if(!q)return[];const out=[],add=(type,icon,title,subtitle,primary,hay,id,extra='',badge='')=>{const score=globalSearchScore(q,primary,hay);if(score)out.push({type,icon,title,subtitle,id,extra,badge,score})};
  for(const p of state.products||[]){const sup=supplierNameById(p.supplierId)||'';add('product','📦',p.name,`${p.barcode||p.id} • ${p.category||'-'} • คงเหลือ ${n(p.stock)} ${p.unitName||'ชิ้น'}`,p.barcode||p.id,globalSearchHay(p.name,p.barcode,p.id,p.category,p.keywords,p.brand,sup),p.id,'','สินค้า')}

function updateCashDisplay(){

  return `<section class="bg-white rounded-2xl p-4 shadow"><div class="flex flex-wrap gap-2 justify-between items-center"><div><h2 class="text-xl font-bold">🏷️ ป้ายราคา / บาร์โค้ด</h2><p class="text-sm text-slate-500">${esc(info.name)} • บาร์โค้ด ${prefs.barcodeSize==='auto'?'ปรับอัตโนมัติ':prefs.barcodeSize} • ${prefs.copies} สำเนา/สินค้า</p></div><div class="flex gap-2"><button onclick="openLabelSettings()" class="px-4 py-2 bg-sky-100 text-sky-800 rounded-xl font-bold">⚙️ ตั้งขนาดป้าย</button><button onclick="printSelectedLabels()" class="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold">🖨️ พิมพ์ที่เลือก</button></div></div><div class="mt-3 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-sm text-emerald-900">📱 พิมพ์ได้จากมือถือ แท็บเล็ต และคอม ผ่านหน้าพิมพ์ของระบบ แล้วเลือกเครื่องพิมพ์ที่อุปกรณ์นั้นมองเห็น • ขนาดป้ายเก็บแยกแต่ละอุปกรณ์ ไม่ซิงก์ไปทับกัน</div><div class="grid md:grid-cols-[1fr_auto] gap-2 mt-4"><input id="labelSearch" value="${esc(labelSearchTerm)}" oninput="labelSearchTerm=this.value;rerenderFocus('labelSearch')" class="border-2 border-indigo-200 rounded-xl p-3" placeholder="🔎 ค้นชื่อสินค้า / บาร์โค้ด"><div class="flex items-center gap-3 border rounded-xl px-3"><label class="flex items-center gap-2 font-bold"><input id="labelSelectAll" type="checkbox" class="w-5 h-5" onchange="toggleAllLabels(this.checked)"> เลือกทั้งหมด</label><span id="labelSelectedCount" class="text-sm text-slate-500">เลือก 0 รายการ</span></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">${rows.map(p=>`<div class="border rounded-xl p-3 text-center relative"><label class="absolute top-2 left-2"><input data-label-id value="${p.id}" type="checkbox" class="w-5 h-5" onchange="updateLabelSelectedCount()"></label><div class="pt-3"><b class="block truncate" title="${esc(p.name)}">${esc(p.name)}</b><div class="text-2xl font-bold text-red-600">${money(effectiveProductPrice(p))}</div>${productPromoStatus(p).active?`<div class="text-xs text-slate-400 line-through">ปกติ ${money(p.price)}</div>`:''}<div class="text-xs text-slate-500 font-mono mt-1">${esc(p.barcode||p.id)}</div><div class="text-[11px] text-indigo-500">${barcodeFormatFor(p.barcode||p.id)}</div><button onclick="printLabel('${p.id}')" class="mt-2 w-full bg-slate-800 text-white rounded p-2">🖨️ พิมพ์ป้าย</button></div></div>`).join('')||'<div class="col-span-full text-center text-slate-400 p-10">ไม่พบสินค้า</div>'}</div></section>`
}

// Initial compatibility import: if legacy SDK exists, import product/sale records once when local database is empty.
async function initLegacySDK(){if(!window.dataSdk||state.products.length||state.sales.length)return;try{await window.dataSdk.init({onDataChanged(data){if(state.products.length||state.sales.length)return;const pros=data.filter(d=>d.type==='product').map(d=>({id:uid('p'),legacyId:d.product_id||'',name:d.product_name||'สินค้า',price:n(d.price),cost:n(d.cost_price),stock:n(d.stock),category:d.category||'ทั่วไป',barcode:d.barcode||'',lowStock:state.config.low_stock_default,image:''}));const oldSales=data.filter(d=>d.type==='sale').map(d=>({id:uid('sale'),order_number:d.order_number||uid('ORD'),timestamp:d.timestamp||new Date().toISOString(),items:[],itemSubtotal:n(d.total),billDiscount:n(d.discount),total:n(d.total),payment_method:d.payment_method||'cash',cash_received:0,change:0,cashier:'ข้อมูลเดิม',status:'completed',returns:[],legacy:true,legacy_items:d.items||''}));if(pros.length||oldSales.length){state.products=pros;state.sales=oldSales;state.nextOrder=Math.max(1,oldSales.length+1);saveState();render();toast('นำเข้าข้อมูลเดิมจาก SDK แล้ว')}}});}catch(e){console.warn('Legacy SDK import skipped',e)}}

function handleGlobalPOSShortcut(event){
  if(!currentUser||event.defaultPrevented)return;
  if(document.querySelector('.fixed.inset-0'))return;
  const key=String(event.key||'').toUpperCase();if(!/^F(?:[1-9]|1[0-2])$/.test(key))return;
  const sc={...DEFAULT_SHORTCUTS,...(state.settings.shortcuts||{})},action=Object.keys(sc).find(a=>sc[a]===key);if(!action)return;
  event.preventDefault();runPOSCommand(action)
}
window.addEventListener('keydown',handleGlobalPOSShortcut);

// -----------------------
// Universal Enter = Save / Confirm / Pay
// -----------------------
function isVisibleEnterButton(btn){
  if(!btn||btn.disabled)return false;
  const st=getComputedStyle(btn);if(st.display==='none'||st.visibility==='hidden'||st.opacity==='0')return false;
  return !!(btn.offsetWidth||btn.offsetHeight||btn.getClientRects().length)
}
function enterActionScore(btn){
  const t=String(btn?.textContent||'').replace(/\s+/g,' ').trim();
  if(!t)return -1;
  if(/ยกเลิก|ปิด|กลับ|ลบ|รีเซ็ต|คืนค่า|ยกเลิกบิล|เคลียร์/.test(t))return -1;
  if(/ได้รับเงินแล้ว|ยืนยันชำระ|รับชำระ|ชำระเงิน/.test(t))return 100;
  if(/บันทึก/.test(t))return 90;
  if(/ยืนยัน|ตกลง|เสร็จสิ้น/.test(t))return 80;
  if(/เพิ่มสินค้า|สมัครสมาชิก|เพิ่มผู้ขาย|สร้าง|ใช้แต้ม|ปิดกะ|รับสินค้า/.test(t))return 70;
  return -1
}
function findUniversalEnterAction(root){
  const explicit=[...root.querySelectorAll('[data-enter-primary="true"]')].filter(isVisibleEnterButton);
  if(explicit.length)return explicit[explicit.length-1];
  const ranked=[...root.querySelectorAll('button')].filter(isVisibleEnterButton).map((b,i)=>({b,i,s:enterActionScore(b)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s||b.i-a.i);
  return ranked[0]?.b||null
}
function handleUniversalEnter(event){
  if(!currentUser||event.key!=='Enter'||event.defaultPrevented||event.isComposing)return;
  if(event.altKey||event.metaKey)return;
  const target=event.target,tag=String(target?.tagName||'').toUpperCase();
  if(tag==='BUTTON'||target?.isContentEditable)return;
  // Elements with their own Enter workflow (barcode, login, member search, cash payment) keep that behavior.
  const own=String(target?.getAttribute?.('onkeydown')||'');if(/Enter/.test(own))return;
  const modalRoot=document.querySelector('.fixed.inset-0:last-of-type')||[...document.querySelectorAll('.fixed.inset-0')].pop();
  if(modalRoot){
    // Payment choice keeps explicit Cash / QR selection. Enter in its cash field is handled locally.
    if(modalRoot.querySelector('#paymentCashInput'))return;
    if(tag==='TEXTAREA'&&event.shiftKey)return; // Shift+Enter = new line in notes.
    const action=findUniversalEnterAction(modalRoot);if(!action)return;
    event.preventDefault();event.stopPropagation();action.click();return
  }
  // On the sales screen, Enter with a finished cart means proceed to payment.
  if(activeTab==='pos'&&cart.length&&tag!=='INPUT'&&tag!=='TEXTAREA'&&tag!=='SELECT'){
    event.preventDefault();openPaymentPopup()
  }
}
window.addEventListener('keydown',handleUniversalEnter);

render();initLegacySDK();ensureProductImageHashes();bootstrapCloudOnLoad();startBackgroundSyncLoop();setTimeout(()=>ensureDailyRestorePoint(),800);
