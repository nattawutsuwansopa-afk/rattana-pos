 class="pos-total-area"><div class="pos-totalbox"><div><div class="pos-total-label">Total :</div><div class="pos-discount-note">${c.billDiscount?`ส่วนลดบิล : ${c.billDiscount.toFixed(2)}`:'พร้อมรับรายการสินค้า'}</div></div><div class="pos-total-number">${c.total.toFixed(2)}</div></div><div class="pos-payment-panel"><div class="pos-payment-row"><div class="pos-payment-label">รับเงิน</div><input id="cashReceivedInput" type="text" inputmode="decimal" autocomplete="off" value="${formatCashText(cashReceived)}" oninput="handleCashInput(this)" class="pos-cash-input" placeholder="0.00"><select id="posPaymentMethod" class="pos-method-select" onchange="paymentMethod=this.value;updateCashDisplay()"><option value="cash" ${paymentMethod==='cash'?'selected':''}>เงินสด</option><option value="qr" ${paymentMethod==='qr'?'selected':''}>QR</option><option value="credit" ${paymentMethod==='credit'?'selected':''}>เครดิต</option></select></div><div class="pos-change-box"><div class="pos-payment-label">เงินทอน</div><div id="cashChangeNumber" class="pos-change-number ${paymentMethod==='cash'&&short>0?'short':''}">${paymentMethod==='cash'?(short>0?('-'+number2(short)):number2(change)):'0.00'}</div></div><div id="cashChangeHint" class="pos-change-hint">${paymentMethod==='cash'?(short>0?('รับเงินไม่พอ ขาดอีก '+number2(short)):('เงินรับ '+number2(cash)+' • เงินทอน '+number2(change))):('วิธีชำระ: '+methodName(paymentMethod))}</div></div></div></div><div class="pos-terminal"><div class="pos-terminal-display">${esc(classicLineText())}</div></div><input id="classicBarcode" class="pos-barcode-input barcode-input" autofocus autocomplete="off" placeholder="สแกนบาร์โค้ด / พิมพ์รหัสสินค้า แล้วกด Enter" onkeydown="if(event.key==='Enter')handleClassicEnter(this,event)"></div><aside class="pos-actions">
  <button class="pos-action green" onclick="openProductPicker()"><span class="ico">🔎</span>สินค้า<br>(F2)</button><button class="pos-action green" onclick="openMemberChooser()"><span class="ico">🧑‍🤝‍🧑</span>สมาชิก<br>(F3)</button><button class="pos-action green" onclick="posNewBill()"><span class="ico">🧾</span>เริ่มขาย<br>ใหม่</button>
  <button class="pos-action blue" onclick="activeTab='statistics';render()"><span class="ico">📊</span>สรุปการ<br>ขาย</button><button class="pos-action orange" onclick="clearCart()"><span class="ico">🧹</span>เคลียร์<br>บิลขาย</button><button class="pos-action orange" onclick="openHeldBills()"><span class="ico">📂</span>เรียกบิล<br>ที่พัก</button>
  <button class="pos-action blue" onclick="openCustomerDisplay()"><span class="ico">🖥️</span>เปิดจอ<br>ลูกค้า</button><button class="pos-action red" onclick="holdBill()"><span class="ico">⏸️</span>พักบิล<br>HoldBill</button>
  <button class="pos-action red" onclick="openHeldBills()"><span class="ico">🔁</span>เรียกบิล<br>Recall</button><button class="pos-action red" onclick="openPromoQuick()"><span class="ico">🏷️</span>ส่วนลด/<br>โปรโมชั่น</button><button class="pos-action blue" onclick="showPromptPay()"><span class="ico">▣</span>QR<br>พร้อมเพย์</button>
  <button class="pos-action purple" onclick="openProductPicker()"><span class="ico">🆕</span>เพิ่มสินค้า<br>ในบิล</button><button class="pos-action purple" onclick="cart.length&&editDiscount(cart[cart.length-1].productId)"><span class="ico">✏️</span>ส่วนลด<br>รายการ</button>
  <button class="pos-action blue" onclick="paymentMethod='cash';posCashPreset('exact')"><span class="ico">💰</span>เงินสด<br>พอดี</button><button class="pos-action blue" onclick="toast('ต้องเชื่อมเครื่องพิมพ์/ลิ้นชักเงินสดก่อนใช้งาน')"><span class="ico">🗄️</span>เปิด<br>ลิ้นชัก</button><button class="pos-action cyan" onclick="startScanner()"><span class="ico">📷</span>สแกน<br>กล้อง</button>
  <button class="pos-action moneybtn" onclick="checkout()" ${cart.length?'':'disabled'}><span class="ico">✅</span>รับชำระ<br>${c.total.toFixed(2)}</button><button class="pos-action red" onclick="activeTab='dashboard';render()"><span class="ico">⏻</span>ปิดหน้า<br>ขาย</button>
  <div class="pos-keyzone"><div class="pos-keypad">${[['7',''],['8',''],['9',''],['/','op'],['4',''],['5',''],['6',''],['*','op'],['1',''],['2',''],['3',''],['-','op'],['C','clear'],['0',''],['.','op'],['+','op'],['DEL','del'],['00',''],['OK','ok']].map(x=>`<button class="${x[1]}" onclick="posKey('${x[0]}')">${x[0]==='DEL'?'⌫':x[0]==='C'?'ล้าง':x[0]}</button>`).join('')}</div><div class="pos-sidekeys"><button onclick="posCashPreset('exact')">💵 รับเงินพอดี</button><button onclick="openSettings()">⚙️ ตั้งค่า</button></div></div>
</aside></div></section>`;
}

function renderProducts(){
  const lowCount=state.products.filter(p=>p.stock<=n(p.lowStock,state.config.low_stock_default)).length,expCount=state.products.filter(p=>['warn','expired'].includes(expiryInfo(p).level)).length,rows=filteredProducts();
  return `<section class="bg-white rounded-2xl p-4 shadow"><div class="flex flex-wrap gap-2 justify-between items-center"><div><h2 class="text-xl font-bold">📦 สินค้า / สต็อก / วันหมดอายุ</h2><p class="text-sm"><span class="text-red-600">ใกล้หมด ${lowCount}</span> • <span class="text-amber-600">ใกล้/หมดอายุ ${expCount}</span> • ทั้งหมด ${state.products.length}</p></div>${requireRole(['owner','manager'])?`<div class="flex flex-wrap gap-2"><button onclick="openStockCount()" class="px-4 py-2 bg-amber-100 rounded-lg">📋 เช็กสต็อกจริง</button><button onclick="openAddProductByBarcode()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg">▥ เพิ่มด้วยบาร์โค้ด</button><button onclick="addProduct(true)" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">📷 ถ่ายรูปเพิ่มสินค้า</button><button onclick="addProduct()" class="px-4 py-2 text-white rounded-lg" style="background:${state.config.primary_action_color}">+ เพิ่มสินค้า</button></div>`:''}</div><div class="grid md:grid-cols-[1fr_240px] gap-2 mt-4"><input id="productSmartSearch" class="border-2 border-indigo-200 rounded-xl p-3" placeholder="🔎 ค้นชื่อ / บาร์โค้ด / หมวด / คำค้น / ผู้ขาย" value="${esc(searchTerm)}" oninput="searchTerm=this.value;rerenderFocus('productSmartSearch')"><select class="border rounded-xl p-3" onchange="selectedCategory=this.value;render()">${categories().map(c=>`<option ${selectedCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="overflow-auto mt-4"><table class="w-full text-sm min-w-[1180px]"><thead><tr class="bg-slate-100"><th class="p-2 text-left">สินค้า</th><th>หมวด</th><th>ผู้ขาย</th><th>ขาย</th><th>ทุน</th><th>กำไร/ชิ้น</th><th>คงเหลือ</th><th>หมดอายุ</th><th>เตือนสต็อก</th><th></th></tr></thead><tbody>${rows.map(p=>{const ex=expiryInfo(p),exClass=ex.level==='expired'?'text-red-700 bg-red-50':ex.level==='warn'?'text-amber-700 bg-amber-50':'text-slate-600';return `<tr class="border-b ${p.stock<=n(p.lowStock,state.config.low_stock_default)?'bg-red-50/50':''}"><td class="p-2"><div class="flex items-center gap-3"><div class="w-14 h-14 rounded-lg bg-slate-100 overflow-hidden flex items-center justify-center shrink-0">${safeProductImage(p.image)?`<img src="${safeProductImage(p.image)}" class="w-full h-full object-cover">`:'<span class="text-2xl">📦</span>'}</div><div><b>${esc(p.name)}</b><div class="text-xs text-slate-500">${esc(p.barcode||p.id)}</div>${p.keywords?`<div class="text-[11px] text-indigo-500">${esc(p.keywords)}</div>`:''}</div></div></td><td class="text-center">${esc(p.category)}</td><td class="text-center">${esc(supplierNameById(p.supplierId)||'-')}</td><td class="text-right">${money(p.price)}</td><td class="text-right">${money(p.cost)}</td><td class="text-right font-semibold ${p.price-p.cost>=0?'text-emerald-600':'text-red-600'}">${money(p.price-p.cost)}</td><td class="text-center font-bold">${p.stock}</td><td class="text-center"><span class="px-2 py-1 rounded ${exClass}">${esc(ex.text)}</span>${p.expiryDate?`<div class="text-[11px] text-slate-400">${esc(p.expiryDate)}</div>`:''}</td><td class="text-center">≤ ${p.lowStock}</td><td class="p-2 text-right whitespace-nowrap">${requireRole(['owner','manager'])?`<button onclick="adjustStock('${p.id}')" class="px-2 py-1 bg-amber-100 rounded">±สต็อก</button> <button onclick="editProduct('${p.id}')" class="px-2 py-1 bg-slate-200 rounded">แก้ไข</button>`:''}${requireRole(['owner'])?` <button onclick="deleteProduct('${p.id}')" class="px-2 py-1 bg-red-100 text-red-700 rounded">ลบ</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="10" class="text-center text-slate-400 p-10">ไม่พบสินค้าที่ค้นหา</td></tr>'}</tbody></table></div><details class="mt-5"><summary class="cursor-pointer font-bold">📜 ประวัติการเคลื่อนไหวสต็อก (${state.stockLogs.length})</summary><div class="overflow-auto max-h-[420px] mt-2"><table class="w-full text-xs min-w-[760px]"><thead><tr class="bg-slate-100"><th>เวลา</th><th>สินค้า</th><th>ประเภท</th><th>เปลี่ยน</th><th>ก่อน</th><th>หลัง</th><th>เหตุผล/อ้างอิง</th><th>ผู้ใช้</th></tr></thead><tbody>${state.stockLogs.slice(0,500).map(l=>`<tr class="border-b"><td class="p-2">${new Date(l.time).toLocaleString('th-TH')}</td><td>${esc(l.productName)}</td><td>${stockTypeName(l.type)}</td><td class="text-center ${l.qty>0?'text-emerald-600':'text-red-600'}">${l.qty>0?'+':''}${l.qty}</td><td class="text-center">${l.before}</td><td class="text-center">${l.after}</td><td>${esc(l.reason)} ${esc(l.reference)}</td><td>${esc(l.user)}</td></tr>`).join('')}</tbody></table></div></details></section>`
}
function renderSales(){const ss=filteredSales();return `<section class="bg-white rounded-2xl p-4 shadow"><h2 class="text-xl font-bold">🧾 บิลย้อนหลัง</h2><div class="grid md:grid-cols-4 gap-2 my-4"><input id="saleSearchInput" class="border rounded p-2 md:col-span-2" placeholder="ค้นหาเลขบิล / สินค้า" value="${esc(saleSearch)}" oninput="saleSearch=this.value;rerenderFocus('saleSearchInput')"><input type="date" class="border rounded p-2" value="${saleDateFrom}" onchange="saleDateFrom=this.value;render()"><input type="date" class="border rounded p-2" value="${saleDateTo}" onchange="saleDateTo=this.value;render()"></div><div class="overflow-auto"><table class="w-full text-sm min-w-[760px]"><thead><tr class="bg-slate-100"><th class="p-2 text-left">เลขบิล</th><th>วันที่</th><th>พนักงาน</th><th>ชำระ</th><th>ยอด</th><th>คืนแล้ว</th><th>สถานะ</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr class="border-b"><td class="p-2 font-bold">${esc(s.order_number)}</td><td class="text-center">${new Date(s.timestamp).toLocaleString('th-TH')}</td><td class="text-center">${esc(s.cashier)}</td><td class="text-center">${methodName(s.payment_method)}</td><td class="text-right">${money(s.total)}</td><td class="text-right text-red-600">${money(saleReturnedAmount(s))}</td><td class="text-center">${s.status==='completed'?'✅ สำเร็จ':s.status==='returned'?'↩️ คืนครบ':esc(s.status)}</td><td class="text-right p-2"><button onclick="saleDetail('${s.id}')" class="px-3 py-1 bg-indigo-100 rounded">ดู</button></td></tr>`).join('')}</tbody></table></div></section>`}
function renderStats(){
  const s=stats(),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),month=new Date(now.getFullYear(),now.getMonth(),1),tp=periodProfit(today,now),mp=periodProfit(month,now),products=profitRows().slice(0,100);
  return `<div class="space-y-4"><div class="bg-amber-50 text-amber-900 rounded-xl p-3 text-sm">📊 กำไรจากการขาย = ยอดขายสุทธิหลังส่วนลดและคืนสินค้า − ต้นทุนสินค้าที่ขาย <b>ยังไม่หักค่าเช่า ค่าไฟ ค่าแรง หรือค่าใช้จ่ายอื่นของร้าน</b></div><div class="grid grid-cols-2 md:grid-cols-6 gap-3">${[['วันนี้',s.todayRevenue,''],['กำไรวันนี้',tp.profit,'profit'],['เดือนนี้',s.monthRevenue,''],['กำไรเดือนนี้',mp.profit,'profit'],['ต้นทุนรวม',s.cost,'cost'],['กำไรสะสม',s.profit,'profit']].map(x=>`<div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-slate-500">${x[0]}</div><div class="text-xl font-bold ${x[2]==='profit'?'text-emerald-600':x[2]==='cost'?'text-amber-600':''}">${money(x[1])}</div></div>`).join('')}</div>${state.sales.some(x=>x.legacy)?'<div class="bg-amber-50 text-amber-800 rounded-xl p-3 text-sm">บิลเก่าที่ไม่มีต้นทุนรายสินค้าอาจทำให้กำไรย้อนหลังคลาดเคลื่อน</div>':''}<div class="grid lg:grid-cols-2 gap-4"><div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-bold mb-2">ยอดขาย 7 วันล่าสุด</h3><div class="chart-container"><canvas id="revenueChart"></canvas></div></div><div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-bold mb-2">สินค้าใกล้หมด</h3>${s.low.length?s.low.slice(0,15).map(p=>`<div class="flex justify-between border-b py-2"><span>${esc(p.name)}</span><b class="text-red-600">${p.stock}</b></div>`).join(''):'<p class="text-center text-slate-400 py-12">ไม่มีสินค้าใกล้หมด</p>'}</div></div><section class="bg-white rounded-2xl p-4 shadow"><h3 class="font-bold text-lg">กำไรแยกตามสินค้า</h3><div class="overflow-auto mt-3"><table class="w-full text-sm min-w-[720px]"><thead><tr class="bg-slate-100"><th class="text-left p-2">สินค้า</th><th>จำนวนขายสุทธิ</th><th>ยอดขายสุทธิ</th><th>ต้นทุน</th><th>กำไร</th><th>Margin</th></tr></thead><tbody>${products.map(r=>`<tr class="border-b"><td class="p-2"><b>${esc(r.name)}</b></td><td class="text-center">${r.qty}</td><td class="text-right">${money(r.revenue)}</td><td class="text-right">${money(r.cost)}</td><td class="text-right font-bold ${r.profit>=0?'text-emerald-600':'text-red-600'}">${money(r.profit)}</td><td class="text-right">${r.revenue?((r.profit/r.revenue)*100).toFixed(1):'0.0'}%</td></tr>`).join('')||'<tr><td colspan="6" class="text-center p-8 text-slate-400">ยังไม่มีข้อมูลขาย</td></tr>'}</tbody></table></div></section></div>`
}
function drawStats(){const s=stats(),ctx=document.getElementById('revenueChart');if(!ctx)return;if(chartInstances.revenue)chartInstances.revenue.destroy();chartInstances.revenue=new Chart(ctx,{type:'line',data:{labels:s.last7.map(x=>x.label),datasets:[{label:'ยอดขายสุทธิ',data:s.last7.map(x=>x.value),borderColor:state.config.primary_action_color,backgroundColor:state.config.primary_action_color+'22',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}})}
function renderLabels(){return `<section class="bg-white rounded-2xl p-4 shadow"><h2 class="text-xl font-bold mb-4">🏷️ ป้ายราคา</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-3">${state.products.map(p=>`<div class="border rounded-xl p-3 text-center"><b>${esc(p.name)}</b><div class="text-2xl font-bold text-red-600">${money(p.price)}</div><div class="text-xs text-slate-500">${esc(p.barcode||p.id)}</div><button onclick="printLabel('${p.id}')" class="mt-2 w-full bg-slate-800 text-white rounded p-2">🖨️ พิมพ์ป้าย</button></div>`).join('')}</div></section>`}

// Initial compatibility import: if legacy SDK exists, import product/sale records once when local database is empty.
async function initLegacySDK(){if(!window.dataSdk||state.products.length||state.sales.length)return;try{await window.dataSdk.init({onDataChanged(data){if(state.products.length||state.sales.length)return;const pros=data.filter(d=>d.type==='product').map(d=>({id:uid('p'),legacyId:d.product_id||'',name:d.product_name||'สินค้า',price:n(d.price),cost:n(d.cost_price),stock:n(d.stock),category:d.category||'ทั่วไป',barcode:d.barcode||'',lowStock:state.config.low_stock_default,image:''}));const oldSales=data.filter(d=>d.type==='sale').map(d=>({id:uid('sale'),order_number:d.order_number||uid('ORD'),timestamp:d.timestamp||new Date().toISOString(),items:[],itemSubtotal:n(d.total),billDiscount:n(d.discount),total:n(d.total),payment_method:d.payment_method||'cash',cash_received:0,change:0,cashier:'ข้อมูลเดิม',status:'completed',returns:[],legacy:true,legacy_items:d.items||''}));if(pros.length||oldSales.length){state.products=pros;state.sales=oldSales;state.nextOrder=Math.max(1,oldSales.length+1);saveState();render();toast('นำเข้าข้อมูลเดิมจาก SDK แล้ว')}}});}catch(e){console.warn('Legacy SDK import skipped',e)}}

applyDeviceProfile();
let deviceResizeTimer=null;
function handleDeviceViewportChange(){clearTimeout(deviceResizeTimer);deviceResizeTimer=setTimeout(()=>{const before=lastAppliedDeviceSignature;applyDeviceProfile();if(currentUser&&!cloudRenderIsBusy()&&before!==lastAppliedDeviceSignature)render()},220)}
window.addEventListener('resize',handleDeviceViewportChange,{passive:true});
window.addEventListener('orientationchange',handleDeviceViewportChange,{passive:true});
render();initLegacySDK();ensureProductImageHashes();bootstrapCloudOnLoad();startBackgroundSyncLoop();
</script>
