<script>
'use strict';

// -----------------------
// Configuration & state
// -----------------------
const STORAGE_KEY = 'rattana_pos_complete_v3';
const SYNC_CFG_KEY = STORAGE_KEY + '_cloud_sync';
const DEVICE_ID_KEY = STORAGE_KEY + '_device_id';
const DEVICE_PREFS_KEY = STORAGE_KEY + '_device_prefs';
const AUTO_SYNC_INTERVAL_MS = 15000;
let deferredInstallPrompt = null, syncTimer = null, autoSyncInterval = null, syncBusy = false, aiProductAnalysisBusy = false, lastSyncMessage = '', deferredCloudRender = false;

const defaultConfig = {
  store_name:'ร้านรัตนาพานิชย์', branch_name:'(ตั้งข้าม รพ.วาริชภูมิ)', phone_number:'088-888-8888',
  promptpay_number:'0888888888', promptpay_image:'', logo_image:'', background_color:'#667eea', surface_color:'#ffffff', text_color:'#1f2937',
  primary_action_color:'#10b981', secondary_action_color:'#6366f1', low_stock_default:5
};
let state = loadState();
let selectedPromoId='', currentMemberId='', memberSearchDraft='', currentUser=loadSessionUser(), scanner=null, scannerActive=false, chartInstances={};
let activeTab=currentUser?'dashboard':'pos', searchTerm='', selectedCategory='ทั้งหมด', cart=[], paymentMethod='cash', cashReceived='';
let saleSearch='', saleDateFrom='', saleDateTo='', stockFilter='all', menuOpen=false;
let saleView='products', customerDisplayWindow=null, customerDisplayTimer=null, customerDisplayStatus=null;
let settingsPromptPayImageDraft='', settingsLogoImageDraft='', productImageDraft='', productImageHashDraft='', productEditingId='', productRecognitionCandidateId='', productBarcodeDraft='';
let manualBillDiscount={type:'baht',value:0,label:''};

function safeColor(v,fallback){return /^#[0-9a-fA-F]{6}$/.test(String(v||''))?String(v):fallback}
function normalizeConfig(c){return {...defaultConfig,...c,background_color:safeColor(c.background_color,defaultConfig.background_color),surface_color:safeColor(c.surface_color,defaultConfig.surface_color),text_color:safeColor(c.text_color,defaultConfig.text_color),primary_action_color:safeColor(c.primary_action_color,defaultConfig.primary_action_color),secondary_action_color:safeColor(c.secondary_action_color,defaultConfig.secondary_action_color)}}
function initialState(){
  return {
    version:10, updatedAt:'1970-01-01T00:00:00.000Z', config:{...defaultConfig}, products:[], sales:[], stockLogs:[], heldBills:[], promotions:[], members:[], suppliers:[], supplierLedger:[], shiftClosures:[], stockCounts:[], auditLogs:[],
    users:[{id:'u_owner',name:'เจ้าของร้าน',role:'owner',pin:'1234',active:true}], nextOrder:1,
    settings:{requireLogin:true,discountPresets:[10,20,50,100],newSaleReset:{confirm:true,member:true,discount:true,cash:true},imageRecognitionEnabled:true,imageRecognitionThreshold:0.84,aiProductRecognitionEnabled:true,expiryWarnDays:30}
  };
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return initialState();
    const s=JSON.parse(raw),base=initialState(),incoming=s.settings||{}; return {...base,...s,version:10,config:normalizeConfig(s.config||{}),products:(s.products||[]).map(p=>({...p,keywords:p.keywords||'',supplierId:p.supplierId||'',expiryDate:p.expiryDate||'',expiryWarnDays:n(p.expiryWarnDays,incoming.expiryWarnDays||30)})),suppliers:Array.isArray(s.suppliers)?s.suppliers:[],supplierLedger:Array.isArray(s.supplierLedger)?s.supplierLedger:[],shiftClosures:Array.isArray(s.shiftClosures)?s.shiftClosures:[],stockCounts:Array.isArray(s.stockCounts)?s.stockCounts:[],auditLogs:Array.isArray(s.auditLogs)?s.auditLogs:[],settings:{...base.settings,...incoming,newSaleReset:{...base.settings.newSaleReset,...(incoming.newSaleReset||{})}}};
  }catch(e){console.warn(e);return initialState()}
}
function getSyncCfg(){
  try{return {...{url:'',token:'',auto:true,intervalSec:15},...JSON.parse(localStorage.getItem(SYNC_CFG_KEY)||'{}')}}catch(e){return {url:'',token:'',auto:true,intervalSec:15}}
}
function setSyncCfg(cfg){localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(cfg))}
function getDeviceId(){let id=localStorage.getItem(DEVICE_ID_KEY);if(!id){id='dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);localStorage.setItem(DEVICE_ID_KEY,id)}return id}
function getDevicePrefs(){
  try{return {...{mode:'auto',scale:'auto',touch:'auto'},...JSON.parse(localStorage.getItem(DEVICE_PREFS_KEY)||'{}')}}catch(e){return {mode:'auto',scale:'auto',touch:'auto'}}
}
function setDevicePrefs(p){localStorage.setItem(DEVICE_PREFS_KEY,JSON.stringify(p))}
function detectPhysicalDevice(){
  const w=Math.max(1,window.innerWidth||screen.width||1024),h=Math.max(1,window.innerHeight||screen.height||768);
  const coarse=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches),touchPoints=navigator.maxTouchPoints||0;
  let mode='desktop';
  if(w<=640)mode='mobile';
  else if(w<=1100||(coarse&&w<=1366))mode='tablet';
  return {mode,width:w,height:h,orientation:w>=h?'landscape':'portrait',coarse:coarse||touchPoints>0,touchPoints};
}
function deviceModeName(m){return m==='mobile'?'มือถือ':m==='tablet'?'แท็บเล็ต':'คอม/โน้ตบุ๊ก'}
function deviceOrientationName(o){return o==='landscape'?'แนวนอน':'แนวตั้ง'}
function resolveDeviceProfile(){
  const actual=detectPhysicalDevice(),prefs=getDevicePrefs(),mode=['mobile','tablet','desktop'].includes(prefs.mode)?prefs.mode:actual.mode;
  const autoScale=mode==='mobile'?0.94:mode==='tablet'?0.98:1;
  const scale=prefs.scale==='auto'?autoScale:Math.min(1.25,Math.max(.8,Number(prefs.scale)||1));
  const touch=prefs.touch==='auto'?actual.coarse:prefs.touch==='on';
  return {...actual,mode,scale,touch,prefs};
}
let lastAppliedDeviceSignature='';
function applyDeviceProfile(){
  const d=resolveDeviceProfile();
  document.body.dataset.device=d.mode;document.body.dataset.touch=d.touch?'true':'false';document.body.dataset.orientation=d.orientation;
  document.documentElement.style.setProperty('--device-ui-scale',String(d.scale));
  document.documentElement.style.setProperty('--device-tap-size',d.touch?(d.mode==='mobile'?'44px':'42px'):'36px');
  lastAppliedDeviceSignature=[d.mode,d.orientation,d.scale,d.touch].join('|');
  return d;
}
function deviceSummary(){const d=resolveDeviceProfile();return `${deviceModeName(d.mode)} • ${deviceOrientationName(d.orientation)} • ${Math.round(d.scale*100)}%${d.touch?' • จอสัมผัส':''}`}
function openDeviceSettings(){
  const d=resolveDeviceProfile(),p=d.prefs,actual=detectPhysicalDevice();
  modal(`<div class="bg-white rounded-2xl p-6 max-w-xl mx-auto"><div class="flex justify-between items-center"><div><h3 class="text-2xl font-bold">📱 การแสดงผลอุปกรณ์นี้</h3><p class="text-sm text-slate-500">ตั้งค่านี้เก็บเฉพาะเครื่องนี้ และไม่ซิงก์ไปทับมือถือ/แท็บเล็ต/คอมเครื่องอื่น</p></div><button onclick="closeModal(this);openSettings()" class="text-3xl">×</button></div><div class="mt-4 rounded-xl bg-sky-50 border border-sky-200 p-4 text-sm"><b>ตรวจพบ:</b> ${deviceModeName(actual.mode)} • ${actual.width}×${actual.height} • ${deviceOrientationName(actual.orientation)}${actual.coarse?' • จอสัมผัส':''}<br><b>กำลังใช้:</b> ${deviceSummary()}</div><div class="space-y-4 mt-4"><label class="block font-semibold">รูปแบบหน้าจอ<select id="devMode" class="w-full border rounded-xl p-3 mt-1"><option value="auto" ${p.mode==='auto'?'selected':''}>อัตโนมัติตามอุปกรณ์</option><option value="mobile" ${p.mode==='mobile'?'selected':''}>มือถือ</option><option value="tablet" ${p.mode==='tablet'?'selected':''}>แท็บเล็ต</option><option value="desktop" ${p.mode==='desktop'?'selected':''}>คอม / โน้ตบุ๊ก</option></select></label><label class="block font-semibold">ขนาดตัวอักษรและเมนู<select id="devScale" class="w-full border rounded-xl p-3 mt-1"><option value="auto" ${p.scale==='auto'?'selected':''}>อัตโนมัติ</option><option value="0.9" ${String(p.scale)==='0.9'?'selected':''}>เล็ก 90%</option><option value="1" ${String(p.scale)==='1'?'selected':''}>ปกติ 100%</option><option value="1.1" ${String(p.scale)==='1.1'?'selected':''}>ใหญ่ 110%</option><option value="1.2" ${String(p.scale)==='1.2'?'selected':''}>ใหญ่มาก 120%</option></select></label><label class="block font-semibold">ปุ่มสำหรับจอสัมผัส<select id="devTouch" class="w-full border rounded-xl p-3 mt-1"><option value="auto" ${p.touch==='auto'?'selected':''}>อัตโนมัติ</option><option value="on" ${p.touch==='on'?'selected':''}>เปิดปุ่มใหญ่</option><option value="off" ${p.touch==='off'?'selected':''}>ปิด</option></select></label></div><div class="rounded-xl bg-amber-50 text-amber-900 p-3 text-xs mt-4">เมื่อหมุนจอ หรือเปลี่ยนขนาดหน้าต่าง ระบบจะปรับใหม่อัตโนมัติ โดยไม่รีโหลดบิลที่กำลังขาย</div><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="resetDeviceSettings(this)" class="bg-slate-200 rounded-xl p-3">คืนค่าอัตโนมัติ</button><button onclick="saveDeviceSettings(this)" class="text-white rounded-xl p-3" style="background:${state.config.primary_action_color}">บันทึกเครื่องนี้</button></div></div>`)
}
function saveDeviceSettings(btn){
  setDevicePrefs({mode:document.getElementById('devMode')?.value||'auto',scale:document.getElementById('devScale')?.value||'auto',touch:document.getElementById('devTouch')?.value||'auto'});
  applyDeviceProfile();closeModal(btn);render();toast(`ปรับหน้าจอสำหรับ ${deviceModeName(resolveDeviceProfile().mode)} แล้ว`)
}
function resetDeviceSettings(btn){setDevicePrefs({mode:'auto',scale:'auto',touch:'auto'});applyDeviceProfile();closeModal(btn);render();toast('กลับเป็นการปรับหน้าจออัตโนมัติแล้ว')}
function persistState(touch=true){
  if(touch) state.updatedAt=new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if(touch) scheduleCloudSync();
}
function saveState(){ persistState(true); }
function hasBusinessData(s=state){
  return !!((s.products||[]).length||(s.sales||[]).length||(s.stockLogs||[]).length||(s.heldBills||[]).length||(s.promotions||[]).length||(s.members||[]).length||(s.suppliers||[]).length||(s.supplierLedger||[]).length||(s.shiftClosures||[]).length||(s.stockCounts||[]).length||(s.auditLogs||[]).length||n(s.nextOrder,1)>1);
}
function scheduleCloudSync(){
  const cfg=getSyncCfg();
  if(!cfg.auto||!cfg.url||!cfg.token||!navigator.onLine)return;
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true,!hasBusinessData()),1800);
}
function cloudRenderIsBusy(){
  // Never rebuild the selling screen while the cashier is in the middle of a bill,
  // typing money/barcode, or using a modal. Data can update in memory silently.

function flushDeferredCloudRender(){

function startBackgroundSyncLoop(){

async function syncNow(silent=false,forcePull=false){
  const cfg=getSyncCfg();
  if(syncBusy)return;
  if(!cfg.url||!cfg.token){if(!silent){toast('ตั้งค่า Cloud Sync ในเมนู Backup / Cloud ก่อน',true);openDataTools()}return}
  if(!navigator.onLine){if(!silent)toast('ออฟไลน์อยู่ ข้อมูลที่เคยดึงไว้ยังใช้ได้ และจะซิงก์เมื่อมีอินเทอร์เน็ต',true);return}
  syncBusy=true;lastSyncMessage=forcePull?'กำลังดึงข้อมูลจากคลาวด์…':'กำลังซิงก์…';
  try{
    const payload=forcePull?{action:'pull',token:cfg.token,deviceId:getDeviceId()}:{action:'sync',token:cfg.token,deviceId:getDeviceId(),state};
    const res=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||'sync failed');
    if(data.mode==='pulled'&&data.state){
      const deferRender=cloudRenderIsBusy();
      applyCloudState(data.state);
      lastSyncMessage='รับข้อมูลจากคลาวด์แล้ว';
      if(deferRender)deferredCloudRender=true;else render();
    }else if(data.mode==='pushed') lastSyncMessage='ส่งข้อมูลขึ้นคลาวด์แล้ว';
    else if(data.mode==='empty') lastSyncMessage='คลาวด์ยังไม่มีข้อมูล';
    else lastSyncMessage='ข้อมูลตรงกันแล้ว';
    localStorage.setItem(SYNC_CFG_KEY+'_last',new Date().toISOString());
    if(!silent)toast('☁️ '+lastSyncMessage);
  }catch(e){
    console.warn('Cloud sync failed',e);lastSyncMessage='ซิงก์ไม่สำเร็จ';
    if(!silent)toast('ซิงก์ไม่สำเร็จ ตรวจ URL / รหัส Sync / Backend และอินเทอร์เน็ต',true);
  }finally{syncBusy=false;flushDeferredCloudRender()}
}

function categories(){return ['ทั้งหมด',...new Set(state.products.map(p=>p.category||'ทั่วไป'))]}
function normalizeSearchText(v){return String(v||'').toLowerCase().normalize('NFKC').replace(/[\s\-_/.,()]+/g,' ').trim()}
function compactSearchText(v){return normalizeSearchText(v).replace(/\s+/g,'')}
function supplierNameById(id){return state.suppliers.find(s=>s.id===id)?.name||''}
function smartProductScore(p,q){
  q=normalizeSearchText(q);if(!q)return 1;
  const barcode=normalizeSearchText(p.barcode),id=normalizeSearchText(p.id),name=normalizeSearchText(p.name),category=normalizeSearchText(p.category),keywords=normalizeSearchText(p.keywords),supplier=normalizeSearchText(supplierNameById(p.supplierId));
  const compact=compactSearchText(q),tokens=q.split(' ').filter(Boolean),hay=[name,category,keywords,supplier,barcode,id].join(' '),hayCompact=compactSearchText(hay);
  if(q===barcode||q===id)return 1000;
  if(q===name)return 900;
  if(name.startsWith(q))return 800;
  if(name.includes(q))return 720;
  if(barcode.includes(q)||id.includes(q))return 700;
  if(tokens.length&&tokens.every(t=>hay.includes(t)))return 620+tokens.length;
  if(compact&&hayCompact.includes(compact))return 560;
  const hits=tokens.filter(t=>hay.includes(t)).length;if(hits)return 300+hits*20;
  return 0;
}
function smartProductResults(q,onlyInStock=false){return state.products.map(p=>({p,score:smartProductScore(p,q)})).filter(x=>x.score>0&&(!onlyInStock||x.p.stock>0)).sort((a,b)=>b.score-a.score||String(a.p.name).localeCompare(String(b.p.name),'th')).map(x=>x.p)}
function filteredProducts(){return smartProductResults(searchTerm,false).filter(p=>selectedCategory==='ทั้งหมด'||p.category===selectedCategory)}
function addToCart(id){const p=state.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('สินค้าหมดสต็อก',true);const item=cart.find(x=>x.productId===id);if(item){if(item.qty>=p.stock)return toast('สต็อกไม่เพียงพอ',true);item.qty++}else cart.push({productId:id,name:p.name,price:n(p.price),cost:n(p.cost),qty:1,maxStock:n(p.stock),discount:0,discountType:'baht'});beep();render()}
function changeQty(id,d){const i=cart.find(x=>x.productId===id);if(!i)return;const q=i.qty+d;if(q<=0)cart=cart.filter(x=>x.productId!==id);else if(q>i.maxStock)return toast('สต็อกไม่เพียงพอ',true);else i.qty=q;render()}
function itemNet(i){const gross=i.price*i.qty;const dis=i.discountType==='percent'?gross*(n(i.discount)/100):n(i.discount);return Math.max(0,gross-dis)}
function isPromoUsable(p){const today=new Date().toISOString().slice(0,10);return !!p.active&&(!p.startDate||today>=p.startDate)&&(!p.endDate||today<=p.endDate)}
function selectedPromo(){const p=state.promotions.find(p=>p.id===selectedPromoId&&isPromoUsable(p));return p&&(p.type==='member_percent'||p.type==='member_fixed')&&!currentMember()?null:p}
function calcCart(){
  const itemSubtotal=cart.reduce((sum,i)=>sum+itemNet(i),0);
  let billDiscount=0,promoText='',discountInfo=null;
  const p=selectedPromo();
  if(p){
    if(p.type==='bill_percent'){billDiscount=itemSubtotal*n(p.value)/100;promoText=`${p.name} -${p.value}%`}
    else if(p.type==='bill_fixed'){billDiscount=Math.min(itemSubtotal,n(p.value));promoText=`${p.name} -${money(p.value)}`}
    else if(p.type==='bogo'){billDiscount=cart.reduce((sum,i)=>{const free=Math.floor(i.qty/(n(p.buy,2)+n(p.free,1)))*n(p.free,1);return sum+free*i.price},0);promoText=`${p.name} ซื้อ ${p.buy} แถม ${p.free}`}
    else if(p.type==='member_percent'){billDiscount=itemSubtotal*n(p.value)/100;promoText=`${p.name} สมาชิก -${p.value}%`}else if(p.type==='member_fixed'){billDiscount=Math.min(itemSubtotal,n(p.value));promoText=`${p.name} สมาชิก -${money(p.value)}`}
    discountInfo={source:'promotion',id:p.id,name:p.name,type:p.type,value:n(p.value),buy:n(p.buy),free:n(p.free)};
  }else if(n(manualBillDiscount.value)>0){
    if(manualBillDiscount.type==='baht'){
      billDiscount=Math.min(itemSubtotal,n(manualBillDiscount.value));
      promoText=manualBillDiscount.label||`ส่วนลดทั้งบิล -${money(manualBillDiscount.value)}`;
    }else{
      const pct=Math.min(100,Math.max(0,n(manualBillDiscount.value)));
      billDiscount=itemSubtotal*pct/100;
      promoText=manualBillDiscount.label||`ส่วนลดทั้งบิล -${pct}%`;
    }
    discountInfo={source:'manual',type:manualBillDiscount.type,value:n(manualBillDiscount.value),label:promoText};
  }
  billDiscount=Math.min(itemSubtotal,billDiscount);
  return{itemSubtotal,billDiscount,total:Math.max(0,itemSubtotal-billDiscount),promoText,discountInfo}
}
function resetBillDiscount(){selectedPromoId='';manualBillDiscount={type:'baht',value:0,label:''}}
function applyBillDiscountPreset(v){resetBillDiscount();manualBillDiscount={type:'baht',value:Math.max(0,n(v)),label:`ส่วนลดด่วน ${money(v)}`};audit('discount',`ส่วนลดด่วนทั้งบิล ${money(v)}`,'cart','current');document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());render()}
function applyPromotion(id){const p=state.promotions.find(x=>x.id===id);if((p?.type==='member_percent'||p?.type==='member_fixed')&&!currentMember())return toast('โปรโมชั่นนี้สำหรับสมาชิก กรุณากดปุ่มสมาชิกและเลือก/สมัครสมาชิกก่อน',true);manualBillDiscount={type:'baht',value:0,label:''};selectedPromoId=id;document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());render()}
function clearBillDiscount(){resetBillDiscount();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());render()}

function compressProductImage(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//i.test(file.type||''))return reject(new Error('type'));
    const reader=new FileReader();reader.onerror=()=>reject(new Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('image'));img.onload=()=>{
      let max=480,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      const make=(quality)=>{canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return canvas.toDataURL('image/jpeg',quality)};
      let quality=.82,data=make(quality);
      while(data.length>28000&&quality>.48){quality-=.08;data=make(quality)}
      while(data.length>28000&&w>240){w=Math.round(w*.82);h=Math.round(h*.82);quality=.68;data=make(quality)}
      if(data.length>32000)return reject(new Error('large'));
      resolve(data)
    };img.src=String(reader.result)};reader.readAsDataURL(file)
  })
}
function compressProductImageForAI(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//i.test(file.type||''))return reject(new Error('type'));
    const reader=new FileReader();reader.onerror=()=>reject(new Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('image'));img.onload=()=>{
      let max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      const make=(quality)=>{canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return canvas.toDataURL('image/jpeg',quality)};
      let quality=.88,data=make(quality);
      while(data.length>600000&&quality>.55){quality-=.07;data=make(quality)}
      while(data.length>600000&&w>600){w=Math.round(w*.85);h=Math.round(h*.85);quality=.72;data=make(quality)}
      if(data.length>750000)return reject(new Error('large'));
      resolve(data)
    };img.src=String(reader.result)};reader.readAsDataURL(file)
  })

function imageHashFromDataUrl(data){return new Promise((resolve,reject)=>{if(!safeProductImage(data))return resolve('');const img=new Image();img.onerror=()=>reject(new Error('hash'));img.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=8;c.height=8;ctx.drawImage(img,0,0,8,8);const px=ctx.getImageData(0,0,8,8).data,g=[];for(let i=0;i<px.length;i+=4)g.push((px[i]*.299)+(px[i+1]*.587)+(px[i+2]*.114));const avg=g.reduce((a,b)=>a+b,0)/g.length;resolve(g.map(v=>v>=avg?'1':'0').join(''))};img.src=data})}
function hashSimilarity(a,b){if(!a||!b||a.length!==b.length)return 0;let same=0;for(let i=0;i<a.length;i++)if(a[i]===b[i])same++;return same/a.length}

async function analyzeProductImageAI(aiImageData){

  if(!navigator.onLine){recognitionInfo('📴 ออฟไลน์ • ยังใช้ระบบจำรูปสินค้าเดิมได้ แต่ AI วิเคราะห์สินค้าใหม่ต้องมีอินเทอร์เน็ต','warn');return false}
  if(!cfg.url||!cfg.token){recognitionInfo('✨ AI พร้อมใช้งานหลังตั้งค่า Apps Script URL + รหัส Sync ใน Backup / Cloud Sync','warn');return false}

  recognitionInfo('✨ AI กำลังอ่านยี่ห้อ ชื่อสินค้า รส/รุ่น ขนาด และหมวดหมู่…');

    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.ok){
      if(data.error==='ai_key_missing')throw new Error('ยังไม่ได้ตั้ง GEMINI_API_KEY ใน Apps Script');
      throw new Error(data.error||'AI analyze failed');
    }
    const r=data.product||{};
    if(!String(r.name||'').trim()){
      recognitionInfo('🤔 AI ยังระบุชื่อสินค้าไม่ได้ชัดเจน • ลองถ่ายด้านหน้าฉลากให้ตรงและชัดขึ้น','warn');
      return false;
    }
    setProductFieldIfAppropriate('pName',r.name,true);
    setProductFieldIfAppropriate('pCategory',r.category);
    setProductFieldIfAppropriate('pBarcode',r.barcode);
    setProductFieldIfAppropriate('pKeywords',aiProductKeywords(r));
    const pct=Math.max(0,Math.min(100,Math.round(n(r.confidence,0)*100)));
    const details=[r.brand,r.variant,r.size].filter(Boolean).map(esc).join(' • ');
    recognitionInfo(`✨ AI กรอกชื่อให้แล้ว: <b>${esc(r.name)}</b>${details?`<div class="mt-1">${details}</div>`:''}<div class="mt-1">ความมั่นใจ ${pct}% • กรุณาตรวจสอบชื่อ/ขนาดก่อนกดบันทึก</div>`,'hit');
    const nameEl=document.getElementById('pName');if(nameEl){nameEl.focus();nameEl.setSelectionRange?.(nameEl.value.length,nameEl.value.length)}
    return true;
  }catch(e){
    console.warn('AI product recognition failed',e);
    recognitionInfo(`⚠️ AI วิเคราะห์ไม่สำเร็จ: ${esc(e.message||String(e))} • ยังเพิ่มสินค้าแบบกรอกเองได้`,'warn');
    return false;
  }finally{aiProductAnalysisBusy=false}
}

  modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto"><div class="flex justify-between items-center"><div><h3 class="text-xl font-bold">▥ เพิ่มสินค้าโดยบาร์โค้ด</h3><p class="text-sm text-slate-500">สแกนด้วยเครื่องอ่านบาร์โค้ด หรือใช้กล้องมือถือ</p></div><button onclick="closeModal(this)" class="text-3xl">×</button></div><label class="block mt-4 font-bold">บาร์โค้ดสินค้า<input id="newProductBarcodeInput" inputmode="numeric" autocomplete="off" class="w-full border-2 border-indigo-200 rounded-xl p-3 text-xl mt-1" placeholder="ยิงบาร์โค้ดแล้วกด Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();submitNewProductBarcode(this.value,this)}"></label><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="startProductBarcodeScanner('new')" class="bg-indigo-600 text-white rounded-xl p-3 font-bold">📷 สแกนด้วยกล้อง</button><button onclick="submitNewProductBarcode(document.getElementById('newProductBarcodeInput').value,this)" class="bg-emerald-600 text-white rounded-xl p-3 font-bold">➕ เพิ่มสินค้า</button></div><p class="text-xs text-slate-500 mt-3">ถ้าบาร์โค้ดมีอยู่แล้ว ระบบจะเปิดสินค้านั้นแทน เพื่อป้องกันข้อมูลซ้ำ</p></div>`);
  setTimeout(()=>document.getElementById('newProductBarcodeInput')?.focus(),30)
}
function submitNewProductBarcode(raw,btn){
  const code=normalizeBarcodeInput(raw);if(!code)return toast('กรุณาสแกนหรือกรอกบาร์โค้ด',true);
  const existing=state.products.find(p=>normalizeBarcodeInput(p.barcode)===code);
  if(existing){document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());toast(`มีบาร์โค้ดนี้แล้ว: ${existing.name}`);editProduct(existing.id);return}
  document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());addProduct(false,code)
}
function startProductBarcodeScanner(mode='new'){
  if(scannerActive)return toast('กำลังใช้งานกล้องสแกนอยู่',true);
  const m=modal(`<div class="bg-white rounded-2xl p-6 max-w-2xl mx-auto"><div class="flex justify-between"><div><h3 class="text-xl font-bold">📷 สแกนบาร์โค้ดสินค้า</h3><p class="text-sm text-slate-500">วางบาร์โค้ดให้อยู่กลางกรอบ</p></div><button onclick="stopScanner();closeModal(this)" class="text-3xl">×</button></div><div id="reader" class="mt-4"></div></div>`);
  let locked=false;
  setTimeout(()=>{try{
    scanner=new Html5Qrcode('reader');
    scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},txt=>{
      if(locked)return;locked=true;const code=normalizeBarcodeInput(txt);beep();
      const done=()=>{m.remove();if(mode==='field'){
        const input=document.getElementById('pBarcode');if(!input)return;
        const existing=state.products.find(p=>normalizeBarcodeInput(p.barcode)===code&&p.id!==productEditingId);
        input.value=code;if(existing)toast(`บาร์โค้ดนี้มีอยู่แล้ว: ${existing.name}`,true);else toast('ใส่บาร์โค้ดในแบบฟอร์มแล้ว')
      }else submitNewProductBarcode(code,null)};
      const pr=stopScanner();if(pr&&typeof pr.then==='function')pr.finally(done);else done()
    },()=>{}).then(()=>scannerActive=true).catch(()=>{toast('เปิดกล้องไม่สำเร็จ',true);m.remove()})
  }catch(e){toast('เครื่องนี้ไม่รองรับกล้อง',true);m.remove()}},200)
}

function addStockLog(p,type,qty,before,after,reason,ref){state.stockLogs.unshift({id:uid('st'),time:new Date().toISOString(),productId:p.id,productName:p.name,type,qty,before,after,reason:reason||'',reference:ref||'',user:currentUser?.name||'ระบบ'})}
function adjustStock(id){if(!requireRole(['owner','manager']))return toast('ไม่มีสิทธิ์ปรับสต็อก',true);const p=state.products.find(x=>x.id===id);if(!p)return;modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto"><h3 class="text-xl font-bold mb-3">📦 ปรับสต็อก — ${esc(p.name)}</h3><p class="mb-3">คงเหลือ <b>${p.stock}</b></p><select id="stType" class="w-full border rounded p-2 mb-2"><option value="receive">รับสินค้าเข้า (+)</option><option value="damage">ของเสีย/สูญหาย (-)</option><option value="adjust">ปรับยอด (+/-)</option></select><input id="stQty" type="number" placeholder="จำนวน (ปรับยอดใส่ลบได้)" class="w-full border rounded p-2 mb-2"><label class="block text-sm mb-2">วันหมดอายุของล็อต/สินค้าปัจจุบัน (ไม่บังคับ)<input id="stExpiry" type="date" value="${esc(p.expiryDate||'')}" class="w-full border rounded p-2 mt-1"></label><input id="stReason" placeholder="เหตุผล / เลขเอกสาร" class="w-full border rounded p-2 mb-4"><div class="flex gap-2"><button onclick="closeModal(this)" class="flex-1 bg-slate-200 rounded p-2">ยกเลิก</button><button onclick="saveStockAdjust('${id}',this)" class="flex-1 text-white rounded p-2" style="background:${state.config.primary_action_color}">บันทึก</button></div></div>`)}
function saveStockAdjust(id,btn){const p=state.products.find(x=>x.id===id),type=document.getElementById('stType').value;let qty=Math.trunc(n(document.getElementById('stQty').value));const reason=document.getElementById('stReason').value.trim(),expiry=document.getElementById('stExpiry')?.value||p.expiryDate||'';if(!qty)return toast('กรอกจำนวน',true);if(type==='receive')qty=Math.abs(qty);if(type==='damage')qty=-Math.abs(qty);const before=p.stock,after=before+qty;if(after<0)return toast('สต็อกติดลบไม่ได้',true);p.stock=after;p.expiryDate=expiry;addStockLog(p,type,qty,before,after,reason,'');audit('stock_adjust',`${p.name}: ${before} → ${after}${reason?' • '+reason:''}`,'product',p.id);saveState();closeModal(btn);render();toast('ปรับสต็อกแล้ว')}
function stockTypeName(t){return({opening:'ยอดเริ่มต้น',receive:'รับเข้า',damage:'ของเสีย/สูญหาย',adjust:'ปรับยอด',count:'ตรวจนับจริง',sale:'ขาย',return:'คืนสินค้า',void:'ยกเลิกบิล'}[t]||t)}

function holdBill(){if(!cart.length)return toast('ยังไม่มีสินค้าในตะกร้า',true);const name=prompt('ชื่อบิลพัก / ชื่อลูกค้า','บิลพัก '+(state.heldBills.length+1));if(name===null)return;state.heldBills.unshift({id:uid('h'),name:name||'บิลพัก',time:new Date().toISOString(),cart:JSON.parse(JSON.stringify(cart)),selectedPromoId,manualBillDiscount:{...manualBillDiscount},paymentMethod,cashReceived,memberId:currentMemberId,user:currentUser?.name||''});saveState();cart=[];resetBillDiscount();currentMemberId='';cashReceived='';saleView='products';render();toast('พักบิลแล้ว')}
function openHeldBills(){modal(`<div class="bg-white rounded-2xl p-6 max-w-3xl mx-auto"><div class="flex justify-between"><h3 class="text-2xl font-bold">⏸️ บิลที่พักไว้</h3><button onclick="closeModal(this)" class="text-3xl">×</button></div>${state.heldBills.length?`<div class="space-y-2 mt-4">${state.heldBills.map(h=>`<div class="border rounded-xl p-3 flex justify-between items-center"><div><b>${esc(h.name)}</b><div class="text-xs text-slate-500">${new Date(h.time).toLocaleString('th-TH')} · ${h.cart.length} รายการ</div></div><div class="flex gap-2"><button onclick="resumeHeld('${h.id}')" class="px-3 py-1 rounded bg-emerald-600 text-white">เรียกบิล</button><button onclick="deleteHeld('${h.id}',this)" class="px-3 py-1 rounded bg-red-100 text-red-700">ลบ</button></div></div>`).join('')}</div>`:'<p class="text-center text-slate-500 py-8">ไม่มีบิลพัก</p>'}</div>`)}
function resumeHeld(id){if(cart.length&&!confirm('ตะกร้าปัจจุบันจะถูกแทนที่ ต้องการต่อหรือไม่?'))return;const h=state.heldBills.find(x=>x.id===id);if(!h)return;cart=h.cart;selectedPromoId=h.selectedPromoId||'';manualBillDiscount=h.manualBillDiscount?{...h.manualBillDiscount}:{type:'percent',value:0,label:''};paymentMethod=(h.paymentMethod==='card'?'cash':(h.paymentMethod||'cash'));cashReceived=h.cashReceived||'';currentMemberId=h.memberId&&state.members.some(m=>m.id===h.memberId)?h.memberId:'';state.heldBills=state.heldBills.filter(x=>x.id!==id);saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());activeTab='pos';saleView='checkout';render();toast('เรียกบิลพักแล้ว')}
function deleteHeld(id,btn){if(confirm('ลบบิลพักนี้?')){state.heldBills=state.heldBills.filter(x=>x.id!==id);saveState();closeModal(btn);openHeldBills()}}

function openPromotions(){if(!requireRole(['owner','manager']))return toast('ไม่มีสิทธิ์จัดการโปรโมชั่น',true);modal(`<div class="bg-white rounded-2xl p-6 max-w-4xl mx-auto"><div class="flex justify-between"><h3 class="text-2xl font-bold">🎁 โปรโมชั่น</h3><button onclick="closeModal(this)" class="text-3xl">×</button></div><div class="grid md:grid-cols-2 gap-3 mt-4">${state.promotions.map(p=>`<div class="border rounded-xl p-4"><div class="flex justify-between"><b>${esc(p.name)}</b><span>${p.active?'✅':'⛔'}</span></div><div class="text-sm text-slate-500">${promoDescription(p)}</div><div class="mt-2 flex gap-2"><button onclick="togglePromo('${p.id}')" class="px-3 py-1 bg-slate-200 rounded">เปิด/ปิด</button><button onclick="deletePromo('${p.id}')" class="px-3 py-1 bg-red-100 text-red-700 rounded">ลบ</button></div></div>`).join('')}</div><button onclick="addPromo()" class="mt-4 px-4 py-2 text-white rounded" style="background:${state.config.primary_action_color}">+ เพิ่มโปรโมชั่น</button></div>`)}
function promoDescription(p){let x;if(p.type==='bill_percent')x=`ลดทั้งบิล ${p.value}% (โปรโมชั่นเดิม)`;else if(p.type==='bill_fixed')x=`ลดทั้งบิล ${money(p.value)}`;else if(p.type==='bogo')x=`ซื้อ ${p.buy} แถม ${p.free} (สินค้าเดียวกัน)`;else if(p.type==='member_fixed')x=`สมาชิก ลด ${money(p.value)}`;else x=`สมาชิก ลด ${p.value}% (โปรโมชั่นเดิม)`;const period=(p.startDate||p.endDate)?` · ${p.startDate||'เริ่มทันที'} ถึง ${p.endDate||'ไม่สิ้นสุด'}`:'';return x+period}
function addPromo(){modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto"><h3 class="text-xl font-bold mb-4">เพิ่มโปรโมชั่น</h3><input id="prName" placeholder="ชื่อโปรโมชั่น" class="w-full border rounded p-2 mb-2"><select id="prType" class="w-full border rounded p-2 mb-2" onchange="renderPromoFields()"><option value="bill_fixed">ลดทั้งบิล (บาท)</option><option value="member_fixed">สมาชิก ลด (บาท)</option><option value="bogo">ซื้อ X แถม Y</option></select><div id="promoFields"><input id="prValue" type="number" min="0" step="0.01" placeholder="ส่วนลด (บาท)" class="w-full border rounded p-2 mb-2"></div><div class="grid grid-cols-2 gap-2 mt-2"><label class="text-xs">เริ่มใช้<input id="prStart" type="date" class="w-full border rounded p-2"></label><label class="text-xs">สิ้นสุด<input id="prEnd" type="date" class="w-full border rounded p-2"></label></div><div class="flex gap-2 mt-3"><button onclick="closeModal(this)" class="flex-1 bg-slate-200 rounded p-2">ยกเลิก</button><button onclick="savePromo(this)" class="flex-1 text-white rounded p-2" style="background:${state.config.primary_action_color}">บันทึก</button></div></div>`)}
function renderPromoFields(){const t=document.getElementById('prType').value,f=document.getElementById('promoFields');f.innerHTML=t==='bogo'?'<div class="grid grid-cols-2 gap-2"><input id="prBuy" type="number" min="1" value="2" class="border rounded p-2" placeholder="ซื้อ"><input id="prFree" type="number" min="1" value="1" class="border rounded p-2" placeholder="แถม"></div>':'<input id="prValue" type="number" min="0" placeholder="จำนวนส่วนลด" class="w-full border rounded p-2 mb-2">'}
function savePromo(btn){const name=document.getElementById('prName').value.trim(),type=document.getElementById('prType').value;if(!name)return toast('กรอกชื่อโปรโมชั่น',true);const p={id:uid('pr'),name,type,active:true,startDate:document.getElementById('prStart').value||'',endDate:document.getElementById('prEnd').value||''};if(p.startDate&&p.endDate&&p.startDate>p.endDate)return toast('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม',true);if(type==='bogo'){p.buy=Math.max(1,Math.trunc(n(document.getElementById('prBuy').value,2)));p.free=Math.max(1,Math.trunc(n(document.getElementById('prFree').value,1)))}else p.value=Math.max(0,n(document.getElementById('prValue').value));state.promotions.push(p);saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());openPromotions()}
function togglePromo(id){const p=state.promotions.find(x=>x.id===id);if(p){p.active=!p.active;saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());openPromotions()}}
function deletePromo(id){if(confirm('ลบโปรโมชั่น?')){state.promotions=state.promotions.filter(x=>x.id!==id);if(selectedPromoId===id)selectedPromoId='';saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());openPromotions()}}

function checkout(){if(!cart.length)return;const c=calcCart();if(paymentMethod==='cash'&&n(cashReceived)<c.total)return toast('รับเงินไม่เพียงพอ',true);let seq=Math.max(1,n(state.nextOrder,1)),order;do{order=`ORD${String(seq).padStart(6,'0')}`;seq++}while(state.sales.some(x=>x.order_number===order));const now=new Date().toISOString();const beforeBill=c.itemSubtotal;const saleItems=cart.map(i=>({productId:i.productId,name:i.name,price:i.price,cost:i.cost,qty:i.qty,itemDiscount:i.discount,itemDiscountType:i.discountType,lineNet:itemNet(i)}));const mem=currentMember();const sale={id:uid('sale'),order_number:order,timestamp:now,items:saleItems,itemSubtotal:c.itemSubtotal,billDiscount:c.billDiscount,total:c.total,promotion:selectedPromo()?{...selectedPromo()}:null,discountInfo:c.discountInfo||null,payment_method:paymentMethod,cash_received:paymentMethod==='cash'?n(cashReceived):0,change:paymentMethod==='cash'?Math.max(0,n(cashReceived)-c.total):0,cashier:currentUser?.name||'',member_id:mem?.id||'',customer_name:mem?.name||'ลูกค้าทั่วไป',customer_phone:mem?.phone||'',status:'completed',returns:[]};
 for(const i of cart){const p=state.products.find(x=>x.id===i.productId);if(!p||p.stock<i.qty)return toast(`สต็อก ${i.name} ไม่เพียงพอ`,true)}
 for(const i of cart){const p=state.products.find(x=>x.id===i.productId),before=p.stock;p.stock-=i.qty;addStockLog(p,'sale',-i.qty,before,p.stock,'ขายสินค้า',order)}state.sales.push(sale);state.nextOrder=seq;if(c.billDiscount||saleItems.some(i=>n(i.itemDiscount)>0))audit('discount_sale',`${order} • ส่วนลดรวม ${money((beforeBill-c.total))}`,'sale',sale.id);saveState();showCustomerPaid(sale);cart=[];resetBillDiscount();currentMemberId='';cashReceived='';paymentMethod='cash';saleView='products';render();toast(`บันทึก ${order} สำเร็จ`);showReceipt(sale.id)}
function showReceipt(id){const s=state.sales.find(x=>x.id===id);if(!s)return;modal(`<div class="bg-white rounded-2xl p-6 max-w-lg mx-auto"><div class="flex justify-between no-print"><h3 class="text-xl font-bold">🧾 ใบเสร็จ</h3><button onclick="closeModal(this)" class="text-3xl">×</button></div>${receiptHTML(s)}<div class="grid grid-cols-2 gap-2 mt-4 no-print"><button onclick="printReceipt('${s.id}')" class="rounded p-2 bg-slate-800 text-white">🖨️ พิมพ์</button><button onclick="closeModal(this)" class="rounded p-2 bg-slate-200">ปิด</button></div></div>`)}
function receiptHTML(s){const returned=(s.returns||[]).reduce((a,r)=>a+n(r.refund),0);return `<div class="text-center my-4">${safeProductImage(state.config.logo_image)?`<img src="${safeProductImage(state.config.logo_image)}" style="max-width:90px;max-height:70px;object-fit:contain;margin:0 auto 6px">`:''}<div class="text-xl font-bold">${esc(state.config.store_name)}</div><div class="text-sm">${esc(state.config.branch_name)}</div><div class="text-sm">โทร ${esc(state.config.phone_number)}</div></div><div class="text-sm border-y py-2"><div class="flex justify-between"><span>เลขที่</span><b>${esc(s.order_number)}</b></div><div class="flex justify-between"><span>วันที่</span><span>${new Date(s.timestamp).toLocaleString('th-TH')}</span></div><div class="flex justify-between"><span>พนักงาน</span><span>${esc(s.cashier||'-')}</span></div>${s.member_id||s.customer_phone||s.customer_name&&s.customer_name!=='ลูกค้าทั่วไป'?`<div class="flex justify-between"><span>สมาชิก</span><span>${esc(s.customer_name||s.customer_phone||'สมาชิก')}${s.customer_phone?` (${esc(s.customer_phone)})`:''}</span></div>`:''}</div><div class="py-2">${s.items.map(i=>`<div class="flex justify-between gap-3 text-sm"><span>${esc(i.name)} x${i.qty}</span><span>${money(i.lineNet)}</span></div>`).join('')}</div><div class="border-t pt-2 text-sm"><div class="flex justify-between"><span>รวมหลังส่วนลดสินค้า</span><span>${money(s.itemSubtotal)}</span></div>${s.billDiscount?`<div class="flex justify-between text-red-600"><span>${esc(s.discountInfo?.label||s.promotion?.name||'โปรโมชั่น/ส่วนลดบิล')}</span><span>-${money(s.billDiscount)}</span></div>`:''}<div class="flex justify-between text-lg font-bold mt-1"><span>สุทธิ</span><span>${money(s.total)}</span></div><div class="flex justify-between"><span>${methodName(s.payment_method)}</span><span>${s.payment_method==='cash'?money(s.cash_received):''}</span></div>${s.payment_method==='cash'?`<div class="flex justify-between"><span>เงินทอน</span><span>${money(s.change)}</span></div>`:''}${returned?`<div class="flex justify-between text-red-600"><span>คืนเงินแล้ว</span><span>${money(returned)}</span></div>`:''}</div><div class="text-center text-xs text-slate-500 mt-5">ขอบคุณที่อุดหนุน</div>`}
function printReceipt(id){const s=state.sales.find(x=>x.id===id);if(!s)return;const w=window.open('','_blank','width=420,height=700');w.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>${esc(s.order_number)}</title><style>body{font-family:Arial,sans-serif;padding:18px;max-width:330px;margin:auto}.flex{display:flex}.justify-between{justify-content:space-between}.gap-3{gap:12px}.text-sm{font-size:12px}.text-lg{font-size:18px}.text-xl{font-size:22px}.font-bold{font-weight:700}.text-center{text-align:center}.border-y{border-top:1px dashed #555;border-bottom:1px dashed #555}.border-t{border-top:1px dashed #555}.py-2{padding:8px 0}.pt-2{padding-top:8px}.mt-1{margin-top:4px}.mt-5{margin-top:20px}.text-red-600{color:#b91c1c}.text-slate-500{color:#64748b}</style></head><body>${receiptHTML(s)}<script>window.print();window.onafterprint=()=>window.close();<\/script></body></html>`);w.document.close()}
function safePromptPayImage(v){return /^data:image\/(png|jpe?g|webp);base64,/i.test(String(v||''))?String(v):''}
function showPromptPay(){
  const c=calcCart();if(!c.total)return;paymentMethod='qr';customerDisplayStatus=`กรุณาสแกน QR เพื่อชำระ ${money(c.total)}`;updateCustomerDisplay();
  const image=safePromptPayImage(state.config.promptpay_image),pp=(state.config.promptpay_number||'').replace(/\D/g,'');
  if(image){
    modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto text-center"><h3 class="text-2xl font-bold mb-3">💳 สแกนจ่ายพร้อมเพย์</h3><div class="flex justify-center bg-white p-3"><img src="${image}" alt="QR พร้อมเพย์" class="max-w-[280px] max-h-[320px] w-auto h-auto object-contain rounded-xl border"></div><div class="text-3xl font-bold mt-3" style="color:${state.config.primary_action_color}">${money(c.total)}</div><div>${esc(state.config.store_name)}</div>${state.config.promptpay_number?`<div class="text-sm text-slate-500">พร้อมเพย์ ${esc(state.config.promptpay_number)}</div>`:''}<div class="text-xs text-amber-700 mt-2">QR จากรูปที่แนบไว้ • ตรวจยอดก่อนยืนยันการชำระ</div><button onclick="closeModal(this)" class="w-full bg-slate-200 rounded p-2 mt-4">ปิด</button></div>`);
    return;
  }
  if(![10,13].includes(pp.length))return toast('กรุณาแนบรูป QR พร้อมเพย์ หรือใส่เลขพร้อมเพย์ 10/13 หลักในเมนูตั้งค่า',true);
  modal(`<div class="bg-white rounded-2xl p-6 max-w-md mx-auto text-center"><h3 class="text-2xl font-bold mb-3">💳 สแกนจ่าย</h3><div id="payqr" class="flex justify-center bg-white p-3"></div><div class="text-3xl font-bold mt-3" style="color:${state.config.primary_action_color}">${money(c.total)}</div><div>${esc(state.config.store_name)}</div><div class="text-sm text-slate-500">พร้อมเพย์ ${esc(state.config.promptpay_number)}</div><button onclick="closeModal(this)" class="w-full bg-slate-200 rounded p-2 mt-4">ปิด</button></div>`);setTimeout(()=>new QRCode(document.getElementById('payqr'),{text:promptPayPayload(pp,c.total),width:220,height:220}),20)
}
function emv(tag,val){return tag+String(val.length).padStart(2,'0')+val}
function crc16(s){let crc=0xFFFF;for(let c=0;c<s.length;c++){crc^=s.charCodeAt(c)<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF}return crc.toString(16).toUpperCase().padStart(4,'0')}
function promptPayPayload(id,amount){let proxy;if(id.length===10)proxy=emv('01','0066'+id.slice(1));else proxy=emv('02',id);const merchant=emv('00','A000000677010111')+proxy;let s=emv('00','01')+emv('01','12')+emv('29',merchant)+emv('53','764')+emv('54',Number(amount).toFixed(2))+emv('58','TH')+'6304';return s+crc16(s)}

function saleDetail(id){const s=state.sales.find(x=>x.id===id);if(!s)return;const returned=(s.returns||[]).reduce((a,r)=>a+n(r.refund),0);modal(`<div class="bg-white rounded-2xl p-6 max-w-2xl mx-auto"><div class="flex justify-between"><h3 class="text-2xl font-bold">${esc(s.order_number)}</h3><button onclick="closeModal(this)" class="text-3xl">×</button></div>${receiptHTML(s)}${s.returns?.length?`<div class="mt-4 p-3 bg-red-50 rounded"><b>ประวัติคืนสินค้า</b>${s.returns.map(r=>`<div class="text-sm mt-1">${new Date(r.time).toLocaleString('th-TH')} — ${money(r.refund)} (${esc(r.reason)})</div>`).join('')}</div>`:''}<div class="grid grid-cols-3 gap-2 mt-4"><button onclick="printReceipt('${s.id}')" class="bg-slate-800 text-white rounded p-2">พิมพ์ซ้ำ</button><button onclick="openReturn('${s.id}')" class="bg-red-600 text-white rounded p-2" ${s.status==='voided'?'disabled':''}>คืนสินค้า</button><button onclick="voidSale('${s.id}')" class="bg-amber-500 text-white rounded p-2" ${s.status==='voided'?'disabled':''}>ยกเลิกบิล</button></div></div>`)}

function openReturn(id){if(!requireRole(['owner','manager']))return toast('การคืนสินค้าต้องใช้สิทธิ์ผู้จัดการขึ้นไป',true);const s=state.sales.find(x=>x.id===id);if(!s)return;modal(`<div class="bg-white rounded-2xl p-6 max-w-xl mx-auto"><h3 class="text-xl font-bold mb-3">↩️ คืนสินค้า ${esc(s.order_number)}</h3><div class="space-y-2">${s.items.map((i,idx)=>{const left=i.qty-returnedQty(s,i.productId);return `<div class="grid grid-cols-[1fr_100px] gap-2 items-center"><div>${esc(i.name)} <span class="text-xs text-slate-500">คืนได้ ${left}</span></div><input id="ret_${idx}" type="number" min="0" max="${left}" value="0" class="border rounded p-2"></div>`}).join('')}</div><input id="retReason" placeholder="เหตุผลการคืน" class="w-full border rounded p-2 mt-3"><div class="flex gap-2 mt-4"><button onclick="closeModal(this)" class="flex-1 bg-slate-200 rounded p-2">ยกเลิก</button><button onclick="processReturn('${s.id}',this)" class="flex-1 bg-red-600 text-white rounded p-2">ยืนยันคืน</button></div></div>`)}
function processReturn(id,btn){const s=state.sales.find(x=>x.id===id);const items=[];let returnBase=0;s.items.forEach((i,idx)=>{const max=i.qty-returnedQty(s,i.productId),qty=Math.min(max,Math.max(0,Math.trunc(n(document.getElementById('ret_'+idx).value))));if(qty){items.push({productId:i.productId,name:i.name,qty});returnBase+=i.lineNet*(qty/i.qty)}});if(!items.length)return toast('เลือกจำนวนที่จะคืน',true);const reason=document.getElementById('retReason').value.trim()||'คืนสินค้า';const ratio=s.itemSubtotal>0?s.total/s.itemSubtotal:1,refund=returnBase*ratio;for(const ri of items){const p=state.products.find(x=>x.id===ri.productId);if(p){const before=p.stock;p.stock+=ri.qty;addStockLog(p,'return',ri.qty,before,p.stock,reason,s.order_number)}}s.returns=s.returns||[];s.returns.push({id:uid('ret'),time:new Date().toISOString(),items,refund,reason,user:currentUser.name});if(s.items.every(i=>returnedQty(s,i.productId)>=i.qty))s.status='returned';audit('return_sale',`${s.order_number} • คืน ${money(refund)} • ${reason}`,'sale',s.id);saveState();closeModal(btn);document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());render();toast(`คืนสินค้าแล้ว ${money(refund)}`)}

function voidSale(id){if(!requireRole(['owner','manager']))return toast('การยกเลิกบิลต้องใช้สิทธิ์ผู้จัดการขึ้นไป',true);const s=state.sales.find(x=>x.id===id);if(!s||s.status==='voided')return;if(!confirm(`ยกเลิกบิล ${s.order_number} และคืนสต็อกทั้งหมดที่ยังไม่คืน?`))return;const items=[];for(const i of s.items){const qty=Math.max(0,i.qty-returnedQty(s,i.productId));if(!qty)continue;items.push({productId:i.productId,name:i.name,qty});const p=state.products.find(x=>x.id===i.productId);if(p){const before=p.stock;p.stock+=qty;addStockLog(p,'void',qty,before,p.stock,'ยกเลิกบิล',s.order_number)}}const already=saleReturnedAmount(s),refund=Math.max(0,n(s.total)-already);s.returns=s.returns||[];if(items.length||refund)s.returns.push({id:uid('ret'),time:new Date().toISOString(),items,refund,reason:'ยกเลิกบิล',user:currentUser.name});s.status='voided';audit('void_sale',`${s.order_number} • คืนสต็อกและยกเลิกยอด ${money(refund)}`,'sale',s.id);saveState();document.querySelectorAll('.fixed.inset-0').forEach(x=>x.remove());render();toast(`ยกเลิก ${s.order_number} แล้ว`)}

function lastShiftClose(){return (state.shiftClosures||[]).slice().sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt))[0]||null}
function currentShiftStart(){const last=lastShiftClose();if(last)return new Date(last.closedAt);const now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate())}
function shiftMetrics(start=currentShiftStart(),end=new Date()){
  const sales=state.sales.filter(s=>s.status!=='voided'&&new Date(s.timestamp)>=start&&new Date(s.timestamp)<=end);
  let cash=0,qr=0,refund=0,discount=0,cost=0,revenue=0;
  sales.forEach(s=>{const ret=saleReturnedAmount(s),net=n(s.total)-ret;revenue+=net;refund+=ret;discount+=n(s.billDiscount)+s.items.reduce((a,i)=>a+Math.max(0,n(i.price)*n(i.qty)-n(i.lineNet)),0);if(s.payment_method==='cash')cash+=net;else if(s.payment_method==='qr')qr+=net;else qr+=net;s.items.forEach(i=>cost+=n(i.cost)*Math.max(0,n(i.qty)-returnedQty(s,i.productId))) });
  return {sales,count:sales.length,cash,qr,refund,discount,cost,revenue,profit:revenue-cost};
}
function openShiftClose(){if(!requireRole(['owner','manager']))return toast('ไม่มีสิทธิ์ปิดกะ',true);const start=currentShiftStart(),m=shiftMetrics(start,new Date());modal(`<div class="bg-white rounded-2xl p-6 max-w-2xl mx-auto"><div class="flex justify-between"><div><h3 class="text-2xl font-bold">🧮 ปิดยอดประจำวัน / ปิดกะ</h3><p class="text-sm text-slate-500">ตั้งแต่ ${start.toLocaleString('th-TH')} ถึงตอนนี้</p></div><button onclick="closeModal(this)" class="text-3xl">×</button></div><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-4">${[['บิล',m.count],['ยอดสุทธิ',money(m.revenue)],['เงินสด',money(m.cash)],['QR/อื่นๆ',money(m.qr)],['คืนเงิน',money(m.refund)],['ส่วนลด',money(m.discount)],['ต้นทุน',money(m.cost)],['กำไร',money(m.profit)]].map(x=>`<div class="bg-slate-50 rounded-xl p-3"><div class="text-xs text-slate-500">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div><div class="grid grid-cols-2 gap-3 mt-4"><label>เงินทอนตั้งต้น<input id="shiftOpening" type="number" min="0" step="0.01" value="0" class="w-full border rounded p-2"></label><label>เงินสดนับได้จริง<input id="shiftCounted" type="number" min="0" step="0.01" value="${m.cash.toFixed(2)}" class="w-full border rounded p-2"></label></div><textarea id="shiftNote" placeholder="หมายเหตุปิดกะ" class="w-full border rounded p-2 mt-3"></textarea><button onclick="saveShiftClose(this)" class="w-full bg-emerald-600 text-white rounded-xl p-3 mt-4 font-bold">🔒 ยืนยันปิดกะ</button><details class="mt-4"><summary class="font-bold cursor-pointer">ประวัติปิดกะ (${state.shiftClosures.length})</summary><div class="space-y-2 mt-2 max-h-52 overflow-auto">${state.shiftClosures.slice(0,30).map(x=>`<div class="border rounded p-2 flex justify-between items-center"><div><b>${new Date(x.closedAt).toLocaleString('th-TH')}</b><div class="text-xs text-slate-500">${x.user} • ${x.count} บิล • ต่าง ${money(x.cashDifference)}</div></div><button onclick="printShift('${x.id}')" class="bg-slate-100 rounded px-3 py-2">🖨️</button></div>`).join('')}</div></details></div>`)}
function saveShiftClose(btn){const start=currentShiftStart(),end=new Date(),m=shiftMetrics(start,end),opening=Math.max(0,n(document.getElementById('shiftOpening').value)),counted=Math.max(0,n(document.getElementById('shiftCounted').value)),expected=opening+m.cash,diff=counted-expected,note=document.getElementById('shiftNote').value.trim();if(!confirm(`ยืนยันปิดกะ? เงินสดต่าง ${money(diff)}`))return;const rec={id:uid('shift'),startedAt:start.toISOString(),closedAt:end.toISOString(),user:currentUser?.name||'',count:m.count,revenue:m.revenue,cash:m.cash,qr:m.qr,refund:m.refund,discount:m.discount,cost:m.cost,profit:m.profit,openingCash:opening,expectedCash:expected,countedCash:counted,cashDifference:diff,note};state.shiftClosures.unshift(rec);audit('shift_close',`${rec.count} บิล • ยอด ${money(rec.revenue)} • เงินสดต่าง ${money(diff)}`,'shift',rec.id);saveState();closeModal(btn);render();toast('ปิดกะเรียบร้อย');printShift(rec.id)}

function profitRows(){const map=new Map();state.sales.filter(s=>s.status!=='voided').forEach(s=>{const ratio=n(s.itemSubtotal)>0?n(s.total)/n(s.itemSubtotal):1;s.items.forEach(i=>{const returned=returnedQty(s,i.productId),qty=Math.max(0,n(i.qty)-returned);if(!qty)return;const grossLine=n(i.lineNet)*(qty/Math.max(1,n(i.qty))),revenue=grossLine*ratio,cost=n(i.cost)*qty,key=i.productId||i.name,r=map.get(key)||{productId:i.productId,name:i.name,qty:0,revenue:0,cost:0,profit:0};r.qty+=qty;r.revenue+=revenue;r.cost+=cost;r.profit+=revenue-cost;map.set(key,r)})});return [...map.values()].sort((a,b)=>b.profit-a.profit)}
function periodProfit(start,end=new Date()){let revenue=0,cost=0;state.sales.filter(s=>s.status!=='voided'&&new Date(s.timestamp)>=start&&new Date(s.timestamp)<=end).forEach(s=>{revenue+=n(s.total)-saleReturnedAmount(s);s.items.forEach(i=>cost+=n(i.cost)*Math.max(0,n(i.qty)-returnedQty(s,i.productId)))});return {revenue,cost,profit:revenue-cost}}

function saleReturnedAmount(s){return(s.returns||[]).reduce((a,r)=>a+n(r.refund),0)}
function stats(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),month=new Date(now.getFullYear(),now.getMonth(),1);const valid=state.sales.filter(s=>s.status!=='voided');const revenue=valid.reduce((a,s)=>a+n(s.total)-saleReturnedAmount(s),0);const monthRevenue=valid.filter(s=>new Date(s.timestamp)>=month).reduce((a,s)=>a+n(s.total)-saleReturnedAmount(s),0);const todayRevenue=valid.filter(s=>new Date(s.timestamp)>=today).reduce((a,s)=>a+n(s.total)-saleReturnedAmount(s),0);let cost=0;valid.forEach(s=>s.items.forEach(i=>{const returned=returnedQty(s,i.productId);cost+=n(i.cost)*(i.qty-returned)}));const profit=revenue-cost;const last7=[];for(let d=6;d>=0;d--){const dt=new Date(today);dt.setDate(today.getDate()-d);const val=valid.filter(s=>{const x=new Date(s.timestamp);return x.toDateString()===dt.toDateString()}).reduce((a,s)=>a+n(s.total)-saleReturnedAmount(s),0);last7.push({label:dt.toLocaleDateString('th-TH',{weekday:'short',day:'numeric'}),value:val})}return{revenue,monthRevenue,todayRevenue,cost,profit,last7,low:state.products.filter(p=>p.stock<=n(p.lowStock,state.config.low_stock_default))}}

function compressPromptPayImage(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\/(png|jpeg|webp)$/i.test(file.type||''))return reject(new Error('type'));
    const reader=new FileReader();reader.onerror=()=>reject(new Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('image'));img.onload=()=>{
      let max=640,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      const make=(quality)=>{canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return canvas.toDataURL('image/jpeg',quality)};
      let quality=.9,data=make(quality);while(data.length>38000&&quality>.55){quality-=.08;data=make(quality)}
      while(data.length>38000&&w>360){w=Math.round(w*.85);h=Math.round(h*.85);quality=.75;data=make(quality)}
      if(data.length>48000)return reject(new Error('large'));resolve(data)
    };img.src=String(reader.result)};reader.readAsDataURL(file)
  })
}

function nav(){const tabs=[['dashboard','🏠','หน้าแรก'],['pos','🛒','ขายสินค้า'],['products','📦','สินค้า/สต็อก'],['sales','🧾','บิลย้อนหลัง'],['statistics','📈','สถิติ/กำไร'],['labels','🏷️','ป้ายราคา']];return `<div class="sticky top-0 z-30 bg-white border-b shadow-sm"><div class="max-w-7xl mx-auto px-3 py-2 flex gap-2 items-center"><div class="flex-1 flex gap-1 overflow-x-auto scrollbar-thin">${tabs.map(t=>`<button onclick="activeTab='${t[0]}';menuOpen=false;render()" class="px-3 py-2 rounded-lg whitespace-nowrap font-semibold ${activeTab===t[0]?'text-white':''}" style="background:${activeTab===t[0]?state.config.primary_action_color:'transparent'}">${t[1]} ${t[2]}</button>`).join('')}</div><button onclick="syncNow(false)" class="px-2 py-2 rounded-lg ${navigator.onLine?'bg-emerald-50':'bg-slate-200'}" title="${cloudStatusText()}">${navigator.onLine?'☁️':'📴'}</button><div class="hidden md:block text-right px-2"><div class="text-xs text-slate-400">เข้าใช้งานโดย</div><div class="font-semibold text-sm">👤 ${esc(currentUser?.name||'')}</div></div><div class="relative"><button onclick="menuOpen=!menuOpen;render()" class="px-3 py-2 rounded-lg bg-slate-100">☰</button><div class="${menuOpen?'block':'hidden'} absolute right-0 bg-white shadow-xl border rounded-xl w-60 p-2">${requireRole(['owner','manager'])?`<button onclick="menuOpen=false;openSettings()" class="w-full text-left p-3 hover:bg-slate-100 rounded font-bold">⚙️ ตั้งค่าทั้งหมด</button>`:''}<div class="px-2 py-2 text-xs ${navigator.onLine?'text-emerald-600':'text-slate-500'} border-t mt-1">${cloudStatusText()}</div><div class="md:hidden px-2 py-2 text-xs text-slate-500">👤 ${esc(currentUser?.name||'')}</div><button onclick="logout()" class="w-full text-left p-2 hover:bg-red-50 text-red-600 rounded">🚪 ออกจากระบบ</button></div></div></div></div>`}
function render(){deferredCloudRender=false;const device=applyDeviceProfile();if(state.settings.requireLogin&&!currentUser)return loginScreen();const app=document.getElementById('app');app.style.background=state.config.background_color;const body=activeTab==='dashboard'?renderDashboard():activeTab==='pos'?renderPOS():activeTab==='products'?renderProducts():activeTab==='sales'?renderSales():activeTab==='statistics'?renderStats():renderLabels();const mainClass=activeTab==='pos'?'w-full p-1':(device.mode==='mobile'?'w-full p-2':'max-w-7xl mx-auto p-4');app.innerHTML=`${nav()}<main class="${mainClass}">${body}</main>`;if(activeTab==='statistics')setTimeout(drawStats,50);updateCustomerDisplay()}
function renderDashboard(){
  const st=stats(),low=state.products.filter(p=>p.stock<=n(p.lowStock,state.config.low_stock_default)).length,exp=state.products.filter(p=>['warn','expired'].includes(expiryInfo(p).level)).length,payable=state.suppliers.reduce((a,x)=>a+Math.max(0,supplierBalance(x.id)),0),shift=shiftMetrics();

    {icon:'📦',title:'สินค้า / สต็อก',desc:`สินค้า ${state.products.length} • ใกล้หมด ${low} • ใกล้หมดอายุ ${exp}`,onclick:"activeTab='products';render()"},
    {icon:'▥',title:'เพิ่มสินค้าด้วยบาร์โค้ด',desc:'สแกนบาร์โค้ดแล้วเปิดแบบฟอร์มเพิ่มสินค้าอัตโนมัติ',onclick:'openAddProductByBarcode()'},
    {icon:'🔎',title:'ค้นสินค้าฉลาด',desc:'ค้นด้วยชื่อ บาร์โค้ด หมวด คำค้น ยี่ห้อ หรือผู้ขาย',onclick:'openProductPicker()'},
    {icon:'📋',title:'เช็กสต็อกจริง',desc:`ตรวจนับล่าสุด ${state.stockCounts[0]?new Date(state.stockCounts[0].time).toLocaleDateString('th-TH'):'ยังไม่มี'}`,onclick:'openStockCount()'},
    {icon:'🚚',title:'ผู้ขาย / เจ้าหนี้',desc:`${state.suppliers.length} ผู้ขาย • ค้าง ${money(payable)}`,onclick:'openSuppliers()'},
    {icon:'🧮',title:'ปิดยอด / ปิดกะ',desc:`กะปัจจุบัน ${shift.count} บิล • ${money(shift.revenue)}`,onclick:'openShiftClose()'},
    {icon:'🧾',title:'บิลย้อนหลัง',desc:`บิลทั้งหมด ${state.sales.length} • ค้นหา พิมพ์ซ้ำ คืน/ยกเลิก`,onclick:"activeTab='sales';render()"},
    {icon:'📈',title:'สถิติและกำไร',desc:`ยอดสุทธิ ${money(st.revenue)} • กำไร ${money(st.profit)}`,onclick:"activeTab='statistics';render()"},
    {icon:'🕵️',title:'ประวัติการแก้ไข',desc:`บันทึก ${state.auditLogs.length} รายการ`,onclick:'openAuditLogs()'},
    {icon:'🖥️',title:'จอลูกค้า',desc:'เปิดหน้าต่างที่สอง แสดงสินค้า ยอด ส่วนลด และ QR',onclick:'openCustomerDisplay()'},
    {icon:'🏷️',title:'ป้ายราคา',desc:'พิมพ์ป้ายราคาและบาร์โค้ดสินค้า',onclick:"activeTab='labels';render()"}
  ];
  return `<div class="space-y-4"><section class="bg-white rounded-2xl p-5 shadow"><div class="flex flex-wrap justify-between gap-3 items-center"><div><p class="text-sm text-slate-500">เข้าสู่ระบบสำเร็จ</p><h1 class="text-2xl font-bold">สวัสดี ${esc(currentUser?.name||'ผู้ใช้')} 👋</h1><p class="text-slate-500">${esc(state.config.store_name)} • ${roleName(currentUser?.role)}<br><span class="text-indigo-500 text-xs">📐 ${deviceSummary()}</span></p></div><button onclick="startSale()" class="px-5 py-3 rounded-xl text-white font-bold" style="background:${state.config.primary_action_color}">🛒 เริ่มขายสินค้า</button></div></section>${exp?`<section class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-amber-900">⏰ มีสินค้า <b>${exp}</b> รายการใกล้หมดอายุหรือหมดอายุแล้ว — เปิดเมนูสินค้าเพื่อตรวจสอบ</section>`:''}<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">${cards.map(c=>`<button onclick="${c.onclick}" class="bg-white rounded-2xl p-5 shadow text-left hover:shadow-lg transition"><div class="text-4xl">${c.icon}</div><div class="font-bold text-lg mt-2">${c.title}</div><div class="text-sm text-slate-500 mt-1">${c.desc}</div></button>`).join('')}</div></div>`
}
function pickerProductCard(p){return `<button data-pid="${p.id}" onclick="addToCart('${p.id}');closeModal(this)" class="text-left p-3 border rounded-lg bg-white hover:bg-slate-50"><div class="h-24 rounded-lg bg-slate-100 overflow-hidden flex items-center justify-center mb-2">${safeProductImage(p.image)?`<img src="${safeProductImage(p.image)}" class="w-full h-full object-cover">`:'<span class="text-4xl">🛍️</span>'}</div><b>${esc(p.name)}</b><div class="text-xs text-slate-500">${esc(p.barcode||p.id)} • ${esc(p.category||'ทั่วไป')}</div>${p.keywords?`<div class="text-[11px] text-indigo-500 truncate">${esc(p.keywords)}</div>`:''}<div class="text-xs text-slate-500">คงเหลือ ${p.stock}</div><div class="font-bold text-emerald-600">${money(p.price)}</div></button>`}
function openProductPicker(){const list=smartProductResults('',true),rows=list.map(p=>pickerProductCard(p)).join('');modal(`<div class="bg-slate-100 rounded-xl p-4 max-w-5xl mx-auto"><div class="flex justify-between items-center mb-3"><div><h3 class="text-xl font-bold">🔎 ค้นสินค้าแบบฉลาด</h3><p class="text-xs text-slate-500">ค้นจากชื่อ บาร์โค้ด หมวดหมู่ คำค้น หรือผู้ขายสินค้า</p></div><button onclick="closeModal(this)" class="text-3xl">×</button></div><input id="smartPickerSearch" class="w-full border-2 border-indigo-200 rounded-lg p-3 mb-3 text-lg" placeholder="พิมพ์ชื่อ / บาร์โค้ด / คำค้น / ผู้ขาย" oninput="filterPicker(this.value)" autofocus><div id="pickerRows" class="grid grid-cols-2 md:grid-cols-4 gap-2 max-h-[65vh] overflow-auto">${rows||'<div class="col-span-full text-center py-12">ยังไม่มีสินค้า</div>'}</div></div>`);setTimeout(()=>document.getElementById('smartPickerSearch')?.focus(),30)}
function filterPicker(q){const box=document.getElementById('pickerRows');if(!box)return;const rows=smartProductResults(q,true);box.innerHTML=rows.length?rows.map(p=>pickerProductCard(p)).join(''):'<div class="col-span-full text-center py-12 text-slate-400">ไม่พบสินค้า • ลองพิมพ์คำสั้นลง หรือค้นด้วยบาร์โค้ด/หมวดหมู่</div>'}
function posKey(k){const input=document.getElementById('classicBarcode');if(!input)return;if(k==='C'){input.value='';return}if(k==='DEL'){input.value=input.value.slice(0,-1);return}if(k==='OK'){const code=input.value.trim();if(code){processBarcode(code);input.value=''}else if(cart.length)openPaymentPopup();return}input.value+=k;input.focus()}
function updateCashDisplay(){
  const c=calcCart(),cash=n(cashReceived),change=Math.max(0,cash-c.total),short=Math.max(0,c.total-cash);
  const box=document.getElementById('cashChangeNumber'),hint=document.getElementById('cashChangeHint');
  if(box){
    if(paymentMethod==='cash'&&short>0){box.classList.add('short');box.textContent='-'+number2(short)}
    else{box.classList.remove('short');box.textContent=paymentMethod==='cash'?number2(change):'0.00'}
  }
  if(hint){
    hint.textContent=paymentMethod==='cash'?(short>0?('รับเงินไม่พอ ขาดอีก '+number2(short)):('เงินรับ '+number2(cash)+' • เงินทอน '+number2(change))):('วิธีชำระ: '+methodName(paymentMethod));
  }
}
function posCashPreset(v){
  paymentMethod='cash';cashReceived=String(v==='exact'?calcCart().total:v);
  const input=document.getElementById('cashReceivedInput');if(input)input.value=formatCashText(cashReceived);
  const method=document.getElementById('posPaymentMethod');if(method)method.value='cash';
  updateCashDisplay();
}
function updatePaymentPopup(){
  const c=calcCart(),cash=n(document.getElementById('paymentCashInput')?.value||cashReceived),short=Math.max(0,c.total-cash),change=Math.max(0,cash-c.total);
  cashReceived=String(document.getElementById('paymentCashInput')?.value||cashReceived||'');paymentMethod='cash';
  const box=document.getElementById('paymentPopupChange'),hint=document.getElementById('paymentPopupHint'),btn=document.getElementById('paymentPopupConfirm');
  if(box){box.classList.toggle('short',short>0);box.textContent=short>0?('ขาด '+money(short)):('เงินทอน '+money(change))}
  if(hint)hint.textContent=short>0?'กรอกยอดเงินที่ลูกค้าให้มาให้ครบ':'พร้อมรับชำระ';
  if(btn)btn.disabled=short>0;
}
function setPaymentCash(v){const input=document.getElementById('paymentCashInput');if(!input)return;input.value=formatCashText(String(v));cashReceived=input.value;paymentMethod='cash';updatePaymentPopup();input.focus();input.select()}
function openPaymentPopup(){
  if(!cart.length)return toast('ยังไม่มีสินค้าในบิล',true);
  const c=calcCart();paymentMethod='cash';cashReceived='';customerDisplayStatus=`ยอดที่ต้องชำระ ${money(c.total)}`;updateCustomerDisplay();
  const m=modal(`<div class="pay-popup-card"><div class="pay-popup-total-label">ยอดที่ต้องชำระทั้งหมด</div><div class="pay-popup-total">${money(c.total)}</div><label class="pay-popup-cash-label" for="paymentCashInput">💵 เงินที่ลูกค้าให้มา</label><input id="paymentCashInput" class="pay-popup-cash" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" oninput="handlePopupCashInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmPaymentPopup(this)}"><div id="paymentPopupChange" class="pay-popup-change short">ขาด ${money(c.total)}</div><div id="paymentPopupHint" class="text-sm text-slate-500 text-right mt-1">กรอกยอดเงินที่ลูกค้าให้มา</div><div class="pay-popup-presets"><button onclick="setPaymentCash(${c.total.toFixed(2)})">พอดี</button><button onclick="setPaymentCash(100)">100</button><button onclick="setPaymentCash(500)">500</button><button onclick="setPaymentCash(1000)">1,000</button></div><div class="pay-popup-actions"><button onclick="customerDisplayStatus=null;updateCustomerDisplay();closeModal(this)" class="bg-slate-200">ยกเลิก</button><button id="paymentPopupConfirm" onclick="confirmPaymentPopup(this)" class="bg-emerald-600 text-white disabled:opacity-40" disabled>✅ รับชำระ</button></div><button onclick="customerDisplayStatus='กรุณาสแกน QR เพื่อชำระ '+money(calcCart().total);updateCustomerDisplay();closeModal(this);paymentMethod='qr';showPromptPay()" class="w-full mt-2 rounded-xl p-3 bg-indigo-100 text-indigo-800 font-bold">▣ ชำระด้วย QR พร้อมเพย์</button></div>`);
  setTimeout(()=>{const i=document.getElementById('paymentCashInput');if(i){i.focus();i.select()}},30);
  return m;
}
function confirmPaymentPopup(el){
  const c=calcCart(),input=document.getElementById('paymentCashInput');if(input)cashReceived=input.value;paymentMethod='cash';
  if(n(cashReceived)<c.total){updatePaymentPopup();return toast('รับเงินไม่เพียงพอ',true)}
  customerDisplayStatus=`รับเงิน ${money(n(cashReceived))} • เงินทอน ${money(Math.max(0,n(cashReceived)-c.total))}`;updateCustomerDisplay();closeModal(el);checkout();
}
function handleClassicEnter(input,event){
  if(event)event.preventDefault();const v=(input?.value||'').trim();
  if(v){processBarcode(v);input.value='';return}
  if(cart.length)openPaymentPopup();
}
function posNewBill(){const r={confirm:true,...(state.settings.newSaleReset||{})};if(r.confirm&&(cart.length||currentMemberId||cashReceived||calcCart().billDiscount)&&!confirm('เริ่มขายใหม่และรีเซ็ตตามค่าที่ตั้งไว้?'))return;doNewSaleReset()}
